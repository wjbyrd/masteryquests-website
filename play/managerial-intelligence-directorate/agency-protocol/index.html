<!DOCTYPE html>


<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<!-- Title can be changed to whatever the game needs -->
<title>The Agency Protocol</title>
<style>
/* =========================================
   1. VISUAL DESIGN — SAFE TO EDIT

You can change:
- Colors
- Background images
- Fonts
- Glow effects

Do NOT rename IDs (#gameBox, #mazeTrack, etc.)
or you will break JavaScript connections.
========================================= */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
    color: #e5e7eb;

    background: url('question_background_image.webp');
    background-size: cover;
    background-position: center;
}

/* corporate noir surveillance overlay */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(56,189,248,0.12),
            rgba(15,23,42,0.58) 45%,
            rgba(2,6,23,0.94) 100%);
    pointer-events:none;
    z-index:-1;
}


.dungeon-container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    margin-top: 20px;
}

/* CENTER BLOCK */
.start-content{
    width: 100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;   
    text-align:center;    
}

/* TITLE — corporate noir gold */
.title{
    font-size:64px;
    letter-spacing:4px;
    margin-bottom:10px;
    color:#f0c86a;

    text-shadow:
        0 0 10px rgba(240,200,106,0.75),
        0 0 28px rgba(56,189,248,0.30),
        0 0 48px rgba(15,23,42,0.85),
        0 3px 8px rgba(0,0,0,0.95);
}

/* SUBTITLE — cold agency blue */
.subtitle{
    font-size:34px;
    margin-bottom:35px;
    letter-spacing:2px;
    color:#bae6fd;

    text-shadow:
        0 0 14px rgba(56,189,248,0.45),
        0 0 28px rgba(14,165,233,0.22),
        0 2px 6px rgba(0,0,0,0.9);
}

/* TAGLINE */
.tagline{
    margin-bottom:30px;
    font-style:italic;
    opacity:0.92;
    color:#dbeafe;

    text-shadow:
        0 0 10px rgba(56,189,248,0.24),
        0 2px 6px rgba(0,0,0,0.9);
}

/* INPUT — agency credential panel */
.name-input{
    width:100%;
    max-width:320px;
    text-align:center;
    padding:15px;
    border-radius:10px;

    border:1px solid rgba(56,189,248,0.38);   
    background: rgba(2,6,23,0.88);          
    color:#e5e7eb;                             
    font-size:20px;
    margin-bottom:20px;
    outline:none;

    box-shadow:
        0 0 12px rgba(56,189,248,0.22),
        inset 0 0 12px rgba(0,0,0,0.78);
}

/* INPUT FOCUS — protocol activation */
.name-input:focus{
    border-color: rgba(240,200,106,0.85);
    box-shadow:
        0 0 16px rgba(240,200,106,0.45),
        0 0 34px rgba(56,189,248,0.35),
        inset 0 0 12px rgba(0,0,0,0.85);
}

/* BUTTON BASE */
.start-btn{
    width:100%;
    max-width:320px;
}

.secondary-start-btn{
    margin-top: 10px;
    background: linear-gradient(180deg, #1e293b, #020617);
    border-color: rgba(240,200,106,0.56);
    color: #f0c86a;
}

/* PLACEHOLDER */
#localIdentity::placeholder,
#username::placeholder{
    color: rgba(219,234,254,0.52);
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
}
	
/* =========================================
   2. CORE GAME CONTAINER (#gameBox) — SAFE TO STYLE
========================================= */

#gameBox {
    max-width: 750px;
    flex:1;
    min-width:0;
    width:100%;
    margin: 0;
    padding: 18px 20px;
    text-align: center;

    background: radial-gradient(circle at center,
        rgba(56,189,248,0.13) 0%,
        rgba(15,23,42,0.66) 45%,
        rgba(5,10,18,0.96) 72%,
        rgba(2,6,23,0.99) 100%);

    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-sizing: border-box;

    box-shadow:
        0 0 24px rgba(56,189,248,0.18),
        0 0 70px rgba(15,23,42,0.78),
        inset 0 0 42px rgba(0,0,0,0.82);

    border: 1px solid rgba(240,200,106,0.32);
    animation: torchFlicker 6s infinite;
    transition: box-shadow .3s ease, border-color .3s ease;
    position: relative;
}

#gameBox.boss-mode {
    border: 2px solid rgba(240,200,106,0.85);
    box-shadow:
        0 0 30px rgba(240,200,106,0.45),
        0 0 62px rgba(56,189,248,0.35),
        inset 0 0 46px rgba(0,0,0,0.88);
}

.boss-icon{
    width: 28px;
    height: 28px;
    object-fit: contain;
    pointer-events: none;
}

/* Tier 1 — Underwriter of Hidden Risk */
.boss10 .boss-icon{
    filter:
        drop-shadow(0 0 6px rgba(185,28,28,0.9))
        drop-shadow(0 0 14px rgba(240,200,106,0.55));
}

/* Tier 2 — Auditor of Moral Hazard */
.boss20 .boss-icon{
    filter:
        drop-shadow(0 0 8px rgba(56,189,248,0.95))
        drop-shadow(0 0 18px rgba(14,165,233,0.55));
}

/* Tier 3 — The Principal */
.boss30 .boss-icon{
    filter:
        drop-shadow(0 0 10px rgba(240,200,106,1))
        drop-shadow(0 0 25px rgba(56,189,248,0.65));
}

.hit {
    box-shadow:
        0 0 58px rgba(185,28,28,0.78),
        0 0 30px rgba(240,200,106,0.34),
        inset 0 0 44px rgba(2,6,23,0.92) !important;
    animation: hitshake 0.4s ease;
}

#autosave {
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 11px;
    opacity: 0.55;
    font-style: italic;
    color: #bae6fd;
    text-shadow: 0 0 6px rgba(56,189,248,0.42);
}

#questionImageBox{
    margin: 0 auto 12px auto;
    text-align: center;
    display: none;
}

#questionImageBox img{
    max-width: 100%;
    width: 420px;
    height: auto;
    border-radius: 10px;
    border: 1px solid rgba(240,200,106,0.24);
    box-shadow:
        0 0 14px rgba(56,189,248,0.20),
        0 0 30px rgba(15,23,42,0.75),
        0 0 28px rgba(0,0,0,0.78);
}
/* =========================================
   3. TEXT & TYPOGRAPHY SYSTEM — SAFE TO CUSTOMIZE
========================================= */

h2 {
    text-shadow:
        0 0 10px rgba(229,231,235,0.22),
        0 0 22px rgba(56,189,248,0.20),
        0 2px 6px rgba(0,0,0,0.9);
    margin-bottom: 5px;
}

#question {
    font-size: clamp(20px, 4vw, 22px);
    line-height: 1.4;
    font-weight: 600;
    margin: 14px 0;
    color: #e5e7eb;
    text-shadow:
        0 2px 5px rgba(0,0,0,0.92),
        0 0 8px rgba(56,189,248,0.14);
}

.boss-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
    display: block;
    color: #f0c86a;
    text-shadow:
        0 0 10px rgba(240,200,106,0.68),
        0 0 28px rgba(56,189,248,0.32),
        0 0 42px rgba(15,23,42,0.8),
        0 3px 8px rgba(0,0,0,0.94);
}

.area-title {
    color: #bae6fd;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.34),
        0 2px 5px rgba(0,0,0,0.9);
}

.boss-q {
    font-style: normal;
    line-height: 1.5;
    font-size: 24px;
    border-left: 3px solid #f0c86a;
    padding-left: 15px;
    margin: 20px 0;
    text-align: left;
    color: #e5e7eb;
    box-shadow: -4px 0 12px rgba(56,189,248,0.24);
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
}

.hint-box {
    font-size: 13px;
    color: #f0c86a;
    margin-top: 15px;
    opacity: 0.86;
    height: 18px;
    text-shadow:
        0 0 6px rgba(240,200,106,0.30),
        0 0 12px rgba(56,189,248,0.16);
}
    
.fade-out-text {
    animation: fadeOut 5s forwards;
    font-weight: bold;
    color: #f5e6b8;
    text-shadow:
        0 0 8px rgba(240,200,106,0.52),
        0 0 18px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.9);
}

#message {
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
    color: #dbeafe;
    opacity: 0.9;
    text-shadow:
        0 0 7px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.9);
}

/* Agency Protocol override */
.agency-protocol #message,
.agency #message {
    color: #bae6fd;
    font-size: 17px;
    font-style: italic;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.48),
        0 0 18px rgba(240,200,106,0.18),
        0 2px 6px rgba(0,0,0,0.9);
}
	
/* =========================================
   4. BUTTONS & INTERACTION — SAFE TO CUSTOMIZE
========================================= */

/* Base button styling — applies to all buttons */
button {
    padding: 12px 22px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;

    background: linear-gradient(180deg, #0f172a, #020617);
    color: #e5e7eb;

    border: 1px solid rgba(56,189,248,0.34);
    border-radius: 8px;

    box-shadow:
       0 0 12px rgba(56,189,248,0.20),
       0 0 24px rgba(15,23,42,0.58),
       inset 0 0 10px rgba(0,0,0,0.78);

    transition: all 0.15s ease;
}

button:hover {
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border-color: rgba(240,200,106,0.70);

    box-shadow:
        0 0 18px rgba(56,189,248,0.36),
        0 0 34px rgba(240,200,106,0.22),
        inset 0 0 12px rgba(0,0,0,0.76);

    transform: translateY(-2px) scale(1.02);
}

button:active {
    transform: scale(0.96);
}

.answers {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

.answers button {
    flex: 1 1 100%;
    min-height: 60px;
    max-width: 100%;
    padding: 15px;
    font-size: 18px;
    margin: 0;

    background: linear-gradient(180deg,
        rgba(15,23,42,0.96),
        rgba(2,6,23,0.98));

    color: #e5e7eb;
    border: 1px solid rgba(56,189,248,0.28);

    box-shadow:
        0 0 10px rgba(56,189,248,0.18),
        0 0 18px rgba(240,200,106,0.10),
        inset 0 0 14px rgba(0,0,0,0.80);
}

.answers button:hover {
    background: linear-gradient(180deg,
        rgba(30,41,59,0.98),
        rgba(15,23,42,0.98));

    border-color: rgba(240,200,106,0.66);

    box-shadow:
        0 0 18px rgba(56,189,248,0.34),
        0 0 34px rgba(240,200,106,0.22),
        inset 0 0 14px rgba(0,0,0,0.76);
}

.fullscreenBtn {
    position: absolute;
    top: 12px;
    left: 12px;

    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;

    color: #dbeafe;
    background: linear-gradient(180deg, #0f172a, #020617);

    border: 1px solid rgba(56,189,248,0.30);
    border-radius: 6px;
    cursor: pointer;

    box-shadow:
        0 0 10px rgba(56,189,248,0.22),
        inset 0 0 7px rgba(0,0,0,0.82);

    transition: all 0.15s ease;
}

.fullscreenBtn:hover {
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border-color: rgba(240,200,106,0.62);

    box-shadow:
        0 0 16px rgba(56,189,248,0.34),
        inset 0 0 8px rgba(0,0,0,0.78);
}

.fullscreenBtn:active {
    transform: scale(0.95);
    box-shadow:
        0 0 8px rgba(56,189,248,0.28),
        inset 0 0 10px rgba(0,0,0,0.88);
}

.return-menu-btn{
    position: absolute;
    top: 12px;
    right: 12px;

    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;

    color: #dbeafe;
    background: linear-gradient(180deg, #0f172a, #020617);

    border: 1px solid rgba(56,189,248,0.30);
    border-radius: 6px;
    cursor: pointer;

    box-shadow:
        0 0 10px rgba(56,189,248,0.22),
        inset 0 0 7px rgba(0,0,0,0.82);

    transition: all 0.15s ease;
}

.return-menu-btn:hover {
    color: #f0c86a;
    background: linear-gradient(180deg, #1e293b, #0f172a);
    border-color: rgba(240,200,106,0.62);

    box-shadow:
        0 0 16px rgba(56,189,248,0.34),
        inset 0 0 8px rgba(0,0,0,0.78);
}

.return-menu-btn:active {
    transform: scale(0.95);
}

.continue-btn {
    background: linear-gradient(180deg, #1e293b, #020617);
    color: #f0c86a;
    font-weight: bold;

    padding: 14px 40px;
    font-size: 18px;
    border-radius: 8px;

    border: 1px solid rgba(240,200,106,0.54);
    cursor: pointer;

    box-shadow:
        0 0 16px rgba(56,189,248,0.32),
        0 0 34px rgba(240,200,106,0.22),
        inset 0 0 12px rgba(0,0,0,0.78);

    transition: all 0.15s ease;
}

.continue-btn:hover {
    background: linear-gradient(180deg, #334155, #0f172a);

    box-shadow:
        0 0 24px rgba(56,189,248,0.46),
        0 0 42px rgba(240,200,106,0.28),
        inset 0 0 12px rgba(0,0,0,0.76);

    transform: scale(1.03);
}

#continueBtn:active {
    transform: scale(0.97);
    box-shadow:
        0 0 10px rgba(56,189,248,0.30),
        inset 0 0 10px rgba(0,0,0,0.84);
}
	
/* =========================================
   5. PROGRESS & MAZE TRACK — SAFE TO CUSTOMIZE (WITH RULES)
========================================= */
    
#progressBar {
    width: 100%;
    height: 22px;

    background: linear-gradient(180deg,
        rgba(5,10,18,0.96),
        rgba(2,6,23,0.98));

    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;

    border: 1px solid rgba(56,189,248,0.24);

    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.88),
        0 0 10px rgba(56,189,248,0.18);
}
    
#progressFill {
    height: 100%;
    width: 0%;

    background: linear-gradient(90deg,
        #0f172a,
        #38bdf8,
        #f0c86a);

    box-shadow:
        0 0 12px rgba(56,189,248,0.42),
        0 0 22px rgba(240,200,106,0.26);

    transition: width 0.4s ease;
}

#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}
    
.maze-box {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    border-radius: 6px;

    background: linear-gradient(180deg,
        rgba(15,23,42,0.76),
        rgba(2,6,23,0.94));

    border: 1px solid rgba(56,189,248,0.18);

    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.82),
        0 0 5px rgba(56,189,248,0.12);

    transition: all 0.3s ease;
}

.maze-box.active {
    background: radial-gradient(circle,
        rgba(56,189,248,0.46),
        rgba(15,23,42,0.58),
        rgba(2,6,23,0.98));

    border: 2px solid #f0c86a;

    box-shadow:
        0 0 12px rgba(56,189,248,0.72),
        0 0 24px rgba(240,200,106,0.36),
        inset 0 0 12px rgba(0,0,0,0.72);

    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(30,41,59,0.72),
        rgba(5,10,18,0.96));

    border-color: rgba(240,200,106,0.34);

    box-shadow:
        0 0 8px rgba(56,189,248,0.26),
        inset 0 0 10px rgba(0,0,0,0.78);
}

/* Boss room highlights: 10 Underwriter, 20 Auditor, 30 Principal */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #b91c1c,
        0 0 18px rgba(240,200,106,0.62);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(14,165,233,0.62);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f0c86a,
        0 0 24px rgba(56,189,248,0.64),
        0 0 34px rgba(0,0,0,0.7);
}

/* Streak styling — Agency Protocol */
.streak {
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:0.5px;
    color: rgba(229,231,235,0.96);
    text-shadow:
        0 0 7px rgba(56,189,248,0.32),
        0 2px 5px rgba(0,0,0,0.9);
}

.streak-icon {
    width:22px;
    height:22px;
    object-fit:contain;
    border-radius:50%;

    filter:
        drop-shadow(0 0 8px rgba(240,200,106,0.74))
        drop-shadow(0 0 15px rgba(56,189,248,0.36));

    background: radial-gradient(circle,
        rgba(240,200,106,0.38) 0%,
        rgba(56,189,248,0.24) 42%,
        transparent 72%);

    animation: pulseControl 2.2s ease-in-out infinite;
}
   
/* =========================================
   6. ARTIFACT SYSTEM (REWARDS) — SAFE TO CUSTOMIZE
========================================= */
    
#artifactDrop {
    margin-top: 20px;
    padding: 14px;

    background: radial-gradient(circle at center,
        rgba(56,189,248,0.16),
        rgba(15,23,42,0.74) 45%,
        rgba(5,10,18,0.96) 68%,
        rgba(2,6,23,0.99));

    border-radius: 10px;
    border: 1px solid rgba(240,200,106,0.34);

    box-shadow:
        0 0 22px rgba(56,189,248,0.22),
        0 0 42px rgba(240,200,106,0.16),
        inset 0 0 28px rgba(0,0,0,0.82);

    text-align: center;
}
    
#artifactImage {
    width: 96px;
    margin-bottom: 8px;
}

#artifactDrop img {
    filter:
        drop-shadow(0 0 14px rgba(56,189,248,0.62))
        drop-shadow(0 0 26px rgba(240,200,106,0.34));
}

#artifactVault {
    margin-top: -6px;
    width: 220px;
    padding: 18px;
    border-radius: 12px;

    background: radial-gradient(circle at top,
        rgba(56,189,248,0.15),
        rgba(15,23,42,0.74) 46%,
        rgba(5,10,18,0.96) 70%,
        rgba(2,6,23,0.99));

    border: 1px solid rgba(56,189,248,0.24);

    box-shadow:
        0 0 20px rgba(56,189,248,0.18),
        0 0 38px rgba(240,200,106,0.12),
        inset 0 0 30px rgba(0,0,0,0.82);

    text-align: center;
}

#artifactVault h3 {
    color: #f0c86a;
    text-shadow:
        0 0 10px rgba(240,200,106,0.48),
        0 0 18px rgba(56,189,248,0.20),
        0 2px 6px rgba(0,0,0,0.9);
}

.vaultRow {
    display: flex;
    justify-content: center;
    align-items:flex-end;
    gap: 15px;
    flex-wrap:wrap;
}

.artifactSlot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    min-width: 70px;
    text-align:center;
    opacity: .26;

    transition: all .4s ease;
}

.artifactSlot img {
    width: 45px;
    margin-bottom:4px;

    filter:
        brightness(0.28)
        contrast(0.9)
        saturate(0.74);

    transition: all .4s ease;
}

.artifactSlot span {
    display: block;
    font-size: 13px;
    color: rgba(219,234,254,0.42);
    margin-top: 8px;
    line-height: 1.2;
}

.artifactSlot.unlocked {
    opacity: 1;
    transform: scale(1.05);
}

.artifactSlot.unlocked img {
    filter:
        drop-shadow(0 0 14px rgba(240,200,106,0.76))
        drop-shadow(0 0 26px rgba(56,189,248,0.42))
        drop-shadow(0 0 34px rgba(15,23,42,0.72));

    animation: relicPulse 2.5s ease-in-out infinite;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.artifactSlot.unlocked span {
    color: #e5e7eb;
    font-weight: 600;
    text-shadow:
        0 0 7px rgba(56,189,248,0.34),
        0 0 14px rgba(240,200,106,0.18),
        0 2px 5px rgba(0,0,0,0.9);
}

/* =========================================
   7. BOSS EFFECTS & ATMOSPHERE — SAFE TO CUSTOMIZE
========================================= */
    
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

/* Boss 1 — The Underwriter of Hidden Risk */

/* =========================================
   9. ANIMATION SYSTEM — SAFE TO CUSTOMIZE (WITH CARE)
========================================= */

/* Ambient lighting effect */
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }

  25% {
    filter: brightness(1.04) saturate(1.04);
  }

  50% {
    filter: brightness(0.96) saturate(0.98);
  }

  75% {
    filter: brightness(1.03) saturate(1.03);
  }
}

/* Damage feedback */
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss hit feedback */
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room pulse — Agency Protocol */
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(56,189,248,0.56),
      0 0 16px rgba(240,200,106,0.22),
      inset 0 0 10px rgba(0,0,0,0.68);
  }

  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(56,189,248,0.78),
      0 0 32px rgba(240,200,106,0.34),
      0 0 42px rgba(15,23,42,0.72),
      inset 0 0 12px rgba(0,0,0,0.72);
  }

  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(56,189,248,0.62),
      0 0 24px rgba(240,200,106,0.24),
      0 0 30px rgba(15,23,42,0.62),
      inset 0 0 11px rgba(0,0,0,0.72);
  }

  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(56,189,248,0.68),
      0 0 30px rgba(240,200,106,0.30),
      0 0 38px rgba(2,6,23,0.72),
      inset 0 0 12px rgba(0,0,0,0.74);
  }
}

/* Victory title glow */
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(240,200,106,0.72),
      0 0 18px rgba(56,189,248,0.24),
      0 2px 6px rgba(0,0,0,0.94);
  }

  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(240,200,106,0.92),
      0 0 42px rgba(56,189,248,0.42),
      0 0 52px rgba(15,23,42,0.72),
      0 3px 8px rgba(0,0,0,0.94);
  }
}

/* Idle boss movement */
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Principal idle movement */
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Artifact/relic pulse — Agency Protocol */
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(240,200,106,0.68))
      drop-shadow(0 0 18px rgba(56,189,248,0.30))
      drop-shadow(0 0 24px rgba(0,0,0,0.66));
  }

  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(240,200,106,0.90))
      drop-shadow(0 0 30px rgba(56,189,248,0.42))
      drop-shadow(0 0 38px rgba(15,23,42,0.72));
  }
}

/* Streak icon pulse */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }

  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

@media (max-width: 768px){
  .fullscreenBtn,
  .return-menu-btn{
    display: none !important;
  }

  /* overall page tightening */
  .dungeon-container{
    gap: 8px;
    margin-top: 4px;
    align-items: center;
  }

  .top-panel{
    width: 100%;
    max-width: 650px;
    gap: 2px;
    margin: 0 auto 4px auto;
    align-items: center;
  }

  .top-title{
    font-size: clamp(14px, 3.6vw, 18px);
    margin-bottom: 2px;
    text-align: center;
  }

  .fullscreenBtn{
    position: static;
    display: block;
    align-self: flex-start;
    margin: 0 0 4px 0;
    padding: 6px 10px;
    font-size: 11px;
  }

/* =========================================
   MAZE TRACK (PROGRESSION GRID)

Controls:
- 30-room visual tracker (10x3 grid)
- player position feedback
- boss indicators

-----------------------------------------
SAFE TO EDIT:
- box size (.maze-box)
- spacing (gap)
- colors and glow

-----------------------------------------
USE CAUTION:
- grid-template-columns (must stay 10)
- extreme sizing (can overflow screen)

-----------------------------------------
DO NOT CHANGE:
- total structure (30 rooms)

-----------------------------------------
TIP:
On mobile, shrinking gap and font-size
saves a LOT of vertical space.

========================================= */
  #mazeTrackContainer{
    width: 100%;
    max-width: 100%;
    padding: 2px 4px;
    margin: 0 auto;
  }

  #mazeTrack{
    gap: 3px;
    width: 100%;
    justify-content: center;
  }

  .maze-box{
    aspect-ratio: 1 / 1;
    min-width: 0;
    width: 100%;
    height: auto;
    font-size: 10px;
    border-radius: 3px;
  }

  .boss-icon{
    width: 16px;
    height: 16px;
  }

/* =========================================
   ARTIFACT VAULT (REWARD DISPLAY)

Controls:
- unlocked items
- visual reward system
- top HUD footprint

-----------------------------------------
SAFE TO EDIT:
- icon size
- spacing
- label text

-----------------------------------------
USE CAUTION:
- opacity (controls locked vs unlocked)
- layout (affects mobile height)

-----------------------------------------
DO NOT MODIFY:

-----------------------------------------
TIP:
If mobile is too tall, shrink this section
or hide labels entirely.

========================================= */
  #artifactVault{

  }

/* =========================================
   ANSWER SYSTEM (INTERACTION CORE)

Controls:
- layout of answer choices
- button sizing and spacing

-----------------------------------------
SAFE TO EDIT:
- grid vs column layout
- button size (min-height)
- font size

-----------------------------------------
USE CAUTION:
- making buttons too small
- changing layout drastically

-----------------------------------------
COMMON OPTIONS:

TIP:

function updateSoundToggle(){
  const button = document.getElementById("soundToggle");
  if(!button) return;
  button.innerText = soundEnabled ? "Sound On" : "Sound Off";
}

function setAllGameAudioMuted(isMuted){
  [bgMusic, bossMusic, finalBossMusic, sfxMilestone, sfxVictory, sfxBossHit, sfxCorrect, sfxWrong]
    .filter(Boolean)
    .forEach(audio => {
      audio.muted = isMuted;
    });
}

function toggleGameSound(){
  soundEnabled = !soundEnabled;

  localStorage.setItem(SOUND_PREF_KEY, soundEnabled ? "true" : "false");
  setAllGameAudioMuted(!soundEnabled);
  updateSoundToggle();

  if(soundEnabled){
      resumeCurrentMusic();
  } else {
      pauseAllGameMusic();
  }
}
	 
function restoreSoundSetting(){
  const saved = localStorage.getItem(SOUND_PREF_KEY);

  soundEnabled = saved !== "false";

  setAllGameAudioMuted(!soundEnabled);
  updateSoundToggle();
}

function openGraphLightbox(src, altText){
    const lightbox = document.getElementById("graphLightbox");
    const lightboxImg = document.getElementById("graphLightboxImg");
    if(!lightbox || !lightboxImg || !src) return;

    lightboxImg.src = src;
    lightboxImg.alt = altText || "Expanded question graph";
    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");
}

function closeGraphLightbox(){
    const lightbox = document.getElementById("graphLightbox");
    const lightboxImg = document.getElementById("graphLightboxImg");
    if(!lightbox) return;

    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");
    if(lightboxImg) lightboxImg.removeAttribute("src");
}

document.addEventListener("click", function(event){
    const graphImg = event.target.closest("#questionImageBox img");
    if(graphImg){
        openGraphLightbox(graphImg.src, graphImg.alt);
        return;
    }

    if(event.target.id === "graphLightbox" || event.target.id === "graphLightboxClose"){
        closeGraphLightbox();
    }
});

    closeGameModal();

    if(forceRestore

        gameBox.innerHTML = initialGameBoxHTML;
    }

function pauseAllGameMusic(){
    [bgMusic, bossMusic, finalBossMusic].filter(Boolean).forEach(audio => {
        audio.pause();
    });
}

function safePlay(audio){
    if(!audio || !soundEnabled) return Promise.resolve();

    audio.muted = false;

    return audio.play().catch(error => {
        console.warn("Audio play blocked:", error);
    });
}

function playSoundEffect(audio, volume = null){
    if(!audio || !soundEnabled) return;
    if(Number.isFinite(volume)) audio.volume = volume;
    audio.pause();
    audio.currentTime = 0;
    safePlay(audio);
}

function resumeCurrentMusic(){
    if(typeof currentMusic !== "undefined"){
        if(currentMusic === "boss") return safePlay(bossMusic);
        if(currentMusic === "finalBoss") return safePlay(finalBossMusic);
        if(currentMusic === "exploration") return safePlay(bgMusic);
    }

    return safePlay(bgMusic);
}
	 
function goFullscreen(){
let el = document.documentElement;

// Check if we are ALREADY in fullscreen
let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

if (!isFullscreen) {
        // ENTER Fullscreen
        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
            el.msRequestFullscreen();
        }
    } else {
        // EXIT Fullscreen (Crucial for iOS to reset the state)
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }
}

function addRealmStat(key, amount = 1){
    const current = parseInt(localStorage.getItem(key) || "0", 10);
    localStorage.setItem(key, String((Number.isFinite(current) ? current : 0) + amount));
}

function setRealmFlag(key){
    localStorage.setItem(key, "true");
}

function updateRealmMaxStat(key, value){
    const numericValue = Number(value || 0);
    const current = parseInt(localStorage.getItem(key) || "0", 10);

    if(Number.isFinite(numericValue) && numericValue > (Number.isFinite(current) ? current : 0)){
        localStorage.setItem(key, String(numericValue));
    }
}

function isBossRoomForMode(r){
    if(gameMode === "exam" || gameMode === "timed") return false;
    if(gameMode === "bossRush") return true;
    return r === 10 || r === 20 || r === 30;
}

function getModeDisplayName(){
    if(gameMode === "timed-ended-early") return "Timed Trial Ended Early";
    if(gameMode === "timed" || gameMode === "timed-complete") return "Timed Trial";
    if(gameMode === "exam") return "Exam Drill";
    if(gameMode === "score") return "Score Attack";
    if(gameMode === "bossRush") return "Boss Rush";
    if(gameMode === "legendary") return "Legendary Mode";
    return "Standard Campaign";
}

function beginRunSession(){
    runSessionId += 1;
    return runSessionId;
}

function scheduleForCurrentRun(callback, delay){
    const scheduledSessionId = runSessionId;
    return setTimeout(() => {
        if(scheduledSessionId !== runSessionId) return;
        if(isTimedModeTerminal()) return;
        if(isTimedModeExpired()){
            endTimedModeRun();
            return;
        }
        callback();
    }, delay);
}

function isTimedModeExpired(){
    return gameMode === "timed"
        && Number.isFinite(timedModeEndTime)
        && Date.now() >= timedModeEndTime;
}

function isTimedModeTerminal(){
    return timedModeTerminal || gameMode === "timed-complete";
}

function reconcileTimedModeClock(){
    if(gameMode !== "timed" || isTimedModeTerminal()) return;

    if(isTimedModeExpired()){
        endTimedModeRun();
        return;
    }

    updateTimedModeClock();
}

document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
        reconcileTimedModeClock();
    }
});

window.addEventListener("pageshow", reconcileTimedModeClock);
window.addEventListener("focus", reconcileTimedModeClock);

function getScoreAttackStreakBonus(currentStreak){
    const bonus = SCORE_ATTACK_CONFIG.streakBonuses.find(item => currentStreak >= item.minStreak);
    return bonus ? bonus.points : 0;
}

function applyScoreAttackEvent(label, amount){
    if(!modeUsesScoreAttack()) return;

    const numericAmount = Number(amount || 0);
    if(!Number.isFinite(numericAmount) || numericAmount === 0) return;

    scoreAttackScore += numericAmount;

    // No negative scoreboard. Punishment hurts, but it does not turn into comedy.
    if(scoreAttackScore < 0){
        scoreAttackScore = 0;
    }

    scoreAttackEvents.push({
        label,
        amount: numericAmount,
        scoreAfter: scoreAttackScore,
        room,
        questionId: currentQuestion?.id || 0,
        time: Date.now()
    });

    if(scoreAttackEvents.length > 120){
        scoreAttackEvents.shift();
    }

    if(scoreAttackScore > scoreAttackBestScore){
        scoreAttackBestScore = scoreAttackScore;
        localStorage.setItem(`${SCORE_ATTACK_STORAGE_PREFIX}_bestScore`, String(scoreAttackBestScore));
    }

    updateScoreAttackHud();
    showScoreAttackFloat(label, numericAmount);
}

function applyScoreAttackForAnswer(isCorrect, responseTime){
    if(!modeUsesScoreAttack()) return;

    if(isCorrect){
        applyScoreAttackEvent("Correct", SCORE_ATTACK_CONFIG.correct);

        const speedBonus = getScoreAttackSpeedBonus(responseTime);
        if(speedBonus > 0){
            applyScoreAttackEvent("Speed", speedBonus);
        }

        const streakBonus = getScoreAttackStreakBonus(streak);
        if(streakBonus > 0){
            applyScoreAttackEvent("Streak", streakBonus);
        }

        return;
    }

    const penalty = responseTime < 4000
        ? SCORE_ATTACK_CONFIG.rapidMissPenalty
        : SCORE_ATTACK_CONFIG.wrongPenalty;

    applyScoreAttackEvent(responseTime < 4000 ? "Rapid Miss" : "Wrong", penalty);
}

function applyScoreAttackRapidGuessPenalty(){
    if(!modeUsesScoreAttack()) return;

    applyScoreAttackEvent("Rapid Guess", SCORE_ATTACK_CONFIG.rapidMissPenalty);
}

function getScoreAttackResolveDelay(isCorrect){
    if(!modeUsesScoreAttack()) return 0;

    return isCorrect
        ? SCORE_ATTACK_CONFIG.resolveDelayCorrectMs
        : SCORE_ATTACK_CONFIG.resolveDelayWrongMs;

function waitForScoreAttackResolve(isCorrect){
    const delay = getScoreAttackResolveDelay(isCorrect);

    if(!delay || delay <= 0){

    }

    return new Promise(resolve => setTimeout(resolve, delay));
}

function generatePseudonymFromSeed(seed) {
    const titles = [
        "Axiom", "Ledger", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];
    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Registrar",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];
    let hash = 0;
    const cleanSeed = String(seed || "agency-protocol").trim().toLowerCase();
    for (let i = 0; i < cleanSeed.length; i++) {
        hash = ((hash << 5) - hash) + cleanSeed.charCodeAt(i);
        hash |= 0;
    }
    const positiveHash = Math.abs(hash);
    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);
    return `${title}${role}${number}`;
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

    let weakestTag = null;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){

    return strongestTag;
}

            if(!bucket) return;

            attempts += bucket.attempts || 0;
            correct += bucket.correct || 0;
            weightedTime += (bucket.avgTime || 0) * (bucket.attempts || 0);
        }
    });

    return {
        attempts,
        correct,
        accuracy: attempts ? correct / attempts : null,
        avgTime: attempts ? weightedTime / attempts : 0
    };
}

function getWeakestBossObjective(bank){
    if(!Array.isArray(bank) || bank.length === 0) return null;
    const objectives = [...new Set(bank.map(q => getBossObjectiveKey(q)).filter(Boolean))];
    const eligibleObjectives = objectives.filter(obj => bank.filter(q => getBossObjectiveKey(q) === obj).length >= 3);
    if(eligibleObjectives.length === 0) return null;
    const scored = eligibleObjectives.map(obj => ({ objective: obj, score: getBossObjectiveWeaknessScore(obj) }));
    const maxScore = Math.max(...scored.map(item => item.score));
    const tied = scored.filter(item => item.score === maxScore);
    return tied[Math.floor(Math.random() * tied.length)].objective;
}

function getScaffoldedBossGroups(bank){
    if(!Array.isArray(bank) || bank.length === 0) return [];
    const grouped = {};
    bank.forEach(question => {
        const objective = getBossObjectiveKey(question);
        if(!objective) return;
        (grouped[objective] ||= []).push(question);
    });
    const groups = [];
    Object.values(grouped).forEach(objectiveQuestions => {
        const sorted = [...objectiveQuestions].sort((a,b) => a.id - b.id);
        for(let i=0; i+2<sorted.length; i+=3) groups.push(sorted.slice(i,i+3));
        const remainder = sorted.length % 3;
        if(remainder && sorted.length > 3){
            const tail = sorted.slice(-3);
            if(!groups.some(group => group.length===3 && group.every((q,idx)=>q.id===tail[idx].id))){
                groups.push(tail);
            }
        }
    });
    return groups;
}

function getBossObjectiveWeaknessScore(objectiveKey){
    const stats = getObjectiveFamilyStats(objectiveKey);
    let score = 0.25;
    if(stats.accuracy !== null){
        score = (1 - stats.accuracy) * 2 + Math.min(stats.attempts, 5) * 0.08;
    }
    const recentMisses = (masteryState.recent || []).filter(item => {
        const itemObjective = item.objective || "";
        return (itemObjective === objectiveKey || itemObjective.startsWith(objectiveKey + "_")) && !item.correct;
    }).length;
    score += recentMisses * 0.25;
    if(stats.avgTime && stats.avgTime > TYPE_TIME_TARGETS.default) score += 0.15;
    return score;
}

function pickLegendaryBossQuestions(bank){
    const usedIds = new Set(usedQuestions.legendaryBoss || []);
    const groups = getScaffoldedBossGroups(bank || []);
    const records = groups.map(group => ({
        objective: getBossObjectiveKey(group[0]),
        questions: group,
        unused: group.every(question => !usedIds.has(question.id)),
        score: getBossObjectiveWeaknessScore(getBossObjectiveKey(group[0]))
    }));
    let candidates = records.filter(record => record.unused);
    if(candidates.length === 0) candidates = records;
    const fresh = candidates.filter(record => !legendaryBossObjectivesUsedThisRun.includes(record.objective));
    if(fresh.length > 0) candidates = fresh;
    if(candidates.length === 0) return [...(bank || [])].sort((a,b)=>a.id-b.id).slice(0,3);
    const highest = Math.max(...candidates.map(record => record.score));
    const tied = candidates.filter(record => record.score === highest);
    const selected = tied[Math.floor(Math.random()*tied.length)];
    legendaryBossObjectivesUsedThisRun.push(selected.objective);
    if(legendaryBossObjectivesUsedThisRun.length > 3) legendaryBossObjectivesUsedThisRun.shift();
    return [...selected.questions];
}

function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);

    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}

function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        if(state.skill && microSkillRepairPools[state.skill]){
            const skillRepairPool = microSkillRepairPools[state.skill] || [];
            const skillRepairCandidates = getQuestionsMatchingNeed(
                skillRepairPool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillRepairCandidates.length > 0){
                return weightedPick(skillRepairCandidates, {
                    mode: "support",
                    purpose: "repair"
                });
            }
        }

        const allRepairPool = dedupeQuestionsById(
            Object.values(microSkillRepairPools || {}).reduce((all, pool) => all.concat(pool), [])
        );
        const repairCandidates = getQuestionsMatchingNeed(
            allRepairPool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(repairCandidates.length > 0){
            return weightedPick(repairCandidates, {
                mode: "support",
                purpose: "repair"
            });
        }
    }

    if(state.stage === "bridge"){
        if(state.skill && microSkillBridgePools[state.skill]){
            const skillBridgePool = microSkillBridgePools[state.skill] || [];
            const skillBridgeCandidates = getQuestionsMatchingNeed(
                skillBridgePool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillBridgeCandidates.length > 0){
                return weightedPick(skillBridgeCandidates, {
                    mode: "support",
                    purpose: "confirm"
                });
            }
        }

        const bridgePool = microSkillBridgePools[state.skill] || [];
        const allBridgePool = dedupeQuestionsById(
            Object.values(microSkillBridgePools || {}).reduce((all, pool) => all.concat(pool), [])
        );

        const bridgeCandidates = getQuestionsMatchingNeed(
            allBridgePool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(bridgeCandidates.length > 0){
            return weightedPick(bridgeCandidates, {
                mode: "support",
                purpose: "confirm"
            });
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}
	 
function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {
            id: 999999,
            q: "No question pool is available for this room. Check the questionBanks configuration.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            a: 0,
            tag: "system",
            type: "default",
            objective: "system_check",
            feedback: "A question pool is missing."
        };
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

function storeTimedTrialResult(accuracy, reachedRoom, finalRoom = room){

function startTimedModeClock(){
    timedModeTerminal = false;
    timedModeEndTime = Date.now() + timedModeDurationMs;

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "flex";

    updateTimedModeClock();

    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
    }

    timedModeTimerInterval = setInterval(updateTimedModeClock, 250);
}

function stopTimedModeClock(){
    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
        timedModeTimerInterval = null;
    }

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "none";

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.classList.remove("timer-warning");
        timerDisplay.innerText = "10:00";
    }
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

// =============================================
// ANSWER SHUFFLING — DO NOT MODIFY CORE LOGIC
// =============================================
// Randomizes answer choices while preserving
// the correct answer index.
//
// Steps:
// 1. Copy original question (prevents mutation)
// 2. Store correct answer value
// 3. Shuffle options
// 4. Recalculate correct index (q.a)
//
// ---------------------------------------------
// DO NOT MODIFY:
// - correct answer tracking logic
// - q.a reassignment
// - structure of returned object
//
// Breaking this WILL cause:
// - incorrect answers being marked correct
// - correct answers being marked wrong
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding extra fields (if needed)
// - minor formatting changes
//
// This function ensures fairness in answer order.
// =============================================   
function shuffleOptions(question){
    const q = {
        ...question,
        options: [...(question.options || [])],
        secondarySkills: [...(question.secondarySkills || [])]
    };

    // Faculty source questions use a numeric answer index.
    // Published student questions use aHash tied to normalized option text.
    const correctText = Number.isInteger(question.a)
        ? question.options[question.a]
        : null;

    for(let i = q.options.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    if(correctText !== null){
        q.a = q.options.indexOf(correctText);
    } else {
        delete q.a;
    }

    return q;
}

function randomQuestion(poolName) {
    let pool = questionBanks[poolName];

    // Safety check in case poolName is invalid
    if (!pool) return null;
    
    let used = [
        ...usedQuestions.easy,
        ...usedQuestions.medium,
        ...usedQuestions.hard,
        ...usedQuestions.easyBoss,
        ...usedQuestions.mediumBoss,
        ...usedQuestions.finalBoss,
        ...usedQuestions.legendaryBoss,
    ];

    let available = pool.filter(q => !used.includes(q.id));

    if (available.length === 0) {
        usedQuestions[poolName] = [];
        available = pool;
    }

    // Avoid three identical question types in a row
    let filtered = available;

    if (lastTypes.length >= 2) {
        let last1 = lastTypes[lastTypes.length - 1];
        let last2 = lastTypes[lastTypes.length - 2];

        if (last1 === last2) {
            filtered = available.filter(q => q.type !== last1);
            if (filtered.length === 0) filtered = available;
        }
    }

    usedQuestions[poolName].push(question.id);

    // Track types
    lastTypes.push(question.type);
    if (lastTypes.length > 3) {
        lastTypes.shift();
    }

    return question;
}

// =============================================
// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:
// - no immediate repeats
// - full coverage before reuse
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding new generators (calculationGenerators)
// - modifying pool content
//
// DO NOT MODIFY:
// - shuffle logic
// - bag system (calcBag, _remaining)
// - pop() usage
//
// Breaking this WILL cause:
// - repeated questions
// - uneven distribution
// - predictable patterns
//
// This ensures randomness WITHOUT repetition.
// =============================================     

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    if(rapidGuessHistory.length < RAPID_GUESS_CONFIG.minAttempts){
        return {
            triggered: false,
            avgTime: responseTime,
            accuracy: isCorrect ? 1 : 0
        };
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);

    const avgTime = recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length;
    const accuracy = recent.reduce((sum, item) => sum + item.correct, 0) / recent.length;
    const burst = recent.slice(-RAPID_GUESS_CONFIG.burstWindowSize);
    const burstFastCount = burst.filter(item =>
        item.responseTime < RAPID_GUESS_CONFIG.burstFastMs
    ).length;
    const burstAccuracy = burst.length
        ? burst.reduce((sum, item) => sum + item.correct, 0) / burst.length
        : 1;
    const rollingPattern = avgTime < RAPID_GUESS_CONFIG.avgTimeMs
        && accuracy < RAPID_GUESS_CONFIG.maxAccuracy;
    const burstPattern = burst.length === RAPID_GUESS_CONFIG.burstWindowSize
        && burstFastCount >= RAPID_GUESS_CONFIG.burstMinFast
        && burstAccuracy <= RAPID_GUESS_CONFIG.burstMaxAccuracy;

    return {
        triggered: rollingPattern || burstPattern,
        avgTime,
        accuracy
    };
}

async function isQuestionAnswerCorrect(question, selectedIndex){
    if(!question || !Array.isArray(question.options)) return false;
    const selectedOptionText = question.options[selectedIndex] ?? "";
    if(typeof question.aHash === "string"){
        if(typeof isPublishedAnswerCorrect !== "function"){
            throw new Error("Published answer verification helper is missing.");
        }
        return isPublishedAnswerCorrect(question, selectedOptionText);
    }
    return Number.isInteger(question.a) && selectedIndex === question.a;
}

async function verifyQuestionAnswerWithTimeout(question, selectedIndex, timeoutMs = 5000){
    let timeoutId = null;

    const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
            reject(new Error("Answer verification timed out."));
        }, timeoutMs);
    });

    try {
        return await Promise.race([
            isQuestionAnswerCorrect(question, selectedIndex),
            timeoutPromise
        ]);
    } finally {
        if(timeoutId !== null){
            clearTimeout(timeoutId);
        }
    }
}

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|AGENCY01)
// - hashing logic
// - return format ("AGENT-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "AGENT-42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|AGENCY01`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "AGENT-" + Math.abs(hash).toString(36).toUpperCase();
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function titleCase(value){
    return String(value || "")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

function formatMasteryLabel(key){
    if(!key) return "Unlabeled Concept";

    const text = String(key);
    const exactLabel = AGENCY_PROTOCOL_OBJECTIVE_LABELS[text];

    if(exactLabel){
        return /^LO\d+\.\d+$/.test(text)
            ? `${text} — ${exactLabel}`
            : exactLabel;
    }

    const objectiveMatch = text.match(/^(LO\d+\.\d+)/);
    if(objectiveMatch && AGENCY_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]]){
        const suffix = text
            .replace(objectiveMatch[1], "")
            .replace(/^_+/, "")
            .replace(/_/g, " ")
            .trim();

        return suffix
            ? `${objectiveMatch[1]} — ${AGENCY_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]]}: ${titleCase(suffix)}`
            : `${objectiveMatch[1]} — ${AGENCY_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]]}`;
    }

    return titleCase(text);
}

function formatPercent(value){
    if(value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
    return `${Math.round(Number(value) * 100)}%`;
}

function formatSeconds(ms){
    const numeric = Number(ms || 0);
    if(!Number.isFinite(numeric) || numeric <= 0) return "—";
    return `${Math.round(numeric / 1000)}s`;
}

function getBucketEntry(key, bucket, category = "concept"){
    if(!bucket || !bucket.attempts){
        return null;
    }

    const attempts = Number(bucket.attempts || 0);
    const correct = Number(bucket.correct || 0);
    const accuracy = attempts ? correct / attempts : null;
    const typeForTiming = category === "type" ? key : "default";
    const target = getTypeTargetMs(typeForTiming);
    const avgTime = Number(bucket.avgTime || 0);
    const timeRatio = avgTime && target ? avgTime / target : 1;
    const fluency = accuracy === null
        ? 0
        : accuracy - clamp((timeRatio - 1) * 0.25, 0, 0.35);

    return {
        key,
        label: formatMasteryLabel(key),
        category,
        attempts,
        correct,
        accuracy,
        avgTime,
        timeRatio,
        fluency
    };
}

function getEntriesFromBuckets(source, category = "concept"){
    return Object.entries(source || {})
        .map(([key, bucket]) => getBucketEntry(key, bucket, category))
        .filter(Boolean);
}

function getTypeMasteryEntries(){
    const typeBuckets = {};

    Object.values(masteryState.byTag || {}).forEach(tagBucket => {
        Object.entries(tagBucket.byType || {}).forEach(([type, bucket]) => {
            if(!typeBuckets[type]){
                typeBuckets[type] = { attempts: 0, correct: 0, avgTime: 0 };
            }

            const oldAttempts = typeBuckets[type].attempts;
            const newAttempts = oldAttempts + Number(bucket.attempts || 0);

            typeBuckets[type].correct += Number(bucket.correct || 0);
            typeBuckets[type].avgTime = newAttempts
                ? ((typeBuckets[type].avgTime * oldAttempts) + (Number(bucket.avgTime || 0) * Number(bucket.attempts || 0))) / newAttempts
                : 0;
            typeBuckets[type].attempts = newAttempts;
        });
    });

    return getEntriesFromBuckets(typeBuckets, "type");
}

function sortStrongest(entries){
    return [...entries]
        .filter(entry => entry.attempts >= 2)
        .sort((a,b) => (b.accuracy - a.accuracy) || (b.fluency - a.fluency) || (b.attempts - a.attempts));
}

function sortWeakest(entries){
    const enoughData = entries.filter(entry => entry.attempts >= 2);
    const pool = enoughData.length ? enoughData : entries;

    return [...pool]
        .sort((a,b) => (a.accuracy - b.accuracy) || (a.fluency - b.fluency) || (b.avgTime - a.avgTime));
}

function getMeaningfulWeakEntries(entries, accuracyThreshold = 0.85){
    return sortWeakest(entries)
        .filter(entry => entry && entry.attempts >= 2)
        .filter(entry => {
            const accuracy = entry.accuracy === null || entry.accuracy === undefined
                ? 1
                : Number(entry.accuracy);

            return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
        });
}

function hasMeaningfulWeakness(entries, accuracyThreshold = 0.85){
    return (entries || []).some(entry => {
        if(!entry || entry.attempts < 2) return false;

        const accuracy = entry.accuracy === null || entry.accuracy === undefined
            ? 1
            : Number(entry.accuracy);

        return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
    });
}

function renderMasteryRows(entries, emptyText){

    return entries.map(entry => {

        const pace = entry.timeRatio > 1.25

function getRecentBehaviorSignals(){
    const recent = masteryState.recent || [];
    let fastMisses = 0;
    let slowCorrects = 0;
    let recentCorrect = 0;
    let recentTimeTotal = 0;

    recent.forEach(item => {
        const target = getTypeTargetMs(item.type || "default");
        const responseTime = Number(item.responseTime || 0);

        if(item.correct) recentCorrect++;
        if(responseTime) recentTimeTotal += responseTime;

        if(!item.correct && responseTime > 0 && responseTime < target * 0.55){
            fastMisses++;
        }

        if(item.correct && responseTime > target * 1.20){
            slowCorrects++;
        }
    });

    return {
        count: recent.length,
        accuracy: recent.length ? recentCorrect / recent.length : null,
        avgTime: recent.length ? recentTimeTotal / recent.length : 0,
        fastMisses,
        slowCorrects
    };
}

function getInstructionalResourceConfig(){

    if(!config || typeof config !== "object"){

function validateInstructionalResourceConfig(config){
    if(!config || typeof config !== "object") return false;
    if(!config.chapters || typeof config.chapters !== "object"){
        console.warn("[The Agency Protocol] Instructional-resource catalog has no chapters object.");
        return false;

}
function normalizeLearningObjectiveId(value){
    const match = String(value || "").trim().match(/(?:LO\s*)?(\d+)\s*[._\-\s]\s*(\d+)/i);
    return match ? `${Number(match[1])}.${Number(match[2])}` : null;
}
function getChapterFromLearningObjective(value){
    const normalized = normalizeLearningObjectiveId(value);
    return normalized ? normalized.split(".")[0] : null;
}
function getObjectiveResourceMapping(config, normalizedObjective){
    if(!config || !config.objectives || typeof config.objectives !== "object") return null;
    return Object.entries(config.objectives).find(([id]) => normalizeLearningObjectiveId(id) === normalizedObjective)?.[1] || null;
}
function isSafeInstructionalResourceUrl(value){
    if(typeof value !== "string" || !value.trim()) return false;
    const url = value.trim();
    if(/^https:\/\//i.test(url)){
        try { return new URL(url).protocol === "https:"; }
        catch(error) { console.warn("[The Agency Protocol] Ignoring an invalid resource URL.", error); return false; }
    }
    return /^resources\/(?:[^\\/:?#]+\/)*[^\\/:?#]+\.(?:ppt|pptx|pdf)$/i.test(url)
        && !/(?:^|\/)\.\.(?:\/|$)/.test(url);
}
function resolveInstructionalResourceById(config, resourceId){
    if(!config || !resourceId) return null;
    for(const chapter of Object.values(config.chapters || {})){
        for(const resource of (Array.isArray(chapter?.resources) ? chapter.resources : [])){
            if(resource?.id !== resourceId) continue;
            if(typeof resource.title !== "string" || !resource.title.trim() || !isSafeInstructionalResourceUrl(resource.url)){
                console.warn(`[The Agency Protocol] Ignoring malformed instructional resource: ${resourceId}`);
                return null;
            }
            return resource;
        }
    }
    console.warn(`[The Agency Protocol] Instructional resource ID was not found: ${resourceId}`);
    return null;
}
function getRecommendedResources(weakObjectiveIds){
    const config = getInstructionalResourceConfig();
    if(!config || !Array.isArray(weakObjectiveIds) || weakObjectiveIds.length === 0) return [];
    const settings = config.settings && typeof config.settings === "object" ? config.settings : {};
    const maximum = Math.max(1, Math.min(3, Number(settings.maximumRecommendations) || 3));
    const allowFallback = settings.enableChapterFallback !== false;
    const selected = new Map();
    function addResource(resource){
        if(!resource?.id || selected.has(resource.id) || !isSafeInstructionalResourceUrl(resource.url)) return;
        selected.set(resource.id, resource);
    }
    weakObjectiveIds.forEach(objectiveId => {
        if(selected.size >= maximum) return;
        const normalized = normalizeLearningObjectiveId(objectiveId);
        if(!normalized) return;
        const mapping = getObjectiveResourceMapping(config, normalized);
        (Array.isArray(mapping?.resourceIds) ? mapping.resourceIds : [])
            .map(id => resolveInstructionalResourceById(config, id)).filter(Boolean).forEach(addResource);
        if(!allowFallback || selected.size >= maximum) return;
        const chapter = config.chapters?.[getChapterFromLearningObjective(normalized)];
        if(!chapter || !Array.isArray(chapter.resources)) return;
        const fallbackResources = Array.isArray(chapter.fallbackResourceIds)
            ? chapter.fallbackResourceIds.map(id => resolveInstructionalResourceById(config, id)).filter(Boolean)
            : chapter.resources.slice().sort((a, b) => (Number(a?.priority) || 999) - (Number(b?.priority) || 999));
        fallbackResources.forEach(addResource);
    });
    return Array.from(selected.values()).slice(0, maximum);
}
function getWeakLearningObjectiveIds(report){
    return report?.hasObjectiveWeakness && Array.isArray(report.weakestObjectives)
        ? report.weakestObjectives.map(entry => entry?.key).filter(Boolean) : [];
}
function getInstructionalObjectiveTitle(objectiveId){
    const normalized = normalizeLearningObjectiveId(objectiveId);
    const config = getInstructionalResourceConfig();
    const mappedTitle = normalized ? getObjectiveResourceMapping(config, normalized)?.title : "";
    return mappedTitle ? `LO ${normalized} — ${mappedTitle}` : (normalized ? `LO ${normalized}` : formatMasteryLabel(objectiveId));
}
function getInstructionalResourceActionLabel(resource){
    if(typeof resource?.actionLabel === "string" && resource.actionLabel.trim()) return resource.actionLabel;
    return resource?.type === "slides" ? "Open Slides" : "Watch Video";
}

function getMasteryReportData(){
    const totalTimeMs = freezeCompletionTime();
    const accuracy = totalAttempts > 0 ? correctAnswers / totalAttempts : 0;
    const tagEntries = getEntriesFromBuckets(masteryState.byTag || {}, "tag");
    const objectiveEntries = getEntriesFromBuckets(masteryState.byObjective || {}, "objective");
    const skillEntries = getEntriesFromBuckets(masteryState.bySkill || {}, "skill");
    const typeEntries = getTypeMasteryEntries();
    const behavior = getRecentBehaviorSignals();

    const strongest = sortStrongest([...objectiveEntries, ...tagEntries]).slice(0, 4);
    const weakestObjectives = getMeaningfulWeakEntries(objectiveEntries, 0.85).slice(0, 4);
    const weakestTypes = getMeaningfulWeakEntries(typeEntries, 0.85).slice(0, 3);
    const weakestSkills = getMeaningfulWeakEntries(skillEntries, 0.85).slice(0, 3);

    const hasObjectiveWeakness = weakestObjectives.length > 0;
    const hasTypeWeakness = weakestTypes.length > 0;
    const hasSkillWeakness = weakestSkills.length > 0;
    const hasBehaviorWeakness = behavior.fastMisses >= 2 || behavior.slowCorrects >= 3;
    const noMajorWeakness = totalAttempts >= 8
        && accuracy >= 0.85
        && !hasObjectiveWeakness
        && !hasTypeWeakness
        && !hasSkillWeakness
        && !hasBehaviorWeakness;

    let verdict = "The Principal found enough signal to build a report. Use it. Ignoring it would be malpractice with extra steps.";

    if(totalAttempts < 5){
        verdict = "The report is limited because this run has very few attempts. The Protocol needs more evidence before it can judge mastery with confidence.";
    } else if(noMajorWeakness){
        verdict = "No major weakness detected. That does not mean the Protocol is done with you. It means the next useful signal comes from harder pressure: Legendary Mode first, Score Attack after that.";
    } else if(accuracy >= 0.90){
        verdict = "Strong command. You cleared the Protocol with high accuracy. The signals below show where the next pressure test should focus, without pretending perfect categories are weaknesses.";
    } else if(accuracy >= 0.75){
        verdict = "Battle-ready, but not bulletproof. The weak areas below are where points will leak on an exam.";
    } else {
        verdict = "Unstable command. You finished, but the Protocol exposed weak signals. Hit the listed areas before chasing speed or Legendary Mode.";
    }

    const nextSteps = [];

    if(noMajorWeakness){
        nextSteps.push("Enter Legendary Mode next. The current run did not expose a major weak point, so harder multi-step and trap-heavy questions are the right next test.");
        nextSteps.push("Use Score Attack after Legendary Mode feels stable. Speed pressure is useful only after mastery survives harder questions.");
    } else {
        if(hasObjectiveWeakness && weakestObjectives[0]){
            nextSteps.push(`Review ${weakestObjectives[0].label}. That objective showed the weakest mastery signal.`);
        }

        if(hasTypeWeakness && weakestTypes[0]){
            nextSteps.push(`Practice ${weakestTypes[0].label} questions. That question form caused the most trouble.`);
        }

        if(hasSkillWeakness && weakestSkills[0]){
            nextSteps.push(`Drill ${weakestSkills[0].label}. That skill needs cleaner repetition.`);
        }

        if(behavior.fastMisses >= 2){
            nextSteps.push("Slow down on traps and graph-style items. Fast misses are not fluency. They are just wrong answers with confidence.");
        } else if(behavior.slowCorrects >= 3){
            nextSteps.push("You can get answers right, but some correct responses were slow. Build speed only after the reasoning is automatic.");
        }
    }

    if(nextSteps.length === 0){
        nextSteps.push("Run a harder mode next. The current evidence does not show a major weak point. Make the Protocol earn its paycheck.");
    }

    return {
        mode: getMasteryReportModeName(),
        accuracy,
        totalTimeMs,
        timeString: formatTime(totalTimeMs),
        totalAttempts,
        correctAnswers,
        maxStreak,
        score: modeUsesScoreAttack() ? scoreAttackScore : null,
        strongest,
        weakestObjectives,
        weakestTypes,
        weakestSkills,
        hasObjectiveWeakness,
        hasTypeWeakness,
        hasSkillWeakness,
        noMajorWeakness,
        behavior,
        verdict,
        nextSteps
    };
}

        "",

        "",

        "",

        ...(report.hasSkillWeakness && report.weakestSkills.length ? report.weakestSkills.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major skill weakness detected."]),
        "",
        "Next Moves:",
        ...report.nextSteps.map(step => `- ${step}`),
        "",
        "Recommended Review:",
        ...(reviewResources.length
            ? reviewResources.flatMap(resource => [
                `- ${resource.title}`,
                `  Type: ${INSTRUCTIONAL_RESOURCE_TYPE_LABELS[resource.type] || INSTRUCTIONAL_RESOURCE_TYPE_LABELS.other}`,
                `  URL: ${resource.url}`
            ])
            : ["- No review material is available for the current objective signals."])
    ].filter(line => line !== null);
    const text = lines.join("\n");
    function markCopied(){
        const btn = Array.from(document.querySelectorAll("button"))
            .find(button => button.innerText === "Copy Report" || button.innerText === "Copied!");
        if(!btn) return;
        const original = btn.innerText;
        btn.innerText = "Copied!";
        scheduleForCurrentRun(() => { btn.innerText = original; }, 1800);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(markCopied);
        return;
    }
    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
    markCopied();
}

// UTILITIES

// =============================================
// ARRAY SHUFFLE UTILITY — SAFE TO USE, DO NOT MODIFY
// =============================================
// Fisher-Yates shuffle algorithm.
//
// Used to randomize:
// - question order
// - calculation generators
// - any randomized sequences
//
// DO NOT MODIFY unless you understand:
// - uniform randomness
// - bias in random selection
//
// Breaking this = predictable patterns in questions
// =============================================     
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
}     

// =============================================
// HIGH SCORE TRACKING — OPTIONAL FEATURE
// =============================================
// Stores top completion times in browser (localStorage)
//
// - Saves name, time, and date
// - Sorts fastest → slowest
// - Keeps top 5 results only
//
// SAFE TO EDIT:
// - number of scores kept (slice)
// - displayed fields (name/date)
//
// WARNING:
// Clearing browser data will erase scores.
// =============================================
function updateHighScores(newTimeMs) {
    let scores = JSON.parse(localStorage.getItem("agencyProtocolHighScores")) || [];
    scores.push({ name: username, time: newTimeMs, date: new Date().toLocaleDateString() });
    
    // Sort by time (lowest/fastest first) and keep top 5
    scores.sort((a, b) => a.time - b.time);
    scores = scores.slice(0, 5);
    
    localStorage.setItem("agencyProtocolHighScores", JSON.stringify(scores));
    return scores;
}

// =============================================
// TIME FORMATTER — SAFE UTILITY
// =============================================
// Converts milliseconds → readable format (Xm Ys)
//
// Used for:
// - victory screen
// - performance tracking
//
// Safe to modify format if desired.
// =============================================     
function formatTime(ms) {
    let mins = Math.floor(ms / 60000);
    let secs = Math.floor((ms / 1000) % 60);
    return `${mins}m ${secs}s`;
}

// LOCAL QUESTION TELEMETRY — NO NETWORK TRANSMISSION
