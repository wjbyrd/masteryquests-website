/* =========================================
   5. PROGRESS & MAZE TRACK — SAFE TO CUSTOMIZE (WITH RULES)
========================================= */
    
/* Progress bar container — background track */
#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(3,10,24,0.95),
        rgba(2,6,23,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(56,189,248,0.22);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.82),
        0 0 10px rgba(56,189,248,0.12);
}
    
/* Progress fill — width controlled by JS */
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #0b3b5a,
        #38bdf8,
        #0ea5e9);
    box-shadow:
        0 0 12px rgba(56,189,248,0.45),
        0 0 22px rgba(14,165,233,0.25);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}
    
/* Individual room cell — default state */
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.72),
        rgba(2,6,23,0.86));
    border: 1px solid rgba(56,189,248,0.18);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.72),
        0 0 5px rgba(56,189,248,0.08);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */
.maze-box.active {
    background: radial-gradient(circle,
        rgba(56,189,248,0.48),
        rgba(37,99,235,0.36),
        rgba(3,10,24,0.92));
    border: 2px solid #f8d981;
    box-shadow:
        0 0 12px rgba(248,217,129,0.78),
        0 0 24px rgba(56,189,248,0.48),
        inset 0 0 12px rgba(0,0,0,0.62);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(37,99,235,0.62),
        rgba(3,10,24,0.88));
    border-color: rgba(56,189,248,0.38);
    box-shadow:
        0 0 8px rgba(56,189,248,0.28),
        inset 0 0 10px rgba(0,0,0,0.7);
}

/* Boss room highlights (10, 20, 30) — visual only */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(37,99,235,0.8);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #60a5fa,
        0 0 18px rgba(14,165,233,0.75);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f8d981,
        0 0 24px rgba(14,165,233,0.95),
        0 0 34px rgba(56,189,248,0.42);
}

    padding: 14px;
    background: radial-gradient(circle at center,
        rgba(37,99,235,0.34),
        rgba(3,10,24,0.96) 62%,
        rgba(2,6,23,0.98));
    border-radius: 10px;
    border: 1px solid rgba(56,189,248,0.34);
    box-shadow:
        0 0 22px rgba(56,189,248,0.28),
        0 0 42px rgba(14,165,233,0.22),
        inset 0 0 28px rgba(0,0,0,0.76);
    text-align: center;
}

	
/* Artifact image in popup */
#artifactImage {
    width: 96px;
    margin-bottom: 8px;
}

#artifactDrop img {
    filter:
        drop-shadow(0 0 14px rgba(248,217,129,0.82))
        drop-shadow(0 0 26px rgba(14,165,233,0.42));
}

	
/* Persistent artifact collection display (top panel) */
#artifactVault {
    margin-top: -6px;
    width: 220px;
    padding: 18px;
    border-radius: 12px;
    background: radial-gradient(circle at top,
        rgba(37,99,235,0.42),
        rgba(3,10,24,0.96) 58%,
        rgba(2,6,23,0.98));
    border: 1px solid rgba(56,189,248,0.3);
    box-shadow:
        0 0 20px rgba(56,189,248,0.22),
        0 0 38px rgba(8,47,73,0.20),
        inset 0 0 30px rgba(0,0,0,0.76);
    text-align: center;
}

	
#artifactVault h3 {
    color: #f8d981;
    text-shadow:
        0 0 10px rgba(56,189,248,0.52),
        0 2px 6px rgba(0,0,0,0.85);
}

	
/* Layout container for artifact slots */
.vaultRow {
    display: flex;
    justify-content: center;
    align-items:flex-end;
    gap: 15px;
    flex-wrap:wrap;
}

/* Individual artifact slot (default = locked state) */    
.artifactSlot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    text-align:center;
    opacity: .26;
    transition: all .4s ease;
}

/* Locked artifact image (dimmed effect) */    
.artifactSlot img {
    width: 45px;
    margin-bottom:4px;
    filter:
        brightness(0.28)
        contrast(0.85)
        sepia(0.35);
    transition: all .4s ease;
}

/* Artifact label text */
.artifactSlot span {
    display: block;
    font-size: 13px;
    color: rgba(216,199,160,0.38);
    margin-top: 8px;
    line-height: 1.2;
}

/* Glow + animation for unlocked artifacts */
.artifactSlot.unlocked {
    opacity: 1;
    transform: scale(1.05);
}

.artifactSlot.unlocked img {
    filter:
        drop-shadow(0 0 14px rgba(248,217,129,0.86))
        drop-shadow(0 0 26px rgba(56,189,248,0.46))
        drop-shadow(0 0 34px rgba(14,165,233,0.24));
    animation: relicPulse 2.5s ease-in-out infinite;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.artifactSlot.unlocked span {
    color: #eef8ff;
    font-weight: 600;
    text-shadow:
        0 0 7px rgba(56,189,248,0.38),
        0 2px 5px rgba(0,0,0,0.85);
}

	
/* =========================================
   7. BOSS EFFECTS & ATMOSPHERE — SAFE TO CUSTOMIZE
========================================= */
    
/* Hit animation — triggered when boss takes damage */
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

/* Boss image display — includes floating animation */
.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

	
/* Boss 1 -specific glow effects */
.keeperGlow {
    filter:
        drop-shadow(0 0 12px rgba(56,189,248,0.82))
        drop-shadow(0 0 24px rgba(37,99,235,0.50))
        drop-shadow(0 0 34px rgba(0,0,0,0.75));
}

/* Boss 2 -specific glow effects */	
.chancellorGlow {
    filter: 
		drop-shadow(0 0 14px rgba(245,230,184,0.88)) 
		drop-shadow(0 0 28px rgba(124,58,237,0.56)) 
		drop-shadow(0 0 38px rgba(0,0,0,0.84));
}


	
/* Boss 3 -specific glow effects */		
.custodianGlow {
    filter:
        drop-shadow(0 0 16px rgba(248,217,129,0.96))
        drop-shadow(0 0 34px rgba(14,165,233,0.74))
        drop-shadow(0 0 46px rgba(56,189,248,0.34))
        drop-shadow(0 0 52px rgba(0,0,0,0.82));
}

	
/* Ambient torch effect — decorative, shown during gameplay */
.torch {
    position: absolute;
    width: 70px;
    top: 30px;
    z-index: 10;
    animation: torchFlicker 3s infinite alternate;
    pointer-events: none;
    opacity: .92;
    filter:
        drop-shadow(0 0 12px rgba(248,217,129,0.68))
        drop-shadow(0 0 24px rgba(14,165,233,0.26));
    display:none;
}

/* Torch positioning (left/right sides of screen) */
.left-torch {
    left: 18px;
}

.right-torch {
    right: 18px;
    transform: scaleX(-1);
}

/* =========================================
   9. ANIMATION SYSTEM — SAFE TO CUSTOMIZE (WITH CARE)
========================================= */

/* Ambient lighting effect (environmental immersion) */    
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.05) saturate(1.04);
  }
  50% {
    filter: brightness(0.96) saturate(0.98);
  }
  75% {
    filter: brightness(1.04) saturate(1.03);
  }
}

/* Damage feedback (quick impact effect) */    
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss-specific hit feedback (stronger shake) */    
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room highlight animation (maze tracker) */   
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(56,189,248,0.68),
      inset 0 0 10px rgba(0,0,0,0.6);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(248,217,129,0.92),
      0 0 32px rgba(56,189,248,0.48),
      0 0 42px rgba(37,99,235,0.24),
      inset 0 0 12px rgba(0,0,0,0.64);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(56,189,248,0.78),
      0 0 24px rgba(14,165,233,0.24),
      inset 0 0 11px rgba(0,0,0,0.64);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(248,217,129,0.72),
      0 0 30px rgba(56,189,248,0.36),
      inset 0 0 12px rgba(0,0,0,0.68);
  }
}


	

/* Victory text animation (end screen emphasis) */    
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(248,217,129,0.72),
      0 2px 6px rgba(0,0,0,0.9);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(248,217,129,0.95),
      0 0 42px rgba(56,189,248,0.62),
      0 0 52px rgba(14,165,233,0.36),
      0 3px 8px rgba(0,0,0,0.9);
  }
}


/* Idle boss movement (subtle hovering effect) */    
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */   
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Wizard idle animation (subtle movement) */    
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance animation */    
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* General pulse animation for relics */   
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(56,189,248,0.66))
      drop-shadow(0 0 18px rgba(37,99,235,0.34))
      drop-shadow(0 0 24px rgba(0,0,0,0.55));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(248,217,129,0.92))
      drop-shadow(0 0 30px rgba(56,189,248,0.55))
      drop-shadow(0 0 38px rgba(14,165,233,0.24));
  }
}

/* Streak Icon Glow */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

  text-shadow:
    0 0 10px rgba(56,189,248,0.46);
}

#scoreFloatLayer{
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}

.score-float{
  position: absolute;
  left: 50%;
  top: var(--score-float-top, 42%);
  transform: translateX(-50%);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
  animation: scoreFloatUp 1.2s ease-out forwards;
  text-shadow:
    0 0 10px rgba(0,0,0,0.96),
    0 0 18px rgba(56,189,248,0.42);
}

.score-float.positive{ color: #f7d982; }
.score-float.negative{ color: #f87171; }
.score-float.neutral{ color: #c7ecff; }

@keyframes scoreFloatUp{
  0%{ opacity: 0; transform: translate(-50%, 12px) scale(.85); }
  15%{ opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  100%{ opacity: 0; transform: translate(-50%, -58px) scale(1); }
}

let gameSfxUnlocked = false;

function unlockGameSfx(){
  if(gameSfxUnlocked || !soundEnabled) return;

  gameSfxUnlocked = true;

  [sfxMilestone, sfxCorrect, sfxWrong].forEach(audio => {
    if(!audio || typeof audio.play !== "function") return;

    const originalVolume = audio.volume;
    const originalMuted = audio.muted;

    try {
      audio.muted = false;
      audio.volume = 0;
      audio.currentTime = 0;

      const playAttempt = audio.play();
      if(playAttempt && typeof playAttempt.then === "function"){
        playAttempt.then(() => {
          audio.pause();
          audio.currentTime = 0;
          audio.volume = originalVolume;
          audio.muted = !soundEnabled || originalMuted;
        }).catch(error => {
          audio.volume = originalVolume;
          audio.muted = !soundEnabled || originalMuted;
          gameSfxUnlocked = false;
          console.warn("SFX unlock blocked:", audio.src, error);
        });
      } else {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = originalVolume;
        audio.muted = !soundEnabled || originalMuted;
      }
    } catch(error) {
      audio.volume = originalVolume;
      audio.muted = !soundEnabled || originalMuted;
      gameSfxUnlocked = false;
      console.warn("SFX unlock blocked:", audio.src, error);
    }
  });
}

function scheduleForCurrentRun(callback, delay){
    const scheduledSessionId = runSessionId;
    return setTimeout(() => {
        if(scheduledSessionId !== runSessionId) return;
        if(isTimedModeTerminal()) return;
        if(isTimedModeExpired()){
            endTimedModeRun();
            return;
        }
        callback();
    }, delay);
}

function isTimedModeExpired(){
    return gameMode === "timed"
        && Number.isFinite(timedModeEndTime)
        && Date.now() >= timedModeEndTime;
}

    return timedModeTerminal || gameMode === "timed-complete";
}

function reconcileTimedModeClock(){
    if(gameMode !== "timed" || isTimedModeTerminal()) return;

    if(isTimedModeExpired()){
        endTimedModeRun();
        return;
    }

    updateTimedModeClock();
}

function getScoreAttackSpeedBonus(responseTime){
    const bonus = SCORE_ATTACK_CONFIG.speedBonuses.find(item => responseTime <= item.maxMs);
    return bonus ? bonus.points : 0;
}

function getScoreAttackStreakBonus(currentStreak){
    const bonus = SCORE_ATTACK_CONFIG.streakBonuses.find(item => currentStreak >= item.minStreak);
    return bonus ? bonus.points : 0;
}

function applyScoreAttackEvent(label, amount){
    if(!modeUsesScoreAttack()) return;

    const numericAmount = Number(amount || 0);
    if(!Number.isFinite(numericAmount) || numericAmount === 0) return;

    scoreAttackScore += numericAmount;

    // No negative scoreboard. Punishment hurts, but it does not turn into comedy.
    if(scoreAttackScore < 0){
        scoreAttackScore = 0;
    }

    scoreAttackEvents.push({
        label,
        amount: numericAmount,
        scoreAfter: scoreAttackScore,
        room,
        questionId: currentQuestion?.id || 0,
        time: Date.now()
    });

    if(scoreAttackEvents.length > 120){
        scoreAttackEvents.shift();
    }

    if(scoreAttackScore > scoreAttackBestScore){
        scoreAttackBestScore = scoreAttackScore;
        localStorage.setItem(`${SCORE_ATTACK_STORAGE_PREFIX}_bestScore`, String(scoreAttackBestScore));
    }

    updateScoreAttackHud();
    showScoreAttackFloat(label, numericAmount);
}

function applyScoreAttackForAnswer(isCorrect, responseTime){
    if(!modeUsesScoreAttack()) return;

    if(isCorrect){
        applyScoreAttackEvent("Correct", SCORE_ATTACK_CONFIG.correct);

        const speedBonus = getScoreAttackSpeedBonus(responseTime);
        if(speedBonus > 0){
            applyScoreAttackEvent("Speed", speedBonus);
        }

        const streakBonus = getScoreAttackStreakBonus(streak);
        if(streakBonus > 0){
            applyScoreAttackEvent("Streak", streakBonus);
        }

        return;
    }

    const penalty = responseTime < 4000
        ? SCORE_ATTACK_CONFIG.rapidMissPenalty
        : SCORE_ATTACK_CONFIG.wrongPenalty;

    applyScoreAttackEvent(responseTime < 4000 ? "Rapid Miss" : "Wrong", penalty);
}

function applyScoreAttackRapidGuessPenalty(){
    if(!modeUsesScoreAttack()) return;

    applyScoreAttackEvent("Rapid Guess", SCORE_ATTACK_CONFIG.rapidMissPenalty);
}

// SCORE ATTACK MODE ADDITION:
// This creates the tiny arcade-style "score resolve" beat.
// It lets +100 / Speed / Streak / Wrong penalties breathe before feedback appears.
function getScoreAttackResolveDelay(isCorrect){
    if(!modeUsesScoreAttack()) return 0;

    return isCorrect
        ? SCORE_ATTACK_CONFIG.resolveDelayCorrectMs
        : SCORE_ATTACK_CONFIG.resolveDelayWrongMs;
}

function waitForScoreAttackResolve(isCorrect){
    const delay = getScoreAttackResolveDelay(isCorrect);

    if(!delay || delay <= 0){
        return Promise.resolve();
    }

    return new Promise(resolve => setTimeout(resolve, delay));
}

function showScoreAttackFloat(label, amount){
    const layer = document.getElementById("scoreFloatLayer");
    if(!layer) return;

    const item = document.createElement("div");
    const sign = amount > 0 ? "+" : "";
    const typeClass = amount > 0 ? "positive" : amount < 0 ? "negative" : "neutral";

    activeScoreFloatCount++;
    const stackOffset = Math.min(activeScoreFloatCount - 1, 4) * 30;

    item.className = `score-float ${typeClass}`;
    item.style.setProperty("--score-float-top", `calc(38% + ${stackOffset}px)`);
    item.innerText = `${label} ${sign}${amount}`;

    layer.appendChild(item);

    setTimeout(() => {
        item.remove();
        activeScoreFloatCount = Math.max(0, activeScoreFloatCount - 1);
    }, 1200);
}

function generatePseudonymFromSeed(seed) {
    const titles = [
        "Axiom", "Grid", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];

    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Reserve Custodian",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];

    let hash = 0;
    const cleanSeed = String(seed || "").trim().toLowerCase();

    for (let i = 0; i < cleanSeed.length; i++) {
        hash = ((hash << 5) - hash) + cleanSeed.charCodeAt(i);
        hash |= 0;
    }

    const positiveHash = Math.abs(hash);

    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);

    return `${title}${role}${number}`;
}

function inferObjective(question){
    if(!question) return "general";
    if(question.objective) return question.objective;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "general").toLowerCase();
    const type = (question.type || "default").toLowerCase();

    // =============================================
    // EXCHANGE CITADEL OBJECTIVE INFERENCE
    // Chapters 6 & 14: Open economy, trade balance,
    // exchange rates, Mundell-Fleming, small open economy AD
    // =============================================

    if(tag === "identity" || tag === "identities" || tag === "accounting" || tag === "national_accounts" || tag === "open_economy_identity"){
        if(q.includes("s = i + nco") || q.includes("saving equals investment plus net capital outflow")) return "LO6.1_saving_investment_nco_identity";
        if(q.includes("nx = nco") || q.includes("net exports equal net capital outflow")) return "LO6.1_nx_nco_identity";
        if(q.includes("y = c + i + g + nx") || q.includes("national income identity")) return "LO6.1_national_income_identity";
        if(q.includes("accounting identity") || q.includes("identity")) return "LO6.1_accounting_identities";
        if(q.includes("solve") || q.includes("calculate") || q.includes("given")) return "LO6.2_apply_accounting_identities";
        return "LO6.1_accounting_identities";
    }

    if(tag === "saving" || tag === "investment" || tag === "capital_flows" || tag === "nco" || tag === "net_capital_outflow"){
        if(q.includes("net capital outflow") || q.includes("nco")) return "LO6.2_net_capital_outflow";
        if(q.includes("saving") && q.includes("investment")) return "LO6.2_saving_investment_relationship";
        if(q.includes("capital outflow") || q.includes("capital inflow")) return "LO6.2_capital_flow_application";
        if(q.includes("domestic saving") || q.includes("national saving")) return "LO6.2_national_saving";
        if(q.includes("world interest rate") || q.includes("r*")) return "LO6.3_world_interest_rate";
        return "LO6.2_apply_accounting_identities";
    }

    if(tag === "small_open" || tag === "small_open_economy" || tag === "world_interest_rate" || tag === "r_star"){
        if(q.includes("small open economy") || q.includes("small economy")) return "LO6.3_small_open_economy";
        if(q.includes("world interest rate") || q.includes("takes the interest rate") || q.includes("r*")) return "LO6.3_takes_world_interest_rate";
        if(q.includes("cannot affect") || q.includes("too small")) return "LO6.3_small_country_assumption";
        return "LO6.3_small_open_economy";
    }

    if(tag === "trade" || tag === "trade_balance" || tag === "net_exports" || tag === "nx" || tag === "exports" || tag === "imports"){
        if(q.includes("trade surplus")) return "LO6.4_trade_surplus";
        if(q.includes("trade deficit")) return "LO6.4_trade_deficit";
        if(q.includes("balanced trade")) return "LO6.4_balanced_trade";
        if(q.includes("net exports") || q.includes("nx")) return "LO6.4_net_exports";
        if(q.includes("real exchange rate") || q.includes("nominal exchange rate")) return "LO6.4_exchange_rates";
        if(q.includes("appreciation") || q.includes("depreciation")) return "LO6.4_exchange_rate_adjustment";
        return "LO6.4_trade_balance_exchange_rates";
    }

    if(tag === "exchange" || tag === "exchange_rate" || tag === "real_exchange_rate" || tag === "nominal_exchange_rate" || tag === "currency"){
        if(q.includes("real exchange rate")) return "LO6.4_real_exchange_rate";
        if(q.includes("nominal exchange rate")) return "LO6.4_nominal_exchange_rate";
        if(q.includes("appreciation") || q.includes("appreciates")) return "LO6.4_appreciation";
        if(q.includes("depreciation") || q.includes("depreciates")) return "LO6.4_depreciation";
        if(q.includes("net exports") || q.includes("trade balance")) return "LO6.4_exchange_rate_trade_balance";
        return "LO6.4_exchange_rates";
    }

    if(tag === "policy" || tag === "fiscal_policy" || tag === "trade_policy" || tag === "tariff" || tag === "quota" || tag === "capital_policy"){
        if(q.includes("tariff") || q.includes("quota") || q.includes("import restriction")) return "LO6.5_trade_policy";
        if(q.includes("budget deficit") || q.includes("government budget deficit")) return "LO6.5_budget_deficit";
        if(q.includes("fiscal policy") || q.includes("government spending") || q.includes("tax cut") || q.includes("tax increase")) return "LO6.5_fiscal_policy_open_economy";
        if(q.includes("capital flight")) return "LO6.5_capital_flight";
        if(q.includes("trade balance") || q.includes("net exports")) return "LO6.5_policy_trade_balance";
        if(q.includes("exchange rate") || q.includes("appreciation") || q.includes("depreciation")) return "LO6.5_policy_exchange_rate";
        return "LO6.5_policy_effects_open_economy";
    }

    if(tag === "mundell" || tag === "mundell_fleming" || tag === "mf" || tag === "open_economy_model" || tag === "is_lm_open"){
        if(q.includes("mundell-fleming") || q.includes("mundell fleming")) return "LO14.1_mundell_fleming_model";
        if(q.includes("is*") || q.includes("is star") || q.includes("is curve")) return "LO14.1_is_star_curve";
        if(q.includes("lm*") || q.includes("lm star") || q.includes("lm curve")) return "LO14.1_lm_star_curve";
        if(q.includes("small open economy")) return "LO14.1_small_open_mundell_fleming";
        if(q.includes("floating") || q.includes("fixed")) return "LO14.3_exchange_rate_regime";
        return "LO14.1_mundell_fleming_model";
    }

    if(tag === "interest_differential" || tag === "interest_rate_differential" || tag === "risk_premium" || tag === "expected_depreciation" || tag === "capital_mobility"){
        if(q.includes("risk premium")) return "LO14.2_risk_premium";
        if(q.includes("expected depreciation") || q.includes("expected appreciation")) return "LO14.2_expected_exchange_rate_change";
        if(q.includes("interest rate differential") || q.includes("interest differential")) return "LO14.2_interest_rate_differential";
        if(q.includes("capital mobility") || q.includes("capital flows")) return "LO14.2_capital_mobility";
        if(q.includes("domestic interest rate") && q.includes("world interest rate")) return "LO14.2_domestic_world_interest_gap";
        return "LO14.2_interest_rate_differentials";
    }

    if(tag === "fixed" || tag === "floating" || tag === "exchange_regime" || tag === "fixed_exchange_rate" || tag === "floating_exchange_rate" || tag === "central_bank"){
        if(q.includes("fixed exchange rate") || q.includes("fixed regime")) return "LO14.3_fixed_exchange_rate";
        if(q.includes("floating exchange rate") || q.includes("floating regime")) return "LO14.3_floating_exchange_rate";
        if(q.includes("monetary policy") && q.includes("fixed")) return "LO14.3_monetary_policy_fixed";
        if(q.includes("monetary policy") && q.includes("floating")) return "LO14.3_monetary_policy_floating";
        if(q.includes("fiscal policy") && q.includes("fixed")) return "LO14.3_fiscal_policy_fixed";
        if(q.includes("fiscal policy") && q.includes("floating")) return "LO14.3_fiscal_policy_floating";
        if(q.includes("central bank") || q.includes("foreign exchange reserves")) return "LO14.3_exchange_rate_intervention";
        return "LO14.3_fixed_vs_floating_exchange_rates";
    }

    if(tag === "ad" || tag === "aggregate_demand" || tag === "ad_curve" || tag === "small_open_ad" || tag === "price_level"){
        if(q.includes("derive aggregate demand") || q.includes("derive ad")) return "LO14.4_derive_ad_small_open_economy";
        if(q.includes("price level") && q.includes("exchange rate")) return "LO14.4_price_level_exchange_rate_channel";
        if(q.includes("price level") && q.includes("net exports")) return "LO14.4_price_level_net_exports";
        if(q.includes("small open economy") && q.includes("aggregate demand")) return "LO14.4_small_open_ad_curve";
        if(q.includes("downward sloping")) return "LO14.4_downward_sloping_ad";
        return "LO14.4_ad_curve_small_open_economy";
    }

    return `${tag}_${type}`;
}

function inferSkill(question){
    if(!question) return null;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "").toLowerCase();
    const objective = (question.objective || "").toLowerCase();

    if(tag.includes("identity") || tag.includes("accounting") || objective.includes("6.1") || q.includes("s = i + nco") || q.includes("nx = nco") || q.includes("y = c + i + g + nx")) return "open_economy_identities";
    if(tag.includes("saving") || tag.includes("investment") || tag.includes("capital") || tag.includes("nco") || objective.includes("6.2") || q.includes("net capital outflow") || q.includes("capital flow")) return "saving_investment_capital_flows";
    if(tag.includes("small_open") || tag.includes("world_interest") || tag.includes("r_star") || objective.includes("6.3") || q.includes("small open economy") || q.includes("world interest rate")) return "small_open_world_interest_rate";
    if(tag.includes("trade") || tag.includes("net_exports") || tag === "nx" || objective.includes("6.4") || q.includes("trade surplus") || q.includes("trade deficit") || q.includes("net exports")) return "trade_balance_net_exports";
    if(tag.includes("exchange") || tag.includes("currency") || q.includes("real exchange rate") || q.includes("nominal exchange rate") || q.includes("appreciat") || q.includes("depreciat")) return "exchange_rate_adjustment";
    if(tag.includes("policy") || tag.includes("fiscal") || tag.includes("tariff") || tag.includes("quota") || objective.includes("6.5") || q.includes("budget deficit") || q.includes("trade policy") || q.includes("capital flight")) return "open_economy_policy_effects";
    if(tag.includes("mundell") || tag.includes("mf") || tag.includes("open_economy_model") || objective.includes("14.1") || q.includes("mundell") || q.includes("is*") || q.includes("lm*")) return "mundell_fleming_model";
    if(tag.includes("interest_differential") || tag.includes("risk_premium") || tag.includes("capital_mobility") || objective.includes("14.2") || q.includes("risk premium") || q.includes("interest rate differential")) return "interest_differential_capital_mobility";
    if(tag.includes("fixed") || tag.includes("floating") || tag.includes("exchange_regime") || objective.includes("14.3") || q.includes("fixed exchange rate") || q.includes("floating exchange rate")) return "fixed_floating_exchange_regimes";
    if(tag === "ad" || tag.includes("aggregate_demand") || tag.includes("price_level") || objective.includes("14.4") || q.includes("aggregate demand") || q.includes("price level")) return "small_open_aggregate_demand";

    return tag || null;
}
	 
function getObjectiveBucket(question){
    const objectiveKey = inferObjective(question);
    if(!masteryState.byObjective[objectiveKey]){
        masteryState.byObjective[objectiveKey] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return masteryState.byObjective[objectiveKey];
}

function getObjectiveAccuracy(question){
    return getAccuracy(getObjectiveBucket(question));
}

function getObjectiveFluency(question){
    return getFluency(getObjectiveBucket(question), question?.type || "default");
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

function getTagAccuracy(tag){
    return getAccuracy(getTagBucket(tag));
}

function getTagTypeAccuracy(tag, type){
    return getAccuracy(getTypeBucket(tag, type));
}

function getTagFluency(tag){
    return getFluency(getTagBucket(tag), "default");
}

function getTagTypeFluency(tag, type){
    return getFluency(getTypeBucket(tag, type), type || "default");
}

function recordAdaptiveAttempt(question, isCorrect, responseTime){
    if(!question || !question.tag) return;

    const tagBucket = getTagBucket(question.tag);
    const typeBucket = getTypeBucket(question.tag, question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const skillBucket = getSkillBucket(question);

    updateBucket(tagBucket, isCorrect, responseTime);
    updateBucket(typeBucket, isCorrect, responseTime);
    updateBucket(objectiveBucket, isCorrect, responseTime);
    updateBucket(skillBucket, isCorrect, responseTime);

    masteryState.recent.push({
        correct: !!isCorrect,
        responseTime,
        tag: question.tag,
        type: question.type || "default",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: getSkillKey(question)
    });

    if(masteryState.recent.length > 20){
        masteryState.recent.shift();
    }
}

function getRecentPerformance(windowSize = 8){
    const recent = masteryState.recent.slice(-windowSize);
    if(recent.length === 0){
        return { accuracy: 0, avgCorrectRatio: 1.2, count: 0 };
    }

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

function getWeakestTag(){
    const entries = Object.keys(masteryState.byTag);

    if(entries.length === 0){
        const fallback = Object.entries(conceptMemory || {}).sort((a,b) => b[1]-a[1])[0];
        return fallback ? fallback[0] : null;
    }

    let weakestTag = null;
    let weakestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){
            strongestScore = strength;
            strongestTag = tag;
        }
    });

    return strongestTag;
}


function getBossObjectiveKey(question){
    if(!question) return null;
    const rawObjective = question.objective || inferObjective(question);
    if(!rawObjective) return null;
    const match = String(rawObjective).match(/^LO\d+\.\d+/);
    return match ? match[0] : rawObjective;
}

function getObjectiveFamilyStats(objectiveKey){
    let attempts = 0;
    let correct = 0;
    let weightedTime = 0;
    Object.keys(masteryState.byObjective || {}).forEach(key => {
        if(key === objectiveKey || key.startsWith(objectiveKey + "_")){
            const bucket = masteryState.byObjective[key];
            if(!bucket) return;
            attempts += bucket.attempts || 0;
            correct += bucket.correct || 0;
            weightedTime += (bucket.avgTime || 0) * (bucket.attempts || 0);
        }
    });
    return {
        attempts,
        correct,
        accuracy: attempts ? correct / attempts : null,
        avgTime: attempts ? weightedTime / attempts : 0
    };
}

function getWeakestBossObjective(bank){
    if(!Array.isArray(bank) || bank.length === 0) return null;
    const objectives = [...new Set(bank.map(q => getBossObjectiveKey(q)).filter(Boolean))];
    const eligibleObjectives = objectives.filter(obj =>
        bank.filter(q => getBossObjectiveKey(q) === obj).length >= 3
    );
    if(eligibleObjectives.length === 0) return null;
    let weakestObjective = null;
    let weakestScore = -Infinity;
    eligibleObjectives.forEach(obj => {
        const stats = getObjectiveFamilyStats(obj);
        let score = 0.25;
        if(stats.accuracy !== null){
            score = (1 - stats.accuracy) * 2;
            score += Math.min(stats.attempts, 5) * 0.08;
        }
        const recentMisses = (masteryState.recent || []).filter(item => {
            const itemObjective = item.objective || "";
            return (itemObjective === obj || itemObjective.startsWith(obj + "_")) && !item.correct;
        }).length;
        score += recentMisses * 0.25;
        if(stats.avgTime && stats.avgTime > TYPE_TIME_TARGETS.default) score += 0.15;
        if(score > weakestScore){
            weakestScore = score;
            weakestObjective = obj;
        }
    });
    return weakestObjective || eligibleObjectives[Math.floor(Math.random() * eligibleObjectives.length)];
}

function getScaffoldedBossGroups(bank){
    if(!Array.isArray(bank) || bank.length === 0) return [];

    const groupedByObjective = {};

    bank.forEach(question => {
        const objective = getBossObjectiveKey(question);
        if(!objective) return;

        if(!groupedByObjective[objective]){
            groupedByObjective[objective] = [];
        }

        groupedByObjective[objective].push(question);
    });

    const groups = [];

    Object.values(groupedByObjective).forEach(objectiveQuestions => {
        const sorted = [...objectiveQuestions].sort((a, b) => a.id - b.id);

        for(let i = 0; i + 2 < sorted.length; i += 3){
            groups.push(sorted.slice(i, i + 3));
        }
    });

    return groups;
}

function getSelectionProfile(){
    const recent = getRecentPerformance(8);
    const strongestTag = getStrongestTag();
    const strongestFluency = strongestTag ? getTagFluency(strongestTag) : 0;

    return {
        recentAccuracy: recent.accuracy,
        avgCorrectRatio: recent.avgCorrectRatio,
        strongestTag,
        strongestFluency,
        mediumReady: streak >= 5 && recent.count >= 5 && recent.accuracy >= 0.8,
        hardReady: streak >= 8 && recent.count >= 6 && recent.accuracy >= 0.88 && recent.avgCorrectRatio <= 1.2 && strongestFluency >= 0.72,
        eliteReady: streak >= 14 && recent.count >= 8 && recent.accuracy >= 0.92 && recent.avgCorrectRatio <= 1.05 && strongestFluency >= 0.82
    };
}

function determineSelectionPurpose(profile){
    if(profile.recentAccuracy === 0 && getRecentPerformance(8).count === 0) return "support";
    if(profile.eliteReady) return "stretch";
    if(profile.recentAccuracy < 0.65) return "repair";
    if(profile.recentAccuracy < 0.8) return "confirm";
    if(profile.hardReady) return "challenge";
    return "diversify";
}

function shouldTriggerDetour(question){
    if(!question || !question.tag) return false;
    const tagWeakness = conceptMemory[question.tag] || 0;
    const typeBucket = getTypeBucket(question.tag, question.type);
    const typeAccuracy = getAccuracy(typeBucket);
    const objectiveAccuracy = getObjectiveAccuracy(question);

    return tagWeakness >= 2.2
        || (typeBucket && typeBucket.attempts >= 2 && typeAccuracy !== null && typeAccuracy < 0.6)
        || (objectiveAccuracy !== null && objectiveAccuracy < 0.5 && getObjectiveBucket(question).attempts >= 2);
}

function planRemediation(question, responseTime){
    if(!question || !question.tag) return null;

    const expected = getTypeTargetMs(question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const objectiveAccuracy = getAccuracy(objectiveBucket);
    const objectiveAttempts = objectiveBucket?.attempts || 0;
    const carelessMiss = responseTime < expected * 0.55 && (objectiveAccuracy === null || objectiveAccuracy >= 0.45);
    const repeatedObjectiveMiss = objectiveAttempts >= 2 && objectiveAccuracy !== null && objectiveAccuracy < 0.6;
    const slowStruggle = responseTime > expected * 1.2;
    const skill = getSkillKey(question);

    return {
        active: true,
        stage: carelessMiss ? "bridge" : "repair",
        tag: question.tag,
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: skill,
        commonError: question.commonError || null,
        sourceType: question.type || "default",
        returnRoom: room,
        originQuestionId: question.id || null,
        careless: carelessMiss,
        repeatedObjectiveMiss,
        slowStruggle
    };
}

function getRemediationStageLabel(stage){

// =============================================
// REMEDIATION ANTI-REPETITION
// Repair and bridge items exhaust eligible alternatives before reuse.
// Once a pool is exhausted, prefer the least-recently-seen eligible item.
// A one-item pool may repeat because no alternative exists.
// =============================================
function getRemediationIdentity(question){
    return question?.id ?? question?.questionId ?? null;
}

function ensureRemediationHistory(state){
    if(!state || typeof state !== "object") return { repair: [], bridge: [] };

    if(!state.history || typeof state.history !== "object"){
        state.history = { repair: [], bridge: [] };
    }

    if(!Array.isArray(state.history.repair)) state.history.repair = [];
    if(!Array.isArray(state.history.bridge)) state.history.bridge = [];

    return state.history;
}

function getRemediationSelectionPool(candidates, state, stage){
    if(!Array.isArray(candidates) || candidates.length === 0) return [];

    const deduped = [];
    const identities = new Set();

    candidates.forEach(question => {
        const rawIdentity = getRemediationIdentity(question);
        const identity = rawIdentity === null || rawIdentity === undefined
            ? null
            : String(rawIdentity);

        if(identity === null || !identities.has(identity)){
            deduped.push(question);
            if(identity !== null) identities.add(identity);
        }
    });

    if(deduped.length <= 1 || !["repair", "bridge"].includes(stage)) return deduped;

    const history = ensureRemediationHistory(state);
    const stageHistory = history[stage];
    const seen = new Set(stageHistory.map(String));

    const unseen = deduped.filter(question => {
        const identity = getRemediationIdentity(question);
        return identity === null || identity === undefined || !seen.has(String(identity));
    });

    if(unseen.length > 0) return unseen;

    const recency = new Map(stageHistory.map((identity, index) => [String(identity), index]));
    let oldestIndex = Infinity;

    deduped.forEach(question => {
        const identity = getRemediationIdentity(question);
        const index = identity !== null && identity !== undefined && recency.has(String(identity))
            ? recency.get(String(identity))
            : -1;
        if(index < oldestIndex) oldestIndex = index;
    });

    const leastRecentlySeen = deduped.filter(question => {
        const identity = getRemediationIdentity(question);
        const index = identity !== null && identity !== undefined && recency.has(String(identity))
            ? recency.get(String(identity))
            : -1;
        return index === oldestIndex;
    });

    return leastRecentlySeen.length > 0 ? leastRecentlySeen : deduped;
}

function rememberRemediationSelection(state, stage, question){
    if(!state || !question || !["repair", "bridge"].includes(stage)) return;

    const identityValue = getRemediationIdentity(question);
    if(identityValue === null || identityValue === undefined) return;

    const history = ensureRemediationHistory(state);
    const identity = String(identityValue);
    const stageHistory = history[stage];
    const existingIndex = stageHistory.indexOf(identity);

    if(existingIndex >= 0) stageHistory.splice(existingIndex, 1);
    stageHistory.push(identity);
}

function pickRemediationAuxiliary(candidates, state, stage, purpose){
    const selectionPool = getRemediationSelectionPool(candidates, state, stage);
    if(selectionPool.length === 0) return null;

    const picked = weightedPick(selectionPool, {
        mode: "support",
        purpose
    });

    rememberRemediationSelection(state, stage, picked);
    return picked;
}


function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey || inferSkill(q) === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

function getRetestPoolName(){
    if(room <= 9) return "easy";
    if(room <= 19) return "medium";
    if(room <= 25) return "hard";
    if(room <= 29) return "hard";
    return "elite";
}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);
    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}
function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        const skillRepairPool = (window.directSkillRepairRoutes || {})[state.skill]
            || microSkillRepairPools[state.skill] || [];
        if(state.skill && skillRepairPool.length){
            const skillRepairCandidates = getQuestionsMatchingNeed(
                skillRepairPool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillRepairCandidates.length > 0){
                return pickRemediationAuxiliary(skillRepairCandidates, state, "repair", "repair");
            }
        }

        const repairPool = (window.directSkillRepairRoutes || {})[state.skill]
            || microSkillRepairPools[state.skill] || [];
        const allRepairPool = Object.values(microSkillRepairPools || {})
            .reduce((all, pool) => all.concat(pool), []);
        const repairCandidates = getQuestionsMatchingNeed(
            repairPool.length ? repairPool : allRepairPool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(repairCandidates.length > 0){
            return pickRemediationAuxiliary(repairCandidates, state, "repair", "repair");
        }
    }

    if(state.stage === "bridge"){
        const skillBridgePool = (window.directSkillBridgeRoutes || {})[state.skill]
            || microSkillBridgePools[state.skill] || [];
        if(state.skill && skillBridgePool.length){
            const skillBridgeCandidates = getQuestionsMatchingNeed(
                skillBridgePool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillBridgeCandidates.length > 0){
                return pickRemediationAuxiliary(skillBridgeCandidates, state, "bridge", "confirm");
            }
        }

        const allBridgePool = Object.values(microSkillBridgePools).reduce((all, pool) => all.concat(pool), []);
        const bridgeCandidates = getQuestionsMatchingNeed(
            allBridgePool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(bridgeCandidates.length > 0){
            return pickRemediationAuxiliary(bridgeCandidates, state, "bridge", "confirm");
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}

function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {
            id: 999999,
            q: "No question pool is available for this room. Check the questionBanks configuration.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            a: 0,
            tag: "system",
            type: "default",
            objective: "system_check",
            feedback: "A question pool is missing."
        };
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

function shuffleOptions(question){
    const q = {
        ...question,
        options: [...(question.options || [])],
        secondarySkills: [...(question.secondarySkills || [])]
    };
const correctText = Number.isInteger(question.a)
        ? question.options[question.a]
        : null;

    for(let i = q.options.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    if(correctText !== null){
        q.a = q.options.indexOf(correctText);
    } else {
        delete q.a;
    }

    return q;
}

async function isQuestionAnswerCorrect(question, selectedIndex){
    if(!question || !Array.isArray(question.options)) return false;
    const selectedOptionText = question.options[selectedIndex] ?? "";
    if(typeof question.aHash === "string"){
        if(typeof isPublishedAnswerCorrect !== "function"){
            throw new Error("Published answer verification helper is missing.");
        }
        return isPublishedAnswerCorrect(question, selectedOptionText);
    }
    return Number.isInteger(question.a) && selectedIndex === question.a;
}

async function verifyQuestionAnswerWithTimeout(question, selectedIndex, timeoutMs = 5000){
    let timeoutId = null;

    const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
            reject(new Error("Answer verification timed out."));
        }, timeoutMs);
    });

    try {
        return await Promise.race([
            isQuestionAnswerCorrect(question, selectedIndex),
            timeoutPromise
        ]);
    } finally {
        if(timeoutId !== null){
            clearTimeout(timeoutId);
        }
    }
}

function randomQuestion(poolName) {
    let pool = questionBanks[poolName];

    // Safety check in case poolName is invalid
    if (!pool) return null;
    
    let used = [
        ...usedQuestions.easy,
        ...usedQuestions.medium,
        ...usedQuestions.hard,
        ...usedQuestions.easyBoss,
        ...usedQuestions.mediumBoss,
        ...usedQuestions.finalBoss,
        ...usedQuestions.legendaryBoss,
    ];

    let available = pool.filter(q => !used.includes(q.id));

    if (available.length === 0) {
        usedQuestions[poolName] = [];
        available = pool;
    }

    // Avoid three identical question types in a row
    let filtered = available;

    if (lastTypes.length >= 2) {
        let last1 = lastTypes[lastTypes.length - 1];
        let last2 = lastTypes[lastTypes.length - 2];

        if (last1 === last2) {
            filtered = available.filter(q => q.type !== last1);
            if (filtered.length === 0) filtered = available;
        }
    }

    let question = filtered[Math.floor(Math.random() * filtered.length)];

    usedQuestions[poolName].push(question.id);

    // Track types
    lastTypes.push(question.type);
    if (lastTypes.length > 3) {
        lastTypes.shift();
    }

    return question;
}

// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:

// - full coverage before reuse
//
// ---------------------------------------------

// This ensures randomness WITHOUT repetition.

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Bag system for calculation generators
// Ensures all generators are used before repeating
let calcBag = [];

// Pulls one calculation generator from the bag
// Refills bag when empty (reshuffled)
function pickCalcGenerator(){
    if(calcBag.length === 0){
        calcBag = shuffle([...exchangeCitadelCalculationGenerators]);
    }
    return calcBag.pop() || null;
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);
    const avgTime = recent.length
        ? recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length
        : responseTime;
    const accuracy = recent.length
        ? recent.reduce((sum, item) => sum + item.correct, 0) / recent.length
        : (isCorrect ? 1 : 0);

    const rollingPattern = recent.length >= RAPID_GUESS_CONFIG.minAttempts
        && avgTime < RAPID_GUESS_CONFIG.avgTimeMs
        && accuracy < RAPID_GUESS_CONFIG.maxAccuracy;

    const burst = recent.slice(-RAPID_GUESS_CONFIG.burstWindowSize);
    const burstFastCount = burst.filter(item =>
        item.responseTime < RAPID_GUESS_CONFIG.burstFastMs
    ).length;
    const burstAccuracy = burst.length
        ? burst.reduce((sum, item) => sum + item.correct, 0) / burst.length
        : 1;
    const burstPattern = burst.length === RAPID_GUESS_CONFIG.burstWindowSize
        && burstFastCount >= RAPID_GUESS_CONFIG.burstMinFast
        && burstAccuracy <= RAPID_GUESS_CONFIG.burstMaxAccuracy;

    return {
        triggered: rollingPattern || burstPattern,
        avgTime,
        accuracy
    };
}

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|ARCHIVE42)
// - hashing logic
// - return format ("ARCH-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "ARCHIVE42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|LEDGER55`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "LDGR-" + Math.abs(hash).toString(36).toUpperCase();
}

// ARRAY SHUFFLE UTILITY — SAFE TO USE, DO NOT MODIFY
// =============================================
// Fisher-Yates shuffle algorithm.
//
// Used to randomize:
// - question order
// - calculation generators
// - any randomized sequences
//
// DO NOT MODIFY unless you understand:
// - uniform randomness
// - bias in random selection
//
// Breaking this = predictable patterns in questions
// =============================================     
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
}

let latestResultsScreenHTML = "";

const EXCHANGE_CITADEL_OBJECTIVE_LABELS = (typeof objectiveLabels !== "undefined") ? objectiveLabels : {};

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function titleCase(value){
    return String(value || "")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

function formatMasteryLabel(key){
    if(!key) return "Unlabeled Concept";

    const text = String(key);
    const exactLabel = EXCHANGE_CITADEL_OBJECTIVE_LABELS[text];

    if(exactLabel){
        return /^LO\d+\.\d+$/.test(text)
            ? `${text} — ${exactLabel}`
            : exactLabel;
    }

    const objectiveMatch = text.match(/^(LO\d+\.\d+)/);
    if(objectiveMatch && EXCHANGE_CITADEL_OBJECTIVE_LABELS[objectiveMatch[1]]){
        const suffix = text
            .replace(objectiveMatch[1], "")
            .replace(/^_+/, "")
            .replace(/_/g, " ")
            .trim();

        return suffix
            ? `${objectiveMatch[1]} — ${EXCHANGE_CITADEL_OBJECTIVE_LABELS[objectiveMatch[1]]}: ${titleCase(suffix)}`
            : `${objectiveMatch[1]} — ${EXCHANGE_CITADEL_OBJECTIVE_LABELS[objectiveMatch[1]]}`;
    }

    return titleCase(text);
}

function formatPercent(value){
    if(value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
    return `${Math.round(Number(value) * 100)}%`;
}

function formatSeconds(ms){
    const numeric = Number(ms || 0);
    if(!Number.isFinite(numeric) || numeric <= 0) return "—";
    return `${Math.round(numeric / 1000)}s`;
}

function getBucketEntry(key, bucket, category = "concept"){
    if(!bucket || !bucket.attempts){
        return null;
    }

    const attempts = Number(bucket.attempts || 0);
    const correct = Number(bucket.correct || 0);
    const accuracy = attempts ? correct / attempts : null;
    const typeForTiming = category === "type" ? key : "default";
    const target = getTypeTargetMs(typeForTiming);
    const avgTime = Number(bucket.avgTime || 0);
    const timeRatio = avgTime && target ? avgTime / target : 1;
    const fluency = accuracy === null
        ? 0
        : accuracy - clamp((timeRatio - 1) * 0.25, 0, 0.35);

    return {
        key,
        label: formatMasteryLabel(key),
        category,
        attempts,
        correct,
        accuracy,
        avgTime,
        timeRatio,
        fluency
    };
}

function getEntriesFromBuckets(source, category = "concept"){
    return Object.entries(source || {})
        .map(([key, bucket]) => getBucketEntry(key, bucket, category))
        .filter(Boolean);
}

function getTypeMasteryEntries(){
    const typeBuckets = {};

    Object.values(masteryState.byTag || {}).forEach(tagBucket => {
        Object.entries(tagBucket.byType || {}).forEach(([type, bucket]) => {
            if(!typeBuckets[type]){
                typeBuckets[type] = { attempts: 0, correct: 0, avgTime: 0 };
            }

            const oldAttempts = typeBuckets[type].attempts;
            const newAttempts = oldAttempts + Number(bucket.attempts || 0);

            typeBuckets[type].correct += Number(bucket.correct || 0);
            typeBuckets[type].avgTime = newAttempts
                ? ((typeBuckets[type].avgTime * oldAttempts) + (Number(bucket.avgTime || 0) * Number(bucket.attempts || 0))) / newAttempts
                : 0;
            typeBuckets[type].attempts = newAttempts;
        });
    });

    return getEntriesFromBuckets(typeBuckets, "type");
}

function sortStrongest(entries){
    return [...entries]
        .filter(entry => entry.attempts >= 2 && Number(entry.accuracy) >= 0.70)
        .sort((a,b) => (b.accuracy - a.accuracy) || (b.fluency - a.fluency) || (b.attempts - a.attempts));
}

function sortWeakest(entries){
    const enoughData = entries.filter(entry => entry.attempts >= 2);
    const pool = enoughData.length ? enoughData : entries;

    return [...pool]
        .sort((a,b) => (a.accuracy - b.accuracy) || (a.fluency - b.fluency) || (b.avgTime - a.avgTime));
}

function getMeaningfulWeakEntries(entries, accuracyThreshold = 0.85){
    return sortWeakest(entries)
        .filter(entry => entry && entry.attempts >= 2)
        .filter(entry => {
            const accuracy = entry.accuracy === null || entry.accuracy === undefined
                ? 1
                : Number(entry.accuracy);

            return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
        });
}

function hasMeaningfulWeakness(entries, accuracyThreshold = 0.85){
    return (entries || []).some(entry => {
        if(!entry || entry.attempts < 2) return false;

        const accuracy = entry.accuracy === null || entry.accuracy === undefined
            ? 1
            : Number(entry.accuracy);

        return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
    });
}

function renderMasteryRows(entries, emptyText){
    if(!entries || entries.length === 0){
        return `<p class="mastery-empty">${escapeHTML(emptyText)}</p>`;
    }

    return entries.map(entry => {
        const pct = Math.max(0, Math.min(100, Math.round((entry.accuracy || 0) * 100)));
        const pace = entry.timeRatio > 1.25
            ? "Slow response pattern"
            : entry.timeRatio < 0.65
                ? "Fast response pattern"
                : "Stable pace";

        return `
            <div class="mastery-row">
                <div class="mastery-row-main">
                    <span class="mastery-row-name">${escapeHTML(entry.label)}</span>
                    <span class="mastery-row-score">${formatPercent(entry.accuracy)} · ${entry.correct}/${entry.attempts}</span>
                </div>
                <span class="mastery-row-meta">Average response: ${formatSeconds(entry.avgTime)} · ${pace}</span>
                <div class="mastery-bar"><div class="mastery-bar-fill" style="width:${pct}%"></div></div>
            </div>
        `;
    }).join("");
}

function renderMasteryDiagnosticSection({
    weaknessTitle,
    signalTitle,
    entries,
    hasWeakness,
    weaknessEmptyText,
    cleanText
}){
    const title = hasWeakness ? weaknessTitle : signalTitle;
    const body = hasWeakness
        ? renderMasteryRows(entries, weaknessEmptyText)
        : `<p class="mastery-empty">${escapeHTML(cleanText)}</p>`;

    return `
        <div class="mastery-section">
            <h3>${escapeHTML(title)}</h3>
            ${body}
        </div>
    `;
}

function getRecentBehaviorSignals(){
    const recent = masteryState.recent || [];
    let fastMisses = 0;
    let slowCorrects = 0;
    let recentCorrect = 0;
    let recentTimeTotal = 0;

    recent.forEach(item => {
        const target = getTypeTargetMs(item.type || "default");
        const responseTime = Number(item.responseTime || 0);

        if(item.correct) recentCorrect++;
        if(responseTime) recentTimeTotal += responseTime;

        if(!item.correct && responseTime > 0 && responseTime < target * 0.55){
            fastMisses++;
        }

        if(item.correct && responseTime > target * 1.20){
            slowCorrects++;
        }
    });

    return {
        count: recent.length,
        accuracy: recent.length ? recentCorrect / recent.length : null,
        avgTime: recent.length ? recentTimeTotal / recent.length : 0,
        fastMisses,
        slowCorrects
    };
}


function getMasteryReportModeName(){
    if(gameMode === "timed-ended-early") return "Timed Trial Ended Early";
    if(gameMode === "timed-complete") return "Timed Trial";
    if(gameMode === "score") return "Score Attack";
    if(gameMode === "legendary") return "Legendary Mode";
    if(gameMode === "exam") return "Exam Drill";
    return getModeDisplayName();

function getMasteryReportData(){
    const totalTimeMs=freezeCompletionTime();
    const accuracy = totalAttempts > 0 ? correctAnswers / totalAttempts : 0;
    const tagEntries = getEntriesFromBuckets(masteryState.byTag || {}, "tag");
    const objectiveEntries = getEntriesFromBuckets(masteryState.byObjective || {}, "objective");
    const skillEntries = getEntriesFromBuckets(masteryState.bySkill || {}, "skill");
    const typeEntries = getTypeMasteryEntries();
    const behavior = getRecentBehaviorSignals();

    const strongest = sortStrongest([...objectiveEntries, ...tagEntries]).slice(0, 4);
    const weakestObjectives = getMeaningfulWeakEntries(objectiveEntries, 0.85).slice(0, 4);
    const weakestTypes = getMeaningfulWeakEntries(typeEntries, 0.85).slice(0, 3);
    const weakestSkills = getMeaningfulWeakEntries(skillEntries, 0.85).slice(0, 3);

    const hasObjectiveWeakness = weakestObjectives.length > 0;
    const hasTypeWeakness = weakestTypes.length > 0;
    const hasSkillWeakness = weakestSkills.length > 0;
    const hasBehaviorWeakness = behavior.fastMisses >= 2 || behavior.slowCorrects >= 3;
    const noMajorWeakness = totalAttempts >= 8
        && accuracy >= 0.85
        && !hasObjectiveWeakness
        && !hasTypeWeakness
        && !hasSkillWeakness
        && !hasBehaviorWeakness;

    let verdict = "The Custodian found enough signal to build a report. Use it. Ignoring it would be malpractice with extra steps.";

    if(totalAttempts < 5){
        verdict = "The report is limited because this run has very few attempts. The Citadel needs more evidence before it can judge mastery with confidence.";
    } else if(noMajorWeakness){
        verdict = "No major weakness detected. That does not mean the Citadel is done with you. It means the next useful signal comes from harder pressure: Legendary Mode first, Score Attack after that.";
    } else if(accuracy >= 0.90){
        verdict = "Strong command. You cleared the Citadel with high accuracy. The signals below show where the next pressure test should focus, without pretending perfect categories are weaknesses.";
    } else if(accuracy >= 0.75){
        verdict = "Battle-ready, but not bulletproof. The weak areas below are where points will leak on an exam.";
    } else {
        verdict = "Unstable command. You finished, but the Citadel exposed weak signals. Hit the listed areas before chasing speed or Legendary Mode.";
    }

    const nextSteps = [];

    if(noMajorWeakness){
        nextSteps.push("Enter Legendary Mode next. The current run did not expose a major weak point, so harder multi-step and trap-heavy questions are the right next test.");
        nextSteps.push("Use Score Attack after Legendary Mode feels stable. Speed pressure is useful only after mastery survives harder questions.");
    } else {
        if(hasObjectiveWeakness && weakestObjectives[0]){
            nextSteps.push(`Review ${weakestObjectives[0].label}. That objective showed the weakest mastery signal.`);
        }

        if(hasTypeWeakness && weakestTypes[0]){
            nextSteps.push(`Practice ${weakestTypes[0].label} questions. That question form caused the most trouble.`);
        }

        if(hasSkillWeakness && weakestSkills[0]){
            nextSteps.push(`Drill ${weakestSkills[0].label}. That skill needs cleaner repetition.`);
        }

        if(behavior.fastMisses >= 2){
            nextSteps.push("Slow down on traps and graph-style items. Fast misses are not fluency. They are just wrong answers with confidence.");
        } else if(behavior.slowCorrects >= 3){
            nextSteps.push("You can get answers right, but some correct responses were slow. Build speed only after the reasoning is automatic.");
        }
    }

    if(nextSteps.length === 0){
        nextSteps.push("Run a harder mode next. The current evidence does not show a major weak point. Make the Citadel earn its paycheck.");
    }

    return {
        mode: getMasteryReportModeName(),
        accuracy,
        totalTimeMs,
        timeString: formatTime(totalTimeMs),
        totalAttempts,
        correctAnswers,
        maxStreak,
        score: modeUsesScoreAttack() ? scoreAttackScore : null,
        strongest,
        weakestObjectives,
        weakestTypes,
        weakestSkills,
        hasObjectiveWeakness,
        hasTypeWeakness,
        hasSkillWeakness,
        noMajorWeakness,
        behavior,
        verdict,
        nextSteps,
        recommendations: getRecommendedReviewResources({ weakestObjectives })
    };
}


let latestReviewMaterialsHTML = "";

function getRecommendedReviewResources(report){
    const catalog = window.INSTRUCTIONAL_RESOURCES;
    if(!catalog || !Array.isArray(catalog.resources)) return [];

    const resourceById = new Map(catalog.resources.map(resource => [resource.id, resource]));
    const selectedIds = [];
    const addIds = ids => (ids || []).forEach(id => {
        if(resourceById.has(id) && !selectedIds.includes(id)) selectedIds.push(id);
    });
    const objectiveIds = (report && report.weakestObjectives || [])
        .map(entry => String(entry && entry.key || "").match(/LO\d+\.\d+/i))
        .filter(Boolean)
        .map(match => match[0].toUpperCase());

    objectiveIds.forEach(objectiveId => {
        const mapping = catalog.objectiveMappings && catalog.objectiveMappings[objectiveId];
        if(mapping){
            addIds(mapping.resourceIds);
            addIds(mapping.fallbackResourceIds);
        }
    });

    if(!selectedIds.length){
        Object.values(catalog.fallbackResourceIds || {}).forEach(addIds);
    }

    return selectedIds
        .map(id => resourceById.get(id))
        .filter(Boolean)
        .slice(0, Number(catalog.settings && catalog.settings.maximumRecommendations) || 3);
}

function copyMasteryReport(){
    const report = getMasteryReportData();

    const lines = [

        `Mode: ${report.mode}`,
        `Accuracy: ${formatPercent(report.accuracy)} (${report.correctAnswers}/${report.totalAttempts})`,
        `Best Streak: ${report.maxStreak}`,
        `Time: ${report.timeString}`,
        report.score !== null ? `Score: ${report.score}` : null,
        "",
        "Strongest Signals:",
        ...(report.strongest.length ? report.strongest.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No clear strength signal yet."]),
        "",
        report.hasObjectiveWeakness ? "Weakest Learning Objectives:" : "Objective Signals:",
        ...(report.hasObjectiveWeakness && report.weakestObjectives.length ? report.weakestObjectives.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major objective weakness detected. Try Legendary Mode next."]),
        "",
        report.hasTypeWeakness ? "Weakest Question Forms:" : "Question Form Signals:",
        ...(report.hasTypeWeakness && report.weakestTypes.length ? report.weakestTypes.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major question-form weakness detected."]),
        "",
        report.hasSkillWeakness ? "Weakest Skills:" : "Skill Signals:",
        ...(report.hasSkillWeakness && report.weakestSkills.length ? report.weakestSkills.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major skill weakness detected."]),
        "",
        "Next Moves:",
        ...report.nextSteps.map(step => `- ${step}`),
        "",
        "Recommended Review:",
        ...(report.recommendations || getRecommendedReviewResources(report)).map(resource => `- ${resource.title} (${resource.typeLabel || resource.type}): ${resource.url}`)
    ].filter(line => line !== null);

    const text = lines.join("\n");

    function markCopied(){
        const btn = Array.from(document.querySelectorAll("button"))
            .find(button => button.innerText === "Copy Report" || button.innerText === "Copied!");

        if(!btn) return;
        const original = btn.innerText;
        btn.innerText = "Copied!";
        setTimeout(() => { btn.innerText = original; }, 1800);
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(markCopied);
        return;
    }

    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
    markCopied();
}
