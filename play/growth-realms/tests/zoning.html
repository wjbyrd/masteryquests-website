<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Realms zoning inspection</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../visual.css"><link rel="stylesheet" href="../interaction.css"><link rel="stylesheet" href="../mq-theme.css"><link rel="stylesheet" href="../cleanup.css">
<style>body{margin:0;padding:16px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font:22px sans-serif}button,select,input{min-height:44px}#fixture{width:min(1120px,100%);margin:16px auto}.city-map{width:100%;max-width:none!important}#audit{font:14px monospace;white-space:pre-wrap}.zone-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}</style></head>
<body><header><h1>District zoning inspection</h1><select id="city" aria-label="City"><option value="meridian">Meridian</option><option value="rivermark">Rivermark</option></select><button id="start">Starting layout</button><button id="max">Maximum layout</button><label>All districts level <input id="level" type="number" min="0" max="9" value="5"></label><label><input id="building" type="checkbox"> Construction</label><label>Construction phase <input id="progress" type="range" min="0" max="1" step=".1" value=".4"></label><label><input id="overlay" type="checkbox"> Parcels / roads / routes</label></header><div id="fixture"></div><pre id="audit"></pre><script type="module" src="zoning-fixture.js"></script></body></html>
