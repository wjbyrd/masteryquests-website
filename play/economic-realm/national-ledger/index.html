/* =========================================
   5. PROGRESS & MAZE TRACK — SAFE TO CUSTOMIZE (WITH RULES)
========================================= */
    
/* Progress bar container — background track */
#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(12,18,18,0.95),
        rgba(4,5,5,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(214,177,92,0.22);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.82),
        0 0 10px rgba(214,177,92,0.12);
}
    
/* Progress fill — width controlled by JS */
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #2f4f43,
        #d6b15c,
        #8a3a24);
    box-shadow:
        0 0 12px rgba(214,177,92,0.45),
        0 0 22px rgba(127,29,29,0.25);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}
    
/* Individual room cell — default state */
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(22,30,28,0.72),
        rgba(7,9,9,0.86));
    border: 1px solid rgba(214,177,92,0.18);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.72),
        0 0 5px rgba(214,177,92,0.08);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */
.maze-box.active {
    background: radial-gradient(circle,
        rgba(214,177,92,0.48),
        rgba(65,95,78,0.36),
        rgba(12,18,18,0.92));
    border: 2px solid #f0c75e;
    box-shadow:
        0 0 12px rgba(240,199,94,0.78),
        0 0 24px rgba(214,177,92,0.48),
        inset 0 0 12px rgba(0,0,0,0.62);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(65,95,78,0.62),
        rgba(20,31,28,0.88));
    border-color: rgba(214,177,92,0.38);
    box-shadow:
        0 0 8px rgba(214,177,92,0.28),
        inset 0 0 10px rgba(0,0,0,0.7);
}

/* Boss room highlights (10, 20, 30) — visual only */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #d6b15c,
        0 0 18px rgba(65,95,78,0.8);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #c46a3a,
        0 0 18px rgba(127,29,29,0.75);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f0c75e,
        0 0 24px rgba(127,29,29,0.95),
        0 0 34px rgba(214,177,92,0.42);
}

.streak {

        drop-shadow(0 0 8px rgba(214,177,92,0.75))

/* Individual artifact slot (default = locked state) */    
.artifactSlot {

    text-align:center;

/* Locked artifact image (dimmed effect) */    
.artifactSlot img {

/* Artifact label text */
.artifactSlot span {

========================================= */
    
/* Hit animation — triggered when boss takes damage */
.boss-shake {

}

/* =========================================
   9. ANIMATION SYSTEM — SAFE TO CUSTOMIZE (WITH CARE)
========================================= */

/* Ambient lighting effect (environmental immersion) */    
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.05) saturate(1.04);
  }
  50% {
    filter: brightness(0.96) saturate(0.98);
  }
  75% {
    filter: brightness(1.04) saturate(1.03);
  }
}

/* Damage feedback (quick impact effect) */    
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss-specific hit feedback (stronger shake) */    
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room highlight animation (maze tracker) */   
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(214,177,92,0.68),
      inset 0 0 10px rgba(0,0,0,0.6);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(240,199,94,0.92),
      0 0 32px rgba(214,177,92,0.48),
      0 0 42px rgba(65,95,78,0.24),
      inset 0 0 12px rgba(0,0,0,0.64);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(214,177,92,0.78),
      0 0 24px rgba(127,29,29,0.24),
      inset 0 0 11px rgba(0,0,0,0.64);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(240,199,94,0.72),
      0 0 30px rgba(214,177,92,0.36),
      inset 0 0 12px rgba(0,0,0,0.68);
  }
}


	
	
/* Victory text animation (end screen emphasis) */    
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(240,199,94,0.72),
      0 2px 6px rgba(0,0,0,0.9);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(240,199,94,0.95),
      0 0 42px rgba(214,177,92,0.62),
      0 0 52px rgba(127,29,29,0.36),
      0 3px 8px rgba(0,0,0,0.9);
  }
}


/* Idle boss movement (subtle hovering effect) */    
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */   
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Wizard idle animation (subtle movement) */    
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance animation */    
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* General pulse animation for relics */   
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(214,177,92,0.66))
      drop-shadow(0 0 18px rgba(65,95,78,0.34))
      drop-shadow(0 0 24px rgba(0,0,0,0.55));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(240,199,94,0.92))
      drop-shadow(0 0 30px rgba(214,177,92,0.55))
      drop-shadow(0 0 38px rgba(127,29,29,0.24));
  }
}

/* Streak Icon Glow */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

   Inspect here if you want to change:

.score-attack-hud{

    inset 0 0 12px rgba(0,0,0,0.74);

.score-attack-best-label{
  font-size: 11px;

  font-size: 24px;
  font-weight: 900;
  color: #f7d982;
  text-shadow:
    0 0 12px rgba(247,217,130,0.70),

  font-size: 18px;
  font-weight: 800;
  color: #e0f2fe;
  text-shadow:
    0 0 10px rgba(56,189,248,0.46);
}

#scoreFloatLayer{
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}

.score-float{
  position: absolute;
  left: 50%;
  top: var(--score-float-top, 42%);
  transform: translateX(-50%);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
  animation: scoreFloatUp 1.2s ease-out forwards;
  text-shadow:
    0 0 10px rgba(0,0,0,0.96),
    0 0 18px rgba(56,189,248,0.42);
}

.score-float.positive{ color: #f7d982; }
.score-float.negative{ color: #f87171; }
.score-float.neutral{ color: #c7ecff; }

@keyframes scoreFloatUp{
  0%{ opacity: 0; transform: translate(-50%, 12px) scale(.85); }
  15%{ opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  100%{ opacity: 0; transform: translate(-50%, -58px) scale(1); }
}

<!-- =========================================
HTML STRUCTURE — GAME UI FRAMEWORK
=========================================

This section defines the full layout of the game.

It includes:
- start screen (player entry)
- accessibility elements (screen reader announcements)
- transition overlays (hallway scenes)
- top panel (progress + artifacts)
- main panel (wizard + gameplay)
- dynamic content containers (questions, answers, feedback)

-----------------------------------------
SAFE TO EDIT (CUSTOMIZATION):
- text (titles, labels, instructions)
- images (wizard, artifacts, backgrounds)
- styling (colors, fonts, layout tweaks)
- artifact names and visuals

-----------------------------------------
DO NOT MODIFY (STRUCTURE/IDS):
The following IDs are REQUIRED by JavaScript:

- usernameInput
- gameBox
- question
- answers
- message
- mazeTrack
- artifactVault / vault items
- artifactDrop / artifactImage / artifactTitle / artifactText
- hallwayTransition / hallwayText
- srAnnouncements

Renaming or removing these will break:
- question loading
- answer selection
- progression tracking
- artifact system
- accessibility features

-----------------------------------------
NOTES:
- This layout is tightly connected to the game engine
- Most issues come from changing IDs, not styling

Edit appearance freely.
Respect structure strictly.

========================================= -->
<body class="national-ledger">
<!-- Screen reader announcements (accessibility — do not remove) -->    
  <div id="srAnnouncements"
     aria-live="assertive"
     aria-atomic="true"
     style="position:absolute; left:-9999px; height:1px; width:1px; overflow:hidden;">
</div>

<!-- Transition overlay between rooms (safe to style, keep IDs) -->    
<div id="hallwayTransition">
    <div id="hallwayText"></div>
</div>

<!-- Start screen / player entry (safe to redesign completely) -->
<div id="startScreen">
  <div class="start-content">
    <h1 class="title">THE NATIONAL LEDGER</h1>
    <button class="start-btn" onclick="showModeSelect()">ENTER THE LEDGER</button>
    <button id="continueRunBtn" class="start-btn secondary-start-btn" onclick="continueSavedRun()" style="display:none;">
        CONTINUE STANDARD RUN
    </button>
  </div>
</div>

<div id="modeSelectScreen" class="mode-select-screen" style="display:none;">
  <div class="mode-select-panel">
    <h1 class="mode-title">CHOOSE YOUR LEDGER RUN</h1>
    <p class="mode-subtitle">Select how you want to enter The National Ledger.</p>
    <div class="mode-grid">
      <button class="mode-card" onclick="startSelectedMode('standard')"><img src="mode_standard.webp" alt="" aria-hidden="true"><span class="mode-card-title">Standard Campaign</span><span class="mode-card-text">Full 30-room run with bosses, artifacts, setbacks, save status, and Realm progress.</span></button>

            el.webkitRequestFullscreen();

    scoreAttackScore = 0;

function getScoreAttackSpeedBonus(responseTime){
    const bonus = SCORE_ATTACK_CONFIG.speedBonuses.find(item => responseTime <= item.maxMs);
    return bonus ? bonus.points : 0;
}

function getScoreAttackStreakBonus(currentStreak){
    const bonus = SCORE_ATTACK_CONFIG.streakBonuses.find(item => currentStreak >= item.minStreak);
    return bonus ? bonus.points : 0;
}

function applyScoreAttackEvent(label, amount){
    if(!modeUsesScoreAttack()) return;

    const numericAmount = Number(amount || 0);
    if(!Number.isFinite(numericAmount) || numericAmount === 0) return;

    scoreAttackScore += numericAmount;

    // No negative scoreboard. Punishment hurts, but it does not turn into comedy.
    if(scoreAttackScore < 0){
        scoreAttackScore = 0;
    }

    scoreAttackEvents.push({
        label,
        amount: numericAmount,
        scoreAfter: scoreAttackScore,
        room,
        questionId: currentQuestion?.id || 0,
        time: Date.now()
    });

    if(scoreAttackEvents.length > 120){
        scoreAttackEvents.shift();
    }

    if(scoreAttackScore > scoreAttackBestScore){
        scoreAttackBestScore = scoreAttackScore;
        localStorage.setItem(`${SCORE_ATTACK_STORAGE_PREFIX}_bestScore`, String(scoreAttackBestScore));
    }

    updateScoreAttackHud();
    showScoreAttackFloat(label, numericAmount);
}

function applyScoreAttackForAnswer(isCorrect, responseTime){
    if(!modeUsesScoreAttack()) return;

    if(isCorrect){
        applyScoreAttackEvent("Correct", SCORE_ATTACK_CONFIG.correct);

        const speedBonus = getScoreAttackSpeedBonus(responseTime);
        if(speedBonus > 0){
            applyScoreAttackEvent("Speed", speedBonus);
        }

        const streakBonus = getScoreAttackStreakBonus(streak);
        if(streakBonus > 0){
            applyScoreAttackEvent("Streak", streakBonus);
        }

        return;
    }

    const penalty = responseTime < 4000
        ? SCORE_ATTACK_CONFIG.rapidMissPenalty
        : SCORE_ATTACK_CONFIG.wrongPenalty;

    applyScoreAttackEvent(responseTime < 4000 ? "Rapid Miss" : "Wrong", penalty);
}

function applyScoreAttackRapidGuessPenalty(){
    if(!modeUsesScoreAttack()) return;

    applyScoreAttackEvent("Rapid Guess", SCORE_ATTACK_CONFIG.rapidMissPenalty);
}

function getScoreAttackResolveDelay(isCorrect){
    if(!modeUsesScoreAttack()) return 0;

    return isCorrect
        ? SCORE_ATTACK_CONFIG.resolveDelayCorrectMs
        : SCORE_ATTACK_CONFIG.resolveDelayWrongMs;
}

function waitForScoreAttackResolve(isCorrect){
    const delay = getScoreAttackResolveDelay(isCorrect);

    if(!delay || delay <= 0){
        return Promise.resolve();
    }

    return new Promise(resolve => setTimeout(resolve, delay));
}

    activeScoreFloatCount++;
    const stackOffset = Math.min(activeScoreFloatCount - 1, 4) * 30;

function generatePseudonymFromSeed(seed) {
    const titles = [
        "Axiom", "Ledger", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];

    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Registrar",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];

    let hash = 0;
    const cleanSeed = String(seed || "run").trim().toLowerCase();

    for (let i = 0; i < cleanSeed.length; i++) {
        hash = ((hash << 5) - hash) + cleanSeed.charCodeAt(i);
        hash |= 0;
    }

    const positiveHash = Math.abs(hash);

    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);

    return `${title}${role}${number}`;
}

function inferSkill(question){
    if(!question) return null;

    if(question.primarySkill) return question.primarySkill;
    if(question.repairSkill) return question.repairSkill;
    if(question.skill) return question.skill;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "").toLowerCase();
    const objective = (question.objective || "").toLowerCase();

    // =============================================
    // CHAPTER 24 — GDP skills
    // =============================================

    if(tag === "gdp_income_expenditure" || objective === "lo24.1" || q.includes("income equals expenditure") || q.includes("total income") || q.includes("total expenditure") || q.includes("income-expenditure")){
        return "income_expenditure_identity";
    }

    if(tag === "gdp_definition" || objective === "lo24.2"){
        if(q.includes("intermediate good") || q.includes("final good") || q.includes("double count") || q.includes("value added") || q.includes("flour") || q.includes("bakery")){
            return "intermediate_vs_final_goods";
        }

        return "gdp_counting_rules";
    }

    if(tag === "gdp_components" || objective === "lo24.3"){
        if(q.includes("exports") || q.includes("imports") || q.includes("net exports") || q.includes("imported")){
            return "imports_exports_nx";
        }

        if(q.includes("inventory") || q.includes("unsold") || q.includes("produces") && q.includes("sells only")){
            return "inventory_investment";
        }

        return "gdp_components_identity";
    }

    if(tag === "real_nominal_gdp" || objective === "lo24.4"){
        if(q.includes("gdp deflator") || q.includes("deflator") || q.includes("nominal gdp") && q.includes("real gdp")){
            return "gdp_deflator";
        }

        return "nominal_vs_real_gdp";
    }

    if(tag === "gdp_wellbeing" || objective === "lo24.5" || q.includes("well-being") || q.includes("well being") || q.includes("leisure") || q.includes("pollution") || q.includes("quality of life") || q.includes("environment")){
        return "gdp_wellbeing_limits";
    }

    // =============================================
    // CHAPTER 25 — CPI, inflation, real interest skills
    // =============================================

    if(tag === "cpi_inflation" || objective === "lo25.1"){
        if(q.includes("inflation rate") || q.includes("rises from") || q.includes("falls from") || q.includes("percentage change")){
            return "inflation_rate";

        return "cpi_vs_gdp_deflator";
    }

    if(tag === "inflation_adjustment" || objective === "lo25.4" || q.includes("today's dollars") || q.includes("today’s dollars") || q.includes("same purchasing power") || q.includes("adjusted for inflation")){
        return "inflation_adjustment";

        return "real_interest_rate";

        }

        if(q.includes("technological knowledge") || q.includes("technology") || q.includes("production method") || q.includes("new method") || q.includes("algorithm")){
            return "technological_knowledge";
        }

        return "productivity_calculation";

    if(tag === "diminishing_returns" || q.includes("diminishing returns") || q.includes("less extra output") || q.includes("less additional output")){
        return "diminishing_returns";
    }

    if(tag === "catch_up_growth" || q.includes("catch-up") || q.includes("catch up") || q.includes("capital is scarce") || q.includes("scarce capital")){
        return "catch_up_effect";
    }

    if(tag === "growth_policy" || objective === "lo26.4" || q.includes("property rights") || q.includes("saving") || q.includes("investment") || q.includes("foreign investment") || q.includes("political stability") || q.includes("free trade") || q.includes("research and development") || q.includes("r&d")){
        return "growth_policy";
    }

    // =============================================
    // CHAPTER 29 — Unemployment skills
    // =============================================

    if(tag === "labor_force_stats" || objective === "lo29.1"){
        if(q.includes("labor force participation") || q.includes("participation rate")){
            return "labor_force_participation";
        }

        if(q.includes("unemployment rate") || q.includes("what is the unemployment") || q.includes("unemployed divided")){

        if(q.includes("discouraged") || q.includes("stopped searching") || q.includes("stop searching") || q.includes("not actively searching")){
            return "discouraged_workers";
        }

        return "employment_classification";
    }

    if(tag === "unemployment_types" || objective === "lo29.3"){
        if(q.includes("frictional") || q.includes("job search") || q.includes("searching for a better") || q.includes("between jobs")){
            return "frictional_unemployment";
        }

        if(q.includes("structural") || q.includes("skill mismatch") || q.includes("mismatch") || q.includes("automation") || q.includes("obsolete") || q.includes("permanently")){
            return "structural_unemployment";
        }

        if(q.includes("cyclical") || q.includes("recession") || q.includes("downturn") || q.includes("weak demand") || q.includes("business cycle")){
            return "cyclical_unemployment";
        }

        return "structural_unemployment";
    }

    if(tag === "labor_market_policy" || objective === "lo29.4"){
        if(q.includes("minimum wage") || q.includes("wage floor") || q.includes("labor surplus") || q.includes("quantity supplied") || q.includes("quantity demanded")){
            return "minimum_wage_surplus";
        }

        if(q.includes("union") || q.includes("efficiency wage") || q.includes("above-equilibrium wages") || q.includes("above equilibrium wages") || q.includes("turnover") || q.includes("worker effort")){
            return "unions_efficiency_wages";
        }

        if(q.includes("unemployment insurance") || q.includes("job-search assistance") || q.includes("job search assistance") || q.includes("benefits")){
            return "frictional_unemployment";
        }

        return "unions_efficiency_wages";
    }

    if(tag === "natural_unemployment" || objective === "lo29.5" || q.includes("natural rate") || q.includes("actual unemployment") || q.includes("cyclical unemployment") || q.includes("normal unemployment")){
        return "natural_rate";
    }

    if(tag === "labor_market_synthesis"){
        if(q.includes("discouraged")) return "discouraged_workers";
        if(q.includes("part-time") || q.includes("underemployment")) return "employment_classification";
        if(q.includes("natural rate")) return "natural_rate";
        return "labor_force_calculation";
    }

    if(tag === "macro_integration"){
        if(q.includes("real wages") || q.includes("nominal wages") || q.includes("cpi")) return "inflation_adjustment";
        if(q.includes("unemployment")) return "labor_force_calculation";
        if(q.includes("nominal gdp") || q.includes("real gdp")) return "nominal_vs_real_gdp";
        return "integrated_macro_review";
    }

    return null;
}

function getObjectiveBucket(question){
    const objectiveKey = inferObjective(question);
    if(!masteryState.byObjective[objectiveKey]){
        masteryState.byObjective[objectiveKey] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return masteryState.byObjective[objectiveKey];
}

function getObjectiveAccuracy(question){
    return getAccuracy(getObjectiveBucket(question));
}

function getObjectiveFluency(question){
    return getFluency(getObjectiveBucket(question), question?.type || "default");
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

function getTagAccuracy(tag){
    return getAccuracy(getTagBucket(tag));
}

function getTagTypeAccuracy(tag, type){
    return getAccuracy(getTypeBucket(tag, type));
}

function getTagFluency(tag){
    return getFluency(getTagBucket(tag), "default");
}

function getTagTypeFluency(tag, type){
    return getFluency(getTypeBucket(tag, type), type || "default");
}

function recordAdaptiveAttempt(question, isCorrect, responseTime){
    if(!question || !question.tag) return;

    const tagBucket = getTagBucket(question.tag);
    const typeBucket = getTypeBucket(question.tag, question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const skillBucket = getSkillBucket(question);

    updateBucket(tagBucket, isCorrect, responseTime);
    updateBucket(typeBucket, isCorrect, responseTime);
    updateBucket(objectiveBucket, isCorrect, responseTime);
    updateBucket(skillBucket, isCorrect, responseTime);

    masteryState.recent.push({
        correct: !!isCorrect,
        responseTime,
        tag: question.tag,
        type: question.type || "default",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: getSkillKey(question)
    });

    if(masteryState.recent.length > 20){
        masteryState.recent.shift();
    }
}

function getRecentPerformance(windowSize = 8){
    const recent = masteryState.recent.slice(-windowSize);
    if(recent.length === 0){
        return { accuracy: 0, avgCorrectRatio: 1.2, count: 0 };
    }

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

function getWeakestTag(){
    const entries = Object.keys(masteryState.byTag);

    if(entries.length === 0){
        const fallback = Object.entries(conceptMemory || {}).sort((a,b) => b[1]-a[1])[0];
        return fallback ? fallback[0] : null;
    }

    let weakestTag = null;
    let weakestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){
            strongestScore = strength;
            strongestTag = tag;
        }
    });

    return strongestTag;
}

function getBossObjectiveKey(question){
    if(!question) return null;

    const rawObjective = question.objective || inferObjective(question);
    if(!rawObjective) return null;

    const match = String(rawObjective).match(/^LO\d+\.\d+/);
    return match ? match[0] : rawObjective;
}

function getObjectiveFamilyStats(objectiveKey){
    let attempts = 0;
    let correct = 0;
    let weightedTime = 0;

    Object.keys(masteryState.byObjective || {}).forEach(key => {
        if(key === objectiveKey || key.startsWith(objectiveKey + "_")){
            const bucket = masteryState.byObjective[key];
            if(!bucket) return;

            attempts += bucket.attempts || 0;
            correct += bucket.correct || 0;
            weightedTime += (bucket.avgTime || 0) * (bucket.attempts || 0);
        }
    });

    return {
        attempts,
        correct,
        accuracy: attempts ? correct / attempts : null,
        avgTime: attempts ? weightedTime / attempts : 0
    };
}

function getWeakestBossObjective(bank){
    if(!Array.isArray(bank) || bank.length === 0) return null;

    const objectives = [...new Set(
        bank.map(q => getBossObjectiveKey(q)).filter(Boolean)
    )];

    if(objectives.length === 0) return null;

    const scoredObjectives = objectives.map(obj => {
        const stats = getObjectiveFamilyStats(obj);
        const recentMisses = (masteryState.recent || []).filter(item => {
            const itemObjective = item.objective || "";
            return (itemObjective === obj || itemObjective.startsWith(obj + "_")) && !item.correct;
        }).length;

        let score = stats.accuracy === null
            ? 0.35
            : (1 - stats.accuracy) * 2;

        score += recentMisses * 0.25;

        if(stats.avgTime && stats.avgTime > TYPE_TIME_TARGETS.default){
            score += 0.15;
        }

        return {
            objective: obj,
            score,
            attempts: stats.attempts || 0
        };
    });

    const highestScore = Math.max(...scoredObjectives.map(item => item.score));
    const nearHighest = scoredObjectives.filter(item =>
        item.score >= highestScore - 0.05
    );
    const fewestAttempts = Math.min(...nearHighest.map(item => item.attempts));
    const leastSeen = nearHighest.filter(item =>
        item.attempts === fewestAttempts
    );

    return leastSeen[Math.floor(Math.random() * leastSeen.length)].objective;
}

function getBossQuestionFingerprint(question){
    return String(question?.q || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
}


function getBossNarrativeStage(question){
    const stage = String(question?.bossStage || "").toLowerCase();
    return stage === "opening" || stage === "final" ? stage : null;
}

function orderBossQuestionSet(selected, available){
    const ordered = [...(selected || [])];

    const replaceDuplicateStage = stage => {
        const stageIndexes = ordered
            .map((question, index) => ({ question, index }))
            .filter(item => getBossNarrativeStage(item.question) === stage)
            .map(item => item.index);

        stageIndexes.slice(1).forEach(index => {
            const selectedIds = new Set(
                ordered.map(question => question?.id).filter(id => id !== undefined)
            );
            const candidates = shuffle(
                (available || []).filter(question =>
                    question &&
                    !selectedIds.has(question.id) &&
                    getBossNarrativeStage(question) !== stage
                )
            );
            const replacement = candidates.find(question =>
                getBossNarrativeStage(question) === null
            ) || candidates[0];

            if(replacement){
                ordered[index] = replacement;
            }
        });
    };

    replaceDuplicateStage("final");
    replaceDuplicateStage("opening");

    const stageRank = stage =>
        stage === "opening" ? 0 : stage === "final" ? 2 : 1;

    return ordered
        .map((question, index) => ({
            question,
            index,
            stage: getBossNarrativeStage(question)
        }))
        .sort((a, b) =>
            stageRank(a.stage) - stageRank(b.stage) || a.index - b.index
        )
        .map(item => item.question);
}

function getRecentQuestionFingerprints(limitPerPool = 15){
    const recentIds = new Set();

    Object.values(questionHistory || {}).forEach(history => {
        (history || []).slice(-limitPerPool).forEach(id => recentIds.add(id));
    });

    const fingerprints = new Set();

    Object.values(questionBanks || {}).forEach(bank => {
        (bank || []).forEach(question => {
            if(recentIds.has(question.id)){
                fingerprints.add(getBossQuestionFingerprint(question));
            }
        });
    });

    return fingerprints;
}

function buildBossQuestionSet(bank, poolName, chosenObjective){
    if(!Array.isArray(bank) || bank.length === 0) return [];

    const usedIds = new Set(usedQuestions[poolName] || []);
    const recentFingerprints = getRecentQuestionFingerprints();

    let available = bank.filter(question =>
        question &&
        !usedIds.has(question.id) &&
        !recentFingerprints.has(getBossQuestionFingerprint(question))
    );

    if(available.length < 3){
        available = bank.filter(question =>
            question &&
            !recentFingerprints.has(getBossQuestionFingerprint(question))
        );
    }

    if(available.length < 3){
        available = bank.filter(question =>
            question && !usedIds.has(question.id)
        );
    }

    if(available.length < 3){
        usedQuestions[poolName] = [];
        available = bank.filter(Boolean);
    }

    const objectiveMatches = chosenObjective
        ? available.filter(question =>
            getBossObjectiveKey(question) === chosenObjective
        )
        : [];

    const selected = objectiveMatches.length >= 3
        ? shuffle([...objectiveMatches]).slice(0, 3)
        : shuffle([...objectiveMatches]);

    const remaining = shuffle(
        available.filter(question =>
            !selected.some(item => item.id === question.id)
        )
    );

    while(selected.length < 3 && remaining.length > 0){
        const selectedObjectives = new Set(
            selected.map(getBossObjectiveKey).filter(Boolean)
        );
        const selectedTypes = new Set(
            selected.map(item => item.type).filter(Boolean)
        );
        const selectedSkills = new Set(
            selected.map(item => item.primarySkill).filter(Boolean)
        );

        let bestScore = -Infinity;
        let bestCandidates = [];

        remaining.forEach(question => {
            let score = 0;
            const objective = getBossObjectiveKey(question);

            if(objective && !selectedObjectives.has(objective)) score += 2;
            if(question.type && !selectedTypes.has(question.type)) score += 1;
            if(question.primarySkill && !selectedSkills.has(question.primarySkill)) score += 1;

            if(score > bestScore){
                bestScore = score;
                bestCandidates = [question];
            } else if(score === bestScore){
                bestCandidates.push(question);
            }
        });

        const picked = bestCandidates[
            Math.floor(Math.random() * bestCandidates.length)
        ];

        selected.push(picked);
        remaining.splice(remaining.findIndex(item => item.id === picked.id), 1);
    }

    return orderBossQuestionSet(selected, available);
}

function getSelectionProfile(){
    const recent = getRecentPerformance(8);
    const strongestTag = getStrongestTag();
    const strongestFluency = strongestTag ? getTagFluency(strongestTag) : 0;

    return {
        recentAccuracy: recent.accuracy,
        avgCorrectRatio: recent.avgCorrectRatio,
        strongestTag,
        strongestFluency,
        mediumReady: streak >= 5 && recent.count >= 5 && recent.accuracy >= 0.8,
        hardReady: streak >= 8 && recent.count >= 6 && recent.accuracy >= 0.88 && recent.avgCorrectRatio <= 1.2 && strongestFluency >= 0.72,
        eliteReady: streak >= 14 && recent.count >= 8 && recent.accuracy >= 0.92 && recent.avgCorrectRatio <= 1.05 && strongestFluency >= 0.82
    };
}

function determineSelectionPurpose(profile){
    if(profile.recentAccuracy === 0 && getRecentPerformance(8).count === 0) return "support";
    if(profile.eliteReady) return "stretch";
    if(profile.recentAccuracy < 0.65) return "repair";
    if(profile.recentAccuracy < 0.8) return "confirm";
    if(profile.hardReady) return "challenge";
    return "diversify";
}

function shouldTriggerDetour(question){
    if(!question || !question.tag) return false;
    const tagWeakness = conceptMemory[question.tag] || 0;
    const typeBucket = getTypeBucket(question.tag, question.type);
    const typeAccuracy = getAccuracy(typeBucket);
    const objectiveAccuracy = getObjectiveAccuracy(question);

    return tagWeakness >= 2.2
        || (typeBucket && typeBucket.attempts >= 2 && typeAccuracy !== null && typeAccuracy < 0.6)
        || (objectiveAccuracy !== null && objectiveAccuracy < 0.5 && getObjectiveBucket(question).attempts >= 2);
}

function resetRemediationState(){
	remediationState = {
 	   active: false,
 	   stage: null,
  	   tag: null,
  	   objective: null,
       skill: null,
       commonError: null,
       sourceType: null,
       returnRoom: null,
       originQuestionId: null,
       careless: false
   };
    detourActive = false;
    detourReturnRoom = null;
}

function planRemediation(question, responseTime){
    if(!question || !question.tag) return null;

    const expected = getTypeTargetMs(question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const objectiveAccuracy = getAccuracy(objectiveBucket);
    const objectiveAttempts = objectiveBucket?.attempts || 0;
    const carelessMiss = responseTime < expected * 0.55 && (objectiveAccuracy === null || objectiveAccuracy >= 0.45);
    const repeatedObjectiveMiss = objectiveAttempts >= 2 && objectiveAccuracy !== null && objectiveAccuracy < 0.6;
    const slowStruggle = responseTime > expected * 1.2;
    const skill = getSkillKey(question);

    return {
        active: true,
        stage: carelessMiss ? "bridge" : "repair",
        tag: question.tag,
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: skill,
        commonError: question.commonError || null,
        sourceType: question.type || "default",
        returnRoom: room,
        originQuestionId: question.id || null,
        careless: carelessMiss,
        repeatedObjectiveMiss,
        slowStruggle
    };
}

function getRemediationStageLabel(stage){
    if(stage === "repair") return "Concept Repair";
    if(stage === "bridge") return "Bridge Repair";
    return "Recovery Retest";
}

function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey || inferSkill(q) === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

function resolveRecordSkill(record){
    if(!record) return null;

    const primarySkill = String(record.primarySkill || record.skillId || "").trim();
    if(primarySkill) return primarySkill;

    const repairSkill = String(record.repairSkill || record.repairSkillId || "").trim();
    if(repairSkill) return repairSkill;

    const inferredSkill = typeof inferSkill === "function" ? inferSkill(record) : null;
    return inferredSkill ? String(inferredSkill).trim() : null;
}

function getStableQuestionIdentity(record){
    if(record?.questionId) return `questionId:${record.questionId}`;
    if(record?.id !== undefined && record?.id !== null) return `id:${record.id}`;
    return `content:${String(record?.q || "")}::${JSON.stringify(record?.options || [])}`;
}

function deduplicateQuestions(records){
    const seen = new Set();
    return (records || []).filter(record => {
        if(!record) return false;
        const identity = getStableQuestionIdentity(record);
        if(seen.has(identity)) return false;
        seen.add(identity);
        return true;
    });
}

function collectAuxiliaryCandidates(poolEntries, requestedSkill, context = {}){
    const skill = String(requestedSkill || "").trim();
    if(!skill) return [];

    const excludedIds = new Set(context.excludeIds || []);
    const entries = Array.isArray(poolEntries) ? poolEntries : Object.entries(poolEntries || {});
    const orderedEntries = [
        ...entries.filter(([poolKey]) => poolKey === skill),
        ...entries.filter(([poolKey]) => poolKey !== skill)
    ];
    const matches = [];

    orderedEntries.forEach(([poolKey, pool]) => {
        if(!Array.isArray(pool)) return;
        pool.forEach(record => {
            if(!record || excludedIds.has(record.id)) return;
            const declaredSkill = resolveRecordSkill(record);
            const legacyPoolMatch = !declaredSkill && poolKey === skill;
            if(declaredSkill === skill || legacyPoolMatch) matches.push(record);
        });
    });

    const compatibilityEntries = Array.isArray(context.compatibilityEntries)
        ? context.compatibilityEntries
        : [];
    const compatibilityCandidates = compatibilityEntries.length > 0
        ? collectLegacyAuxiliaryFallback(
            compatibilityEntries,
            context.objectiveKey,
            context.tag,
            context.excludeIds || [],
            skill
        )
        : [];

    return deduplicateQuestions([...compatibilityCandidates, ...matches]);
}

function collectLegacyAuxiliaryFallback(poolEntries, objectiveKey, tag, excludeIds = [], skillKey = null){
    const excludedIds = new Set(excludeIds || []);
    const entries = Array.isArray(poolEntries) ? poolEntries : Object.entries(poolEntries || {});
    const fallbackRecords = deduplicateQuestions(entries.flatMap(([, pool]) =>
        (Array.isArray(pool) ? pool : []).filter(record =>
            record && !excludedIds.has(record.id)
        )
    ));
    const objectiveMatches = fallbackRecords.filter(record => inferObjective(record) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;
    const tagMatches = fallbackRecords.filter(record => record.tag === tag);
    if(tagMatches.length > 0) return tagMatches;
    return fallbackRecords;
}

function getRetestPoolName(){
    if(room <= 9) return "easy";
    if(room <= 19) return "medium";
    if(room <= 25) return "hard";
    if(room <= 29) return "hard";
    return "elite";
}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);
    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}

function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        const routedRepairPool = state.skill && typeof directSkillRepairRoutes !== "undefined"
            ? directSkillRepairRoutes[state.skill]
            : null;
        const hasRoutedRepairPool = Array.isArray(routedRepairPool) && routedRepairPool.length > 0;
        const repairDirectEntries = hasRoutedRepairPool
            ? [[state.skill, routedRepairPool]]
            : (state.skill && Array.isArray(microSkillRepairPools?.[state.skill])
                ? [[state.skill, microSkillRepairPools[state.skill]]]
                : []);
        const repairEntries = [
            ...repairDirectEntries,
            ...Object.entries(microSkillRepairPools || {})
        ];
        let repairCandidates = collectAuxiliaryCandidates(
            repairEntries,
            state.skill,
            {
                excludeIds,
                compatibilityEntries: hasRoutedRepairPool ? repairDirectEntries : [],
                objectiveKey: state.objective,
                tag: state.tag
            }
        );

        if(repairCandidates.length === 0){
            repairCandidates = collectLegacyAuxiliaryFallback(
                repairDirectEntries,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );
        }

        if(repairCandidates.length === 0){
            repairCandidates = collectLegacyAuxiliaryFallback(
                Object.entries(microSkillRepairPools || {}),
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );
        }

        if(repairCandidates.length > 0){
            return weightedPick(repairCandidates, {
                mode: "support",
                purpose: "repair"
            });
        }
    }

    if(state.stage === "bridge"){
        const bridgeEntries = Object.entries(microSkillBridgePools || {});
        const bridgeDirectEntries = state.skill && Array.isArray(microSkillBridgePools?.[state.skill])
            ? [[state.skill, microSkillBridgePools[state.skill]]]
            : [];
        let bridgeCandidates = collectAuxiliaryCandidates(
            bridgeEntries,
            state.skill,
            { excludeIds }
        );

        if(bridgeCandidates.length === 0){
            bridgeCandidates = collectLegacyAuxiliaryFallback(
                bridgeDirectEntries,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );
        }

        if(bridgeCandidates.length === 0){
            bridgeCandidates = collectLegacyAuxiliaryFallback(
                bridgeEntries,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );
        }

        if(bridgeCandidates.length > 0){
            return weightedPick(bridgeCandidates, {
                mode: "support",
                purpose: "confirm"
            });
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}
function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {id:999999,q:"No question pool is available for this room. Check the questionBanks configuration.",options:["Continue","Continue","Continue","Continue"],a:0,tag:"system",type:"default",objective:"system_check",feedback:"A question pool is missing."};
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
        timedModeTimerInterval = null;
    }

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "none";

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.classList.remove("timer-warning");
        timerDisplay.innerText = "10:00";
    }
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

// Legendary mode uses dedicated legendary and legendaryBoss pools.

if(!questionBanks.legendary || questionBanks.legendary.length === 0){

function shuffleOptions(question){
    const q = {
        ...question,
        options: [...(question.options || [])],
        secondarySkills: [...(question.secondarySkills || [])]
    };

    const correctText = Number.isInteger(question.a)
        ? question.options[question.a]
        : null;

    for(let i = q.options.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    if(correctText !== null){
        q.a = q.options.indexOf(correctText);
    } else {
        delete q.a;
    }

    return q;
}

async function isQuestionAnswerCorrect(question, selectedIndex){
    if(!question || !Array.isArray(question.options)) return false;
    const selectedOptionText = question.options[selectedIndex] ?? "";
    if(typeof question.aHash === "string"){
        if(typeof isPublishedAnswerCorrect !== "function"){
            throw new Error("Published answer verification helper is missing.");
        }
        return isPublishedAnswerCorrect(question, selectedOptionText);
    }
    return Number.isInteger(question.a) && selectedIndex === question.a;
}

async function verifyQuestionAnswerWithTimeout(question, selectedIndex, timeoutMs = 5000){
    let timeoutId = null;

    const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
            reject(new Error("Answer verification timed out."));
        }, timeoutMs);
    });

    try {
        return await Promise.race([
            isQuestionAnswerCorrect(question, selectedIndex),
            timeoutPromise
        ]);
    } finally {
        if(timeoutId !== null){
            clearTimeout(timeoutId);
        }
    }
}

function randomQuestion(poolName) {
    let pool = questionBanks[poolName]

    // Safety check in case poolName is invalid
    if (!pool) return null;
    
    let used = [
        ...usedQuestions.easy,
        ...usedQuestions.medium,
        ...usedQuestions.hard,
        ...usedQuestions.easyBoss,
        ...usedQuestions.mediumBoss,
        ...usedQuestions.finalBoss,
    ];

    let available = pool.filter(q => !used.includes(q.id));

    if(available.length === 0){
        usedQuestions[poolName] = []
        available = pool
    }

    // Avoid three identical question types in a row
    let filtered = available;
    if (lastTypes.length >= 2) {
        let last1 = lastTypes[lastTypes.length - 1];
        let last2 = lastTypes[lastTypes.length - 2];

        if (last1 === last2) {
            filtered = available.filter(q => q.type !== last1);
            if (filtered.length === 0) filtered = available;
        }
    }

    let question = filtered[Math.floor(Math.random() * filtered.length)];

usedQuestions[poolName].push(question.id)

// Track types
lastTypes.push(question.type)
if(lastTypes.length > 3){
lastTypes.shift()
}

    return question;
}

// =============================================
// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:
// - no immediate repeats
// - full coverage before reuse
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding new generators (calculationGenerators)
// - modifying pool content
//
// DO NOT MODIFY:
// - shuffle logic
// - bag system (calcBag, _remaining)
// - pop() usage
//
// Breaking this WILL cause:
// - repeated questions
// - uneven distribution
// - predictable patterns
//
// This ensures randomness WITHOUT repetition.
// =============================================     

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Bag system for calculation generators
// Ensures all generators are used before repeating
let calcBag = [];

// Pulls one calculation generator from the bag
// Refills bag when empty (reshuffled)
function pickCalcGenerator(){
    if(calcBag.length === 0){
        calcBag = shuffle([...calculationGenerators]);
    }
    return calcBag.pop();
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    if(rapidGuessHistory.length < RAPID_GUESS_CONFIG.minAttempts){
        return {
            triggered: false,
            avgTime: responseTime,
            accuracy: isCorrect ? 1 : 0
        };
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);

    const avgTime = recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length;
    const accuracy = recent.reduce((sum, item) => sum + item.correct, 0) / recent.length;
    const burst = recent.slice(-RAPID_GUESS_CONFIG.burstWindowSize);
    const burstFastCount = burst.filter(item =>
        item.responseTime < RAPID_GUESS_CONFIG.burstFastMs
    ).length;
    const burstAccuracy = burst.length
        ? burst.reduce((sum, item) => sum + item.correct, 0) / burst.length
        : 1;
    const rollingPattern = avgTime < RAPID_GUESS_CONFIG.avgTimeMs
        && accuracy < RAPID_GUESS_CONFIG.maxAccuracy;
    const burstPattern = burst.length === RAPID_GUESS_CONFIG.burstWindowSize
        && burstFastCount >= RAPID_GUESS_CONFIG.burstMinFast
        && burstAccuracy <= RAPID_GUESS_CONFIG.burstMaxAccuracy;

    return {
        triggered: rollingPattern || burstPattern,
        avgTime,
        accuracy
    };
}

// - correct/incorrect logic
// - streaks
// - setbacks
// - boss damage
// - adaptive memory updates
//
// DO NOT MODIFY unless you understand:
// - conceptMemory
// - detour system
// - progression penalties
//
// Check for artifact names and CHANGE
     
async function answer(choice) {
    const answerSessionId = runSessionId;

    if(isTimedModeTerminal()) return;

    if(isTimedModeExpired()){
        endTimedModeRun();
        return;
    }

    if(answerSubmissionPending || rapidGuessLocked) return;
    answerSubmissionPending = true;
    setAnswerButtonsDisabled(true);
    const responseTime = Date.now() - questionStartTime;
    let isCorrect = false;
    try {
        isCorrect = await verifyQuestionAnswerWithTimeout(currentQuestion, choice);

        if(answerSessionId !== runSessionId || isTimedModeTerminal()) return;

        if(isTimedModeExpired()){
            endTimedModeRun();
            return;
        }
    } catch(error) { if(answerSessionId !== runSessionId) return; console.error("Answer verification failed:", error); answerSubmissionPending = false; setAnswerButtonsDisabled(false); showGameModal({ title: "Answer Check Failed", text: "The National Ledger could not verify this answer. Reload the game files and try again.", confirmText: "Continue" }); return; }

    // --- GLOBAL MEMORY DECAY ---
    for(let tag in conceptMemory){
    conceptMemory[tag] *= 0.95;
    }
   
    totalAttempts++;
   
    const isBossRoom = isBossRoomForMode(room);
    const msgElement = document.getElementById("message");
    const wizard = document.getElementById("wizardImage");
// =============================================
// RAPID GUESSING LOCKOUT
// Catches button-mashing before it pollutes mastery,
// streaks, normal question telemetry, or progression.
// =============================================
const rapidGuess = checkRapidGuessing(isCorrect, responseTime);

if(rapidGuess.triggered && !rapidGuessLocked){
    rapidGuessLocked = true;
    rapidGuessWarnings++;
    adaptiveMode = "non-engaged";

    // SCORE ATTACK MODE ADDITION:
    // Rapid guessing gets punished even when the normal lockout stops progression.
    applyScoreAttackRapidGuessPenalty();

    setAnswerButtonsDisabled(true);

    msgElement.innerHTML =
        `<span class='fade-out-text'>Slow down. Rapid guessing will not move you forward.</span>`;

    sendGameData({
        runID: runID,
        game: "The National Ledger",
        event: "question",
        user: username || "anonymous",
        room: room,
        questionId: currentQuestion.id || 0,
        selectedIndex: choice,        correct: 0,

        rapidGuessing: 1,
        tag: currentQuestion.tag || "none",
        type: currentQuestion.type || "none",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        responseTime: responseTime,
        attempt: totalAttempts ?? 0,
        streak: streak ?? 0,
        elapsedTime: startTime ? (Date.now() - startTime) : 0,
        adaptiveMode: adaptiveMode,
        score: scoreAttackScore,
        bestScore: scoreAttackBestScore
    });

    // Give them a clean restart after the warning.
    // Same question. No movement. No reward.
    rapidGuessHistory = [];

    scheduleForCurrentRun(() => {
        rapidGuessLocked = false;
        questionStartTime = Date.now();
        displayQuestion();

        if(rapidGuessWarnings >= 2){
            msgElement.innerHTML =
                `<span class='fade-out-text'>This is practice, not a slot machine. Read before answering.</span>`;
        } else {
            msgElement.innerHTML =
                `<span class='fade-out-text'>Try again. Read the question carefully.</span>`;
        }
    }, RAPID_GUESS_CONFIG.lockMs);

    return;
}

recordAdaptiveAttempt(currentQuestion, isCorrect, responseTime);

    // =============================================
    // 🔥 UPDATE STREAK FIRST (SOURCE OF TRUTH)
    // =============================================
    if (isCorrect) {
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        recordRealmCorrectAnswer();
        recordRealmStreak(streak);
    } else {
        streak = 0;
		recordBossMistakeForAchievements();
    }

    // SCORE ATTACK MODE ADDITION:
    // Apply score after streak updates, because streak bonus depends on the new streak value.
    // This does not affect progression, adaptive logic, bosses, or realm completion.
    applyScoreAttackForAnswer(isCorrect, responseTime);
   
    // =============================================
    // 🔥 TRACK EVERYTHING (ONE LOCATION ONLY)
    // =============================================
    sendGameData({
        runID: runID,
		game: "The National Ledger",
        event: "question",
        user: username || "anonymous",
        room: room,
        questionId: currentQuestion.id || 0,
        selectedIndex: choice,        correct: isCorrect ? 1 : 0,

        rapidGuessing: 0,
        tag: currentQuestion.tag || "none",
        type: currentQuestion.type || "none",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        responseTime: responseTime,
	    attempt: totalAttempts ?? 0,
        streak: streak ?? 0,
		elapsedTime: startTime ? (Date.now() - startTime) : 0,
          adaptiveMode: adaptiveMode,
          score: scoreAttackScore,
          bestScore: scoreAttackBestScore
    });

    // SCORE ATTACK MODE ADDITION:
    // Pause only in Score Attack so the player can actually read the score result
    // before the normal feedback, boss hit, hallway transition, or wrong-turn modal fires.
    // The buttons stay disabled during the beat so double taps do not create duplicate answers.
    if(modeUsesScoreAttack()){
        setAnswerButtonsDisabled(true);
        await waitForScoreAttackResolve(isCorrect);
        if(answerSessionId !== runSessionId) return;
    }

    // =============================================
    // ✅ CORRECT ANSWER LOGIC
    // =============================================
    if (isCorrect) {
        if(isBossRoom){
        sfxCorrect.pause();
        sfxCorrect.currentTime = 0;

        sfxBossHit.pause();
        sfxBossHit.currentTime = 0;
        sfxBossHit.play().catch(()=>{});
    } else {
        sfxBossHit.pause();
        sfxBossHit.currentTime = 0;

        sfxCorrect.pause();
        sfxCorrect.currentTime = 0;
        sfxCorrect.play().catch(()=>{});
    }
        wizardSpeak(getWizardFeedback("correct"));
       
        wizard.style.transform = "scale(1.1)";
        setTimeout(()=>{
        wizard.style.transform = "";
        },200);

		correctAnswers++;
        handleStreakVisuals();
       
        // --- STAGED REMEDIATION SUCCESS PATH ---
if(remediationState.active){
    if(remediationState.stage === "repair"){
        remediationState.stage = "bridge";
        adaptiveMode = "bridge";

        const bridgeQuestion = getRemediationQuestion(remediationState);

        if(bridgeQuestion){
            currentQuestion = shuffleOptions(bridgeQuestion);

            document.getElementById("question").innerText =
                `${getRemediationStageLabel("bridge")}: ` + currentQuestion.q;

            document.getElementById("formulaHint").innerText =
                currentQuestion.hint ? "💡 Hint: " + currentQuestion.hint : "";

            msgElement.innerHTML =
                `<span class='fade-out-text'>${getRecoveryLine("bridge")}</span>`;

            displayQuestion();
            return;
        }

        remediationState.stage = "retest";
    }

    if(remediationState.stage === "bridge"){
        remediationState.stage = "retest";
        adaptiveMode = "retest";

        const retestQuestion = getRemediationQuestion(remediationState);

        if(retestQuestion){
            currentQuestion = shuffleOptions(retestQuestion);

            document.getElementById("question").innerText =
                `${getRemediationStageLabel("retest")}: ` + currentQuestion.q;

            document.getElementById("formulaHint").innerText =
                currentQuestion.hint ? "💡 Hint: " + currentQuestion.hint : "";

            msgElement.innerHTML =
                `<span class='fade-out-text'>${getRecoveryLine("retest")}</span>`;

            displayQuestion();
            return;
        }
    }

    const returnRoom = remediationState.returnRoom ?? room;

    resetRemediationState();
    adaptiveMode = "support";

    msgElement.innerHTML =
        `<span class='fade-out-text'>${getRecoveryLine("complete")}</span>`;

    room = returnRoom;
    saveGameState();

    scheduleForCurrentRun(loadQuestion, TIMING.normal);
    return;
}

    
        // --- LEARNING: reduce weakness ---
        if(currentQuestion.tag){
            const expected = getTypeTargetMs(currentQuestion.type);
            const speedBonus = responseTime <= expected * 0.85 ? 0.45 : responseTime <= expected * 1.15 ? 0.3 : 0.15;
            conceptMemory[currentQuestion.tag] = Math.max(0,
            ((conceptMemory[currentQuestion.tag] || 0) * 0.68) - speedBonus);
        }
        
       // --- BOSS HIT LOGIC ---
        if(isBossRoom){
        bossHealth--;
        
        const bossLine = getNationalLedgerBossLine({
            isCorrect: true,
            tag: currentQuestion.tag || "",
            type: currentQuestion.type || "",
            objective: currentQuestion.objective || inferObjective(currentQuestion),
            streak,
            bossHealth,
            responseTime
        });

        msgElement.innerHTML =
            `<span style='color:#f87171;font-weight:bold;'>⚔ HIT! Boss Health: ${bossHealth}/3</span><br>
             <span class='fade-out-text'>${bossLine}</span>`;
        triggerBossShake();
        
        if (bossHealth > 0) {
           scheduleForCurrentRun(loadQuestion, TIMING.boss);
           return;
        }
			
         // Boss defeated
		 recordBossDefeatForAchievements();
         sendGameData({
            runID: runID,
			game: "The National Ledger",
            event: "boss_defeated",
            user: username,
            room: room
         });
           
         bossPool = [];
           
        // Boss defeated (artifact unlocks)
        if(modeAllowsRealmProgress()){
    if(room === 10){
        document.getElementById("vaultSeal").classList.add("unlocked");
        localStorage.setItem("nationalLedgerVaultSeal", "true");
        showArtifact(artifacts.seal.img, artifacts.seal.title, artifacts.seal.text);
    }

    if(room === 20){
        document.getElementById("vaultPrism").classList.add("unlocked");
        localStorage.setItem("vaultPrism", "true");
        showArtifact(artifacts.prism.img, artifacts.prism.title, artifacts.prism.text);
    }

    if(room === 30){
        document.getElementById("vaultCrown").classList.add("unlocked");
        localStorage.setItem("vaultCrown", "true");
        showArtifact(artifacts.crown.img, artifacts.crown.title, artifacts.crown.text);
    }

    updateMissionArtifactCountFromVault();
}

	// ... (Inside the Boss Victory check)
        showKnowledgeRoom(room);
        bossHealth = 3;
        bossPool = []; // Clear the pool so the next boss is fresh
        return; 
    } // <--- THIS ends the "if(isBossRoom)" block

    // --- NORMAL ROOM PROGRESSION ---
    // This code only runs after the selected answer is verified as correct. 
    // AND it wasn't a Boss Room (or a Detour).
   msgElement.innerHTML = "";
   room++;
   timedHighestRoom = Math.max(timedHighestRoom, Math.min(room, 30));
   saveGameState();
       localStorage.setItem("nationalLedgerRoom", room);

   if(gameMode === "timed" && timedModeEndTime && Date.now() >= timedModeEndTime){
       endTimedModeRun();
       return;
   }

   showHallwayTransition(currentQuestion.feedback);
   return;
    }  
	
// =============================================
// ❌ WRONG ANSWER BLOCK — ALL FAILURE LOGIC
// =============================================
       
	if (isBossRoom) {
   	 sfxWrong.volume = 0.7;
	} else {
  	  sfxWrong.volume = 0.5;
	}

    sfxWrong.currentTime = 0;
    sfxWrong.play().catch(() => {});

    wizardSpeak(getWizardFeedback("wrong"));

    wizard.style.transform = "translateX(-6px)";
    setTimeout(() => {
        wizard.style.transform = "translateX(6px)";
        setTimeout(() => {
            wizard.style.transform = "";
        }, 100);
    }, 100);

    // --- LEARNING: increase weakness ---
    if (currentQuestion.tag) {
        const expected = getTypeTargetMs(currentQuestion.type);
        const rushPenalty = responseTime < expected * 0.65 ? 1.25 : 1;
        conceptMemory[currentQuestion.tag] =
            (conceptMemory[currentQuestion.tag] || 0) + rushPenalty;
    }

    if(isBossRoom){
        const bossLine = getNationalLedgerBossLine({
            isCorrect: false,
            tag: currentQuestion.tag || "",
            type: currentQuestion.type || "",
            objective: currentQuestion.objective || inferObjective(currentQuestion),
            streak,
            bossHealth,
            responseTime
        });

        msgElement.innerHTML = `<span class='fade-out-text'>${bossLine}</span>`;
    }

    // --- IF STUDENT MISSES DURING ACTIVE REMEDIATION ---
if(remediationState.active){
    const remediationPrompt = getRemediationQuestion(remediationState);

    if(remediationPrompt){
        currentQuestion = shuffleOptions(remediationPrompt);
        adaptiveMode = remediationState.stage;

        document.getElementById("question").innerText =
            `${getRemediationStageLabel(remediationState.stage)}: ` + currentQuestion.q;

        document.getElementById("formulaHint").innerText =
            currentQuestion.hint ? "💡 Hint: " + currentQuestion.hint : "";

        msgElement.innerHTML =
            `<span class='fade-out-text'>${getRecoveryLine("miss")}</span>`;

        displayQuestion();
        return;
    }

    resetRemediationState();
}

// --- STAGED REMEDIATION TRIGGER ---
if (gameMode !== "legendary" && !remediationState.active && currentQuestion.tag && shouldTriggerDetour(currentQuestion)) {
    remediationState = planRemediation(currentQuestion, responseTime) || remediationState;
    detourActive = true;
    detourReturnRoom = room;

    const remediationPrompt = getRemediationQuestion(remediationState);

    if (remediationPrompt) {
        currentQuestion = shuffleOptions(remediationPrompt);
        adaptiveMode = remediationState.stage;

        document.getElementById("question").innerText =
            `${getRemediationStageLabel(remediationState.stage)}: ` + currentQuestion.q;

        document.getElementById("formulaHint").innerText =
            currentQuestion.hint ? "💡 Hint: " + currentQuestion.hint : "";

        const remediationMessage = remediationState.careless
            ? "You rushed the entry. Slow down and audit the category."
            : remediationState.slowStruggle
                ? "The Ledger resists. Rebuild the concept before advancing."
                : getRecoveryLine(remediationState.stage);

        msgElement.innerHTML =
            `<span class='fade-out-text'>${remediationMessage}</span>`;

        displayQuestion();
        return;
    }
}
	
    // --- FALLBACK LOGIC ---
    document.getElementById("streakDisplay").innerText = "";

    bossHealth = 3;
    bossPool = [];

	let fallback = (room % 10 === 0 ? 3 : (room >= 21 ? 2 : 1));
	let newRoom = room - fallback;

// Never fall back behind the most recently cleared boss gate
	room = Math.max(bossCheckpoint, newRoom);

    if(gameMode === "timed") timedSetbacks++;
    saveGameState();

    showGameModal({
        title: "Ledger Entry Rejected",
        text: `Incorrect. The ledger throws you back to Room ${room}.`,
        confirmText: "Continue",
        onConfirm: loadQuestion
    });
}

// Unlocks artifact in vault + saves progress
// Requires matching ID format: "vault" + ArtifactName
// Safe to customize artifact visuals/text only
function unlockArtifact(key) {
    const id = "vault" + key.charAt(0).toUpperCase() + key.slice(1);
    const storageId = id === "vaultSeal" ? "nationalLedgerVaultSeal" : id;
    const slot = document.getElementById(id);

    if(slot){
        slot.classList.add("unlocked");
        localStorage.setItem(storageId, "true");
        updateMissionArtifactCountFromVault();
    }

    showArtifact(artifacts[key].img, artifacts[key].title, artifacts[key].text);
}

// BOSS HIT ANIMATION — SAFE TO CUSTOMIZE
// =============================================
// Creates shake effect on boss + game box.
//
// You can:
// - adjust animation timing
// - change CSS effects
//
// Safe to remove if no animation desired.
// =============================================     
function triggerBossShake() {
    const icon = document.querySelector(".bossIcon");
    const box = document.getElementById("gameBox");

    // Shake the world
    box.classList.remove("boss-shake");
    void box.offsetWidth;
    box.classList.add("boss-shake");

    // Shake the boss (if it exists)
    if (icon) {
        icon.classList.remove("boss-shake");
        void icon.offsetWidth;
        icon.classList.add("boss-shake");
    }
}

    localStorage.setItem("economicRealm_nationalLedger_legendary_complete", "true");
    localStorage.setItem("nationalLedgerLegendaryComplete", "true");
    clearSavedGame();

    bgMusic.pause();
    bossMusic.pause();
    finalBossMusic.pause();

    if(typeof sfxVictory !== "undefined"){
        sfxVictory.currentTime = 0;
        sfxVictory.play();
    }

    const totalTimeMs = freezeCompletionTime();
    const timeString = formatTime(totalTimeMs);
    const accuracy = totalAttempts > 0 ? Math.round((correctAnswers / totalAttempts) * 100) : 0;
    const verificationCode = generateCode(username + "|LEGENDARY", accuracy, maxStreak, totalTimeMs);

    sendGameData({
        runID,
        game: "The National Ledger",
        event: "legendary_complete",
        user: username,
        room,
        questionId: 0,
        correct: 1,
        tag: "",
        type: "",
        objective: "",
        responseTime: 0,
        attempt: totalAttempts,
        streak,
        elapsedTime: totalTimeMs,
        adaptiveMode: "legendary_complete",
        totalTime: totalTimeMs,
        accuracy: accuracy / 100,
        maxStreak,
        totalAttempts,
        verificationCode: verificationCode
    });

    let judgment = "Legendary Ledger run confirmed. You handled national output, prices, growth, productivity, and labor-market traps under pressure.";

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|ARCHIVE42)
// - hashing logic
// - return format ("ARCH-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "ARCHIVE42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|LEDGER55`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "LDGR-" + Math.abs(hash).toString(36).toUpperCase();
}
