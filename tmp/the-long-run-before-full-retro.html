<title>The Long Run · Living Economy | Mastery Quests</title>
<style>
/* 1. DESIGN TOKENS */
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#071f3b;--panel:#10375f;--line:#527da0;--accent:#79d8d4;--ink:#f5f8fb;--muted:#c4d5e4;--gold:#ffda89}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#16466f,transparent 65%),var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer;min-height:44px}button:disabled{cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible,.world-window:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button,.world-window{-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.shell{max-width:1460px;margin:auto;padding:14px 22px 32px}h1,h2,h3,p{margin-top:0}button.primary{background:var(--accent);color:#071f3b;border:1px solid var(--accent);border-radius:9px;padding:10px 17px;font-weight:800}.secondary{color:var(--ink);background:#17456b;border:1px solid #7299b7;border-radius:9px;padding:9px 14px}.secondary:hover{background:#21587f}.primary:hover{background:#a5eee8}
/* 2. WORLD LAYOUT */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}.brand{font-weight:850;font-size:.87rem;letter-spacing:.12em}.brand span{color:var(--accent)}.version{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 0 10px}.title-row h1{font-size:clamp(1.6rem,3vw,2.05rem);letter-spacing:-.04em;line-height:1;margin:0}.title-row p{font-size:.81rem;color:var(--muted);margin:0}.timeline{display:flex;gap:5px;padding:0;margin:0;list-style:none}.timeline li{font-size:.69rem;border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:nowrap}.timeline .current{color:#071f3b;background:var(--accent);border-color:var(--accent);font-weight:850}.timeline .past{background:#1b4d70;color:#fff}.world-shell{position:relative;border:1px solid #739caa;border-radius:14px;overflow:hidden;background:#bae1e4;box-shadow:0 12px 28px #0003}.world-window{overflow:hidden;outline-offset:-4px!important}.world-svg{display:block;width:100%;height:auto;aspect-ratio:1440/620;background:#c9ebed}.world-topline{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:start;gap:12px;pointer-events:none}.city-name{color:#163a4a;font-size:.72rem;font-weight:850;letter-spacing:.16em;background:#ffffffd9;border-radius:7px;padding:8px 12px;box-shadow:0 2px 5px #244b5820}.motion-control{pointer-events:auto;background:#f7fbf3eb;color:#163a4a;border:1px solid #426b78;border-radius:7px;min-height:44px;padding:7px 12px;font-size:.72rem;font-weight:750}.pan-hint{display:none;font-size:.74rem;color:var(--muted);margin:7px 0 0}.time-passage{position:absolute;inset:0;display:grid;place-items:center;background:#123453e8;font-size:clamp(1.3rem,4vw,3rem);letter-spacing:.15em;font-weight:850;z-index:4}.city-caption{color:var(--muted);font-size:.75rem;line-height:1.4;margin:8px 1px 0;min-height:1em}
/* 3. CITY ILLUSTRATION */
.world-svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16384c}.building-name{font-size:13px;font-weight:850;letter-spacing:.045em}.sign{font-size:12px;font-weight:800}.tiny-sign{font-size:10px;font-weight:800}.price{font-size:16px;font-weight:850;font-variant-numeric:tabular-nums}.light-text{fill:#fff9e9!important}.world-svg .outline{stroke:#466b77;stroke-width:2.5;stroke-linejoin:round}.district{transition:opacity .45s,filter .45s}.world-shell.changing .district{animation:world-arrives .65s steps(3,end) both}.world-shell.changing .district:nth-of-type(2n){animation-delay:.15s}@keyframes world-arrives{from{opacity:.4}to{opacity:1}}
.city-surface{position:relative}.pixel-world{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;z-index:1}.world-topline,.callouts{z-index:2}@media(max-width:1050px){.city-surface{min-width:950px}}@media(max-width:700px){.city-surface{width:960px;min-width:960px}}
/* 4. HUD */
.hud{display:flex;align-items:center;gap:0;margin-bottom:10px;border-block:1px solid var(--line);padding:8px 0}.hud-item{padding:0 20px;border-right:1px solid var(--line);font-size:.77rem;color:var(--muted);white-space:nowrap}.hud-item:first-child{padding-left:0}.hud-item:last-child{border:0}.hud-item strong{color:var(--ink);font-size:.91rem;margin-left:8px;font-variant-numeric:tabular-nums}.hud-item .arrow{font-size:.72rem;color:var(--accent);margin-left:5px}.hud-item .arrow[data-direction="down"]{color:var(--gold)}.hud-label{letter-spacing:.06em;font-size:.66rem;font-weight:750}.ticker-year{color:var(--accent)!important}.hud-changing{animation:ticker-flash .65s ease-out}@keyframes ticker-flash{from{background:#397b81}to{background:transparent}}
/* 5. DECISION UI */
.decision{padding:14px 0 0}.decision-heading{display:flex;align-items:baseline;gap:13px;margin:0 0 10px}.decision-heading h2{font-size:1.07rem;line-height:1.35;margin:0}.decision-heading .type{font-size:.64rem;letter-spacing:.11em;color:var(--accent);font-weight:800;text-transform:uppercase;white-space:nowrap}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{display:flex;align-items:start;gap:12px;text-align:left;border:1px solid #6a95b2;border-radius:10px;padding:13px;background:linear-gradient(130deg,#16466f,#10375f);color:var(--ink);min-height:83px;transition:background .15s,border-color .15s}.choice:hover:not(:disabled){background:#21587c;border-color:var(--accent)}.choice:disabled{opacity:.6}.choice-key{display:grid;place-items:center;flex-shrink:0;width:26px;height:26px;border:1px solid var(--accent);border-radius:7px;color:var(--accent);font-size:.74rem;font-weight:800}.choice strong{display:block;font-size:.88rem;margin-bottom:4px}.choice .detail{display:block;color:var(--muted);font-size:.76rem;line-height:1.4}.decision-watching{font-size:.9rem;color:var(--accent);margin:14px 0 0}.outcome{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px;margin-top:12px}.outcome h2{margin:3px 0 6px;font-size:1.45rem}.outcome p{margin:0;line-height:1.5;color:var(--muted);font-size:.86rem}.eyebrow{font-size:.66rem;font-weight:850;color:var(--accent);letter-spacing:.13em;text-transform:uppercase}
/* 6. CONSEQUENCE CALLOUTS */
.callouts{position:absolute;left:14px;right:14px;top:58px;display:flex;justify-content:center;align-items:stretch;gap:8px;pointer-events:none}.callout{max-width:300px;flex:1;background:#f5fbf0f2;border:1px solid #4f7580;border-left:4px solid #287475;border-radius:8px;padding:9px 11px;color:#173b4c;box-shadow:0 3px 9px #193c4830;animation:notice .4s both}.callout strong{display:block;font-size:.66rem;letter-spacing:.055em;margin-bottom:3px}.callout p{font-size:.72rem;line-height:1.35;margin:0}.callout.earlier{background:#fff1cceF;border-left-color:#986321}.callout:nth-child(2){animation-delay:.2s}.callout:nth-child(3){animation-delay:.4s}.callout:nth-child(4){animation-delay:.6s}@keyframes notice{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
/* 7. FINAL REPORT */
.report{border-top:1px solid var(--line);padding-top:24px;margin-top:25px}.report-intro{max-width:780px;color:var(--muted);font-size:.9rem;line-height:1.6}.report h2{font-size:1.5rem;margin-bottom:10px}.report h3{font-size:1.16rem;margin:24px 0 13px}.story{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.story li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.story-year{font-size:.68rem;letter-spacing:.1em;font-weight:850;color:var(--accent);display:block;margin-bottom:5px}.story strong{font-size:.91rem;display:block;margin-bottom:6px}.story p{font-size:.81rem;line-height:1.5;color:var(--muted);margin:0}.concepts{display:grid;grid-template-columns:1fr 1fr;gap:11px}.concepts article{padding:13px 15px;border-left:3px solid var(--accent);background:#10375f;border-radius:0 7px 7px 0}.concepts h4{font-size:.9rem;margin:0 0 6px}.concepts p{font-size:.85rem;line-height:1.5;color:var(--muted);margin:0}.transfer{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.transfer h3{margin-top:0}.transfer p{line-height:1.5}.transfer-options{display:flex;gap:9px}.transfer-options button{flex:1;text-align:left;font-size:.84rem}.transfer-feedback{border-left:3px solid var(--accent);padding-left:13px;margin-top:16px;color:var(--ink)}.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.model-note{font-size:.75rem;line-height:1.5;color:var(--muted);margin:17px 0 0}
/* 8. AD-AS REVEAL */
.model{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px;background:#10375f}.model h3{margin:0 0 10px}.model p{font-size:.88rem;line-height:1.5}.model-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}.graph{display:block;width:100%;background:#f5f9fc;border-radius:9px;color:#12344b}.model-controls{display:flex;gap:5px;flex-wrap:wrap;margin:13px 0}.model-controls button{min-width:52px;padding:8px}.model-controls button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:800}.graph-caption{color:var(--muted)}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:.75rem;margin-top:9px}.graph-stat{font-size:.88rem;color:var(--muted);line-height:1.7}.legend span::before{content:'';display:inline-block;width:18px;border-top:3px solid var(--accent);margin-right:6px;vertical-align:middle}.legend span:nth-child(2)::before{border-top-color:#ffb990}.legend span:nth-child(3)::before{border-top-style:dashed;border-top-color:#dac6ff}
/* 19. ACCESSIBILITY */
@media(max-width:1050px){.shell{padding:12px 15px 25px}.title-row p{display:none}.hud-item{padding:0 13px}.callout{padding:8px;max-width:none}.callout p{font-size:.68rem}.world-svg{min-width:950px}.world-window{overflow-x:auto}.world-topline{right:12px}.pan-hint{display:block}.world-shell{background:#c9ebed}.story{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.title-row{display:block}.title-row h1{margin:3px 0 12px}.timeline{justify-content:space-between}.timeline li{flex:1;text-align:center;padding:6px 1px;font-size:.65rem}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 0}.hud-item{padding:0 4px;border:0;white-space:normal}.hud-item:first-child{display:none}.hud-item strong{display:block;margin:3px 0 0;font-size:.83rem}.hud-label{font-size:.56rem;letter-spacing:.03em}.hud-item .arrow{font-size:.66rem}.world-svg{width:960px;min-width:960px}.world-topline{top:8px;left:9px;right:9px}.city-name{font-size:.62rem;padding:8px}.motion-control{font-size:.67rem;padding:7px}.callouts{position:relative;inset:auto;display:grid;grid-template-columns:1fr 1fr;padding:8px;gap:6px;background:#c9ebed}.callout{box-shadow:none;margin:0;max-width:none}.callout strong{font-size:.61rem}.callout p{font-size:.69rem}.options{grid-template-columns:1fr}.choice{min-height:68px;padding:11px}.decision-heading{display:block}.decision-heading .type{display:block;margin-bottom:5px}.decision-heading h2{font-size:1.02rem}.outcome{display:block}.outcome button{margin-top:12px}.story,.concepts,.model-grid{grid-template-columns:1fr}.transfer-options{flex-direction:column}.model{padding:13px}.version{font-size:.56rem}.brand{font-size:.76rem}.report{padding-top:20px}.graph-stat{font-size:.82rem}.graph text{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead"><div class="brand">MASTERY <span>QUESTS</span></div><span class="version">Version 2 · Prototype</span></header>
  <main>
    <div class="title-row"><h1>The Long Run</h1><p>Set events in motion. Watch the city remember.</p><ol id="timeline" class="timeline" aria-label="Six-year economic history"></ol></div>
    <div id="hud" class="hud" aria-label="Current economic indicators"></div>
    <section class="world-shell" id="world-shell" aria-label="The living economy">
      <div class="world-window" tabindex="0" aria-label="City view. On smaller screens, scroll horizontally to explore every district."><div class="city-surface"><svg id="world" class="world-svg" viewBox="0 0 1440 620" role="img" aria-labelledby="world-title world-description"></svg><canvas id="pixel-world" class="pixel-world" width="480" height="207" aria-hidden="true"></canvas></div></div>
      <div class="world-topline"><span class="city-name">COMMON GROUND · <span id="city-year">YEAR 1</span></span><button class="motion-control" id="motion" type="button" aria-pressed="false">Pause city motion</button></div>
      <div id="callouts" class="callouts" aria-label="Changes across the city"></div>
      <div id="time-passage" class="time-passage" hidden aria-hidden="true">TIME PASSES…</div>
    </section>
    <p class="pan-hint">Explore the city by swiping sideways, or focus the city view and use the arrow keys.</p>
    <p id="city-caption" class="city-caption"></p>
    <section id="decision" class="decision" aria-labelledby="decision-title"></section>
    <section id="report" class="report" hidden aria-labelledby="report-title"></section>
    <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
</div>
<script>
'use strict';
/* 9. GAME DATA — five decisions, then the Year 6 outcome. */
const YEARS=[
  {type:'Economic development',prompt:'The economy is stable. What happens next?',options:[
    {id:'confidence',title:'Consumer confidence surges',description:'Households feel optimistic about future income and spend more.',engine:'shock'},
    {id:'energy',title:'Energy supplies are disrupted',description:'Fuel and production costs climb across the economy.',engine:'shock'},
    {id:'breakthrough',title:'A productivity breakthrough',description:'New technology helps firms produce more with existing resources.',engine:'shock'}]},
  {type:'Fiscal response',prompt:'Policymakers are watching the change. What happens next?',options:[
    {id:'fiscal-expand',title:'Expansionary fiscal policy',description:'Increase government purchases and public projects.',engine:'fiscal'},
    {id:'fiscal-contract',title:'Contractionary fiscal policy',description:'Reduce government spending and demand.',engine:'fiscal'},
    {id:'fiscal-hold',title:'No fiscal change',description:'Let the economy continue adjusting without a new spending policy.',engine:'fiscal'}]},
  {type:'Monetary response',prompt:'The central bank responds.',options:[
    {id:'rate-cut',title:'Lower interest rates',description:'Make borrowing cheaper for households and businesses.',engine:'monetary'},
    {id:'rate-hike',title:'Raise interest rates',description:'Make new borrowing more expensive.',engine:'monetary'},
    {id:'rate-hold',title:'Hold rates steady',description:'Keep the current rate while earlier choices work through the city.',engine:'monetary'}]},
  {type:'Another economic development',prompt:'A new development arrives in the economy you created.',options:[
    {id:'housing-boom',title:'A housing and investment boom',description:'Developers and businesses plan a new wave of projects.',engine:'shock'},
    {id:'commodities',title:'Global commodity prices surge',description:'Materials and energy become more expensive for local firms.',engine:'shock'},
    {id:'infrastructure',title:'Infrastructure and technology improve',description:'Firms adapt to better transport links and new equipment.',engine:'shock'}]},
  {type:'Policy tradeoff',prompt:'',options:[
    {id:'support',title:'Support output and employment',description:'Add spending support and ease borrowing conditions.',engine:'strategy'},
    {id:'control',title:'Prioritize inflation control',description:'Restrain demand with less spending and tighter credit.',engine:'strategy'},
    {id:'adjust',title:'Allow adjustment',description:'Avoid a new demand policy while costs and capacity adjust.',engine:'strategy'}]}
];
const START={realGDP:100,potentialGDP:100,priceLevel:100,inflation:2.2,unemployment:4.5,interestRate:4,aggregateDemand:100,shortRunAggregateSupply:100,longRunCapacity:100,consumerConfidence:50,businessInvestment:50,governmentDemand:50,productivity:50,budgetPressure:0,supplyShift:0,wagePressure:0};
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const round=value=>Math.round(value*10)/10;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=selector=>document.querySelector(selector);
const percent=value=>`${value.toFixed(1)}%`;
const money=value=>'$'+value.toFixed(2);
const selectedOption=(year,id)=>YEARS[year-1]?.options.find(item=>item.id===id);

/* 10. ECONOMY STATE — the city and graph both read this same state. */
function initialEconomy(){return {year:1,...START,adIntercept:200,srasIntercept:0,phase:'choice',history:[],activeEffects:[],flags:{},latestEvents:[],previous:null};}
let economy=initialEconomy();
let motionPaused=false,transitionToken=0,graphYear=1;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function snapshot(){const {history,activeEffects,latestEvents,previous,...values}=economy;return {...values,flags:{...economy.flags}};}
function recordYear(events=[]){economy.history.push({year:economy.year,state:snapshot(),choice:null,events:events.map(event=>({...event}))});}
recordYear();

/* 11. SHOCK ENGINE — effects are increments to persistent economic stocks. */
const SHOCKS={
  confidence:{flag:'demandShock',effects:[
    {lag:1,years:1,delta:{aggregateDemand:12,consumerConfidence:18,businessInvestment:6},title:'BUSIER STREETS',text:'Household spending brings more shoppers and longer shifts.'},
    {lag:2,years:1,delta:{aggregateDemand:3},title:'EARLIER DECISION RETURNS',text:'Year 1 optimism is still lifting household spending.'}]},
  energy:{flag:'supplyShock',effects:[
    {lag:1,years:1,delta:{supplyShift:-13,consumerConfidence:-7,businessInvestment:-5},title:'ENERGY SQUEEZE',text:'Higher fuel costs raise prices while factories cut output.'},
    {lag:2,years:2,delta:{supplyShift:1.5},title:'SUPPLY ADJUSTS',text:'Firms gradually find alternatives to the Year 1 energy disruption.'}]},
  breakthrough:{flag:'productivityDevelopment',effects:[
    {lag:1,years:1,delta:{supplyShift:7,productivity:10,businessInvestment:10},title:'NEW EQUIPMENT',text:'Upgraded machinery produces more with the same resources.'},
    {lag:2,years:2,delta:{longRunCapacity:3,productivity:2},title:'EARLIER DECISION RETURNS',text:'The Year 1 technology is now expanding productive capacity.'}]},
  'housing-boom':{flag:'investmentBoom',effects:[
    {lag:1,years:1,delta:{aggregateDemand:11,businessInvestment:16,consumerConfidence:5},title:'PROJECT PIPELINE',text:'New property and business plans bring orders to the city.'}]},
  commodities:{flag:'supplyShock',effects:[
    {lag:1,years:1,delta:{supplyShift:-12,businessInvestment:-5},title:'COSTS CLIMB',text:'Materials and fuel cost more; production and shopping slow.'},
    {lag:2,years:1,delta:{supplyShift:2},title:'EARLIER DECISION RETURNS',text:'The Year 4 cost surge still affects production as supply adjusts.'}]},
  infrastructure:{flag:'productivityDevelopment',effects:[
    {lag:1,years:1,delta:{supplyShift:4,productivity:8,businessInvestment:10,budgetPressure:8},title:'CITY UPGRADES',text:'New connections and equipment improve production, with an upfront public cost.'},
    {lag:1,years:2,delta:{longRunCapacity:3.5,productivity:2},title:'EARLIER DECISION RETURNS',text:'The Year 4 infrastructure investment is expanding productive capacity.'}]}
};
function applyShock(id){const spec=SHOCKS[id];economy.flags[spec.flag]=true;let scale=1;if(id==='housing-boom')scale=clamp(1-(economy.interestRate-4)*.14,.35,1.35);for(const item of spec.effects){const effect=structuredClone(item);if(id==='housing-boom'){for(const key of Object.keys(effect.delta))effect.delta[key]*=scale;effect.text=scale<.85?'High borrowing costs limit the new housing and investment boom.':scale>1.1?'Cheap borrowing amplifies the new housing and investment boom.':effect.text;}queueEffect(id,effect);} }

/* 12. FISCAL POLICY ENGINE */
const FISCAL={
  'fiscal-expand':{flag:'fiscalExpansion',effects:[
    {lag:1,years:1,delta:{aggregateDemand:8,governmentDemand:13,budgetPressure:15,businessInvestment:3},title:'PUBLIC PROJECTS',text:'Government orders support jobs and add demand to current conditions.'},
    {lag:2,years:1,delta:{aggregateDemand:3},title:'EARLIER DECISION RETURNS',text:'Your Year 2 spending increase is still supporting demand.'},
    {lag:2,years:1,delta:{interestRate:.45,businessInvestment:-5},title:'FINANCING PRESSURE',text:'Year 2 borrowing adds budget pressure and crowds out some private projects.'}]},
  'fiscal-contract':{flag:'fiscalContraction',effects:[
    {lag:1,years:1,delta:{aggregateDemand:-7,governmentDemand:-12,budgetPressure:-8},title:'FEWER PUBLIC ORDERS',text:'Reduced public spending eases demand and leaves fewer orders for firms.'},
    {lag:2,years:1,delta:{aggregateDemand:-2},title:'EARLIER DECISION RETURNS',text:'The Year 2 spending reduction is still holding back demand.'}]},
  'fiscal-hold':{flag:'fiscalHold',effects:[]}
};
function applyFiscalPolicy(id){const spec=FISCAL[id];economy.flags[spec.flag]=true;for(const item of spec.effects)queueEffect(id,item);}

/* 13. MONETARY POLICY ENGINE — the rate signal changes now; spending follows later. */
const MONETARY={
  'rate-cut':{rate:-1.75,flag:'monetaryEasing',effects:[
    {lag:1,years:1,delta:{aggregateDemand:6,businessInvestment:12},title:'CREDIT REACHES THE CITY',text:'Lower rates bring more private projects and financed purchases.'},
    {lag:2,years:1,delta:{aggregateDemand:3,businessInvestment:4},title:'EARLIER DECISION RETURNS',text:'The Year 3 rate cut is still feeding investment and spending.'}]},
  'rate-hike':{rate:1.75,flag:'monetaryTightening',effects:[
    {lag:1,years:1,delta:{aggregateDemand:-7,businessInvestment:-13},title:'PROJECT DELAYED',text:'Higher rates are now slowing private construction and purchases.'},
    {lag:2,years:1,delta:{aggregateDemand:-4,businessInvestment:-4},title:'EARLIER DECISION RETURNS',text:'The Year 3 rate hike continues restraining demand and price pressure.'}]},
  'rate-hold':{rate:0,flag:'monetaryHold',effects:[]}
};
function applyMonetaryPolicy(id){const spec=MONETARY[id];economy.interestRate=clamp(economy.interestRate+spec.rate,.5,12);economy.flags[spec.flag]=true;for(const item of spec.effects)queueEffect(id,item);}
function applyStrategy(id){economy.flags[id]=true;if(id==='support'){economy.interestRate=clamp(economy.interestRate-.5,.5,12);queueEffect(id,{lag:1,years:1,delta:{aggregateDemand:8,businessInvestment:5,governmentDemand:6,budgetPressure:8},title:'EMPLOYMENT SUPPORT',text:'Spending support restores orders, with more pressure on prices and the budget.'});}if(id==='control'){economy.interestRate=clamp(economy.interestRate+.75,.5,12);queueEffect(id,{lag:1,years:1,delta:{aggregateDemand:-7,businessInvestment:-6,governmentDemand:-4,budgetPressure:-5},title:'DEMAND COOLS',text:'Restrained spending eases price pressure but costs the city some activity.'});}}
const ENGINES={shock:applyShock,fiscal:applyFiscalPolicy,monetary:applyMonetaryPolicy,strategy:applyStrategy};

/* 14. DELAYED EFFECTS — source year, lag and duration survive screen changes. */
function queueEffect(id,spec){economy.activeEffects.push({id,sourceYear:economy.year,lag:spec.lag,remainingYears:spec.years,delta:{...spec.delta},title:spec.title,text:spec.text});}
function applyDeltas(delta){for(const [key,value] of Object.entries(delta))economy[key]+=value;economy.interestRate=clamp(economy.interestRate,.5,12);economy.budgetPressure=clamp(economy.budgetPressure,0,70);for(const key of ['consumerConfidence','businessInvestment','governmentDemand','productivity'])economy[key]=clamp(economy[key],10,95);}
function applyLaggedEffects(){const events=[];for(const effect of economy.activeEffects){effect.lag--;if(effect.lag>0)continue;applyDeltas(effect.delta);effect.remainingYears--;events.push({title:effect.title,text:effect.text,sourceYear:effect.sourceYear,delayed:economy.year-effect.sourceYear>=2,id:effect.id});}economy.activeEffects=economy.activeEffects.filter(effect=>effect.remainingYears>0);economy.latestEvents=events;return events;}
function applyLongRunAdjustment(){
  const oldCapacity=economy.longRunCapacity;
  // Previous investment becomes capacity gradually, not on the day a project is announced.
  economy.longRunCapacity+=Math.max(0,economy.businessInvestment-50)*.028;
  economy.aggregateDemand+=(oldCapacity-economy.aggregateDemand)*.09;
  economy.supplyShift*=.76;
  const gap=economy.realGDP-economy.potentialGDP;
  economy.wagePressure=clamp(economy.wagePressure*.85+gap*.4,-12,16);
  for(const key of ['consumerConfidence','businessInvestment','governmentDemand'])economy[key]+=(50-economy[key])*.13;
}

/* 15. MACRO CALCULATION — one simplified AD–AS intersection drives world and reveal.
   At price P and output Y: AD P = a − Y; SRAS P = b + Y; LRAS Y = capacity.
   Baseline nominal prices trend at 2.2%; inflation is the actual yearly price-level change.
   The numbers illustrate tendencies, not empirical forecasts. */
function calculateMacroOutcomes(){const previousPrice=economy.previous?.priceLevel||100;const trend=100*Math.pow(1.022,economy.year-1);economy.potentialGDP=economy.longRunCapacity;economy.shortRunAggregateSupply=economy.longRunCapacity+economy.supplyShift-economy.wagePressure;economy.adIntercept=trend+economy.aggregateDemand;economy.srasIntercept=trend-economy.shortRunAggregateSupply;economy.realGDP=(economy.adIntercept-economy.srasIntercept)/2;economy.priceLevel=(economy.adIntercept+economy.srasIntercept)/2;economy.inflation=(economy.priceLevel/previousPrice-1)*100;const gap=(economy.realGDP/economy.potentialGDP-1)*100;economy.unemployment=clamp(4.5-.58*gap,2,15);}
function applyChoice(id){const choice=selectedOption(economy.year,id);if(!choice)throw new Error('Choice does not belong to this year.');economy.history.at(-1).choice={...choice};ENGINES[choice.engine](id);}
function stepEconomy(id){if(economy.year>=6)throw new Error('The six-year economy is complete.');economy.previous=snapshot();applyChoice(id);economy.year++;applyLongRunAdjustment();const events=applyLaggedEffects();calculateMacroOutcomes();recordYear(events);return events;}

function contextualPrompt(){if(economy.inflation>=4&&economy.unemployment>=6)return 'Weak output and persistent inflation are squeezing the city. Which pressure comes first?';if(economy.inflation>=4)return 'Prices are climbing faster than policymakers want. What happens next?';if(economy.unemployment>=6)return 'Job losses are becoming the dominant concern. What happens next?';if(economy.realGDP>economy.potentialGDP+2)return 'The city is busy, but capacity is stretched. How should policy respond?';return 'The city has room to grow. Which course should policymakers take?';}
function renderDecision(){if(economy.year===6){renderOutcome();return;}const year=YEARS[economy.year-1];$('#decision').innerHTML=`<div class="decision-heading"><span class="type">${year.type}</span><h2 id="decision-title" tabindex="-1">${economy.year===5?contextualPrompt():year.prompt}</h2></div><div class="options">${year.options.map((option,i)=>`<button type="button" class="choice" data-choice="${option.id}" ${economy.phase!=='choice'?'disabled':''}><span class="choice-key" aria-hidden="true">${'ABC'[i]}</span><span><strong>${option.title}</strong><span class="detail">${option.description}</span></span></button>`).join('')}</div>`;}
function renderConsequences(events){const previous=economy.previous;if(!previous){$('#callouts').innerHTML='';return;}const candidates=[];const late=events.filter(event=>event.delayed).sort((a,b)=>b.sourceYear-a.sourceYear)[0];if(late)candidates.push({title:'EARLIER DECISION RETURNS',text:late.text,earlier:true});const fresh=events.find(event=>!event.delayed);if(fresh)candidates.push(fresh);const output=economy.realGDP-previous.realGDP;if(Math.abs(output)>.4)candidates.push({title:output>0?'PRODUCTION PICKS UP':economy.unemployment>previous.unemployment+.1?'FEWER SHIFTS':'OUTPUT EASES',text:output>0?'More orders and output move through the factory.':economy.unemployment>previous.unemployment+.1?'Firms cut back production; fewer workers clock in.':'Production eases from last year while employment remains strong.'});const inflationChange=economy.inflation-previous.inflation;if(economy.inflation>=4)candidates.push({title:'PRICE PRESSURE',text:'Fuel and grocery signs rise. Household pay stretches less far.'});else if(inflationChange<-.6)candidates.push({title:'PRICE PRESSURE EASES',text:economy.inflation>=0?'Prices are rising more slowly; earlier price increases remain.':'Some prices are falling as demand and costs adjust.'});if(candidates.length<3)candidates.push({title:'THE CITY ADJUSTS',text:'Existing projects and earlier commitments continue to shape activity.'});$('#callouts').innerHTML=candidates.slice(0,4).map(item=>`<div class="callout ${item.earlier?'earlier':''}"><strong>${esc(item.title)}</strong><p>${esc(item.text)}</p></div>`).join('');}
function render(){renderTimeline();renderIndicators();renderWorld();renderDecision();}

/* 17. YEAR ADVANCEMENT — lock, advance the economy, reveal the world, then invite a choice. */
async function advanceTime(id){if(economy.phase!=='choice'||economy.year>=6)return;economy.phase='passing';const token=++transitionToken;$('#decision').querySelectorAll('button').forEach(button=>button.disabled=true);$('#time-passage').hidden=false;$('#world-shell').scrollIntoView({block:'start',behavior:'auto'});$('#announcement').textContent='Time passes. Watch the city respond.';await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:420));if(token!==transitionToken)return;const events=stepEconomy(id);economy.phase='watching';$('#time-passage').hidden=true;$('#world-shell').classList.add('changing');render();renderConsequences(events);$('#announcement').textContent=`Year ${economy.year}. Real GDP ${economy.realGDP.toFixed(1)}. Inflation ${percent(economy.inflation)}. Unemployment ${percent(economy.unemployment)}. ${events.find(event=>event.delayed)?.text||events[0]?.text||'The economy continues adjusting.'}`;await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:1100));if(token!==transitionToken)return;$('#world-shell').classList.remove('changing');economy.phase=economy.year===6?'finished':'choice';renderDecision();if(economy.year===6){$('#world-shell').classList.add('finished');$('#motion').hidden=true;renderFinalReport();$('#decision-title').focus({preventScroll:true});}else $('#decision-title').focus({preventScroll:true});}

/* 18. ENDING ANALYSIS — profiles describe tradeoffs, with no ranking. */
const PROFILES=[
  {name:'Stagflation Pressure',test:s=>s.unemployment>=6&&s.inflation>=3.5,description:'Costs and weak activity are pulling the city in different directions. Shops face fewer customers while households still face rising prices.'},
  {name:'Overheated Economy',test:s=>s.realGDP>s.potentialGDP+1.5&&s.inflation>=3.5,description:'Demand keeps the city busy, but production is stretched and prices are still under pressure.'},
  {name:'Stalled Economy',test:s=>s.unemployment>=6,description:'Weak orders leave spare capacity, idle workers and unfinished plans. Slower price growth comes with an employment cost.'},
  {name:'Productivity-Led Growth',test:s=>s.longRunCapacity>=108&&s.realGDP>=104&&s.inflation<3.5,description:'Technology and investment expanded what the city can produce. More capacity supports output while easing price pressure.'},
  {name:'Policy-Driven Recovery',test:s=>s.flags.support&&Math.min(...s.history.map(item=>item.state.realGDP))<99&&s.realGDP>Math.min(...s.history.map(item=>item.state.realGDP))+3,description:'Demand support helped restore activity after weakness. The city also carries the budget and price consequences of that response.'},
  {name:'Fragile Recovery',test:s=>s.budgetPressure>=20||s.unemployment>5.3||s.inflation>3,description:'Activity is recovering or holding up, but financing pressure, unused capacity or prices leave the city exposed.'},
  {name:'Balanced Expansion',test:()=>true,description:'Output and capacity are reasonably close, with employment holding up and limited current price pressure. The path still involved tradeoffs.'}
];
function endingProfile(){return PROFILES.find(profile=>profile.test(economy));}
function renderOutcome(){const profile=endingProfile();$('#decision').innerHTML=`<div class="outcome"><div><span class="eyebrow">Year 6 · Your living economy</span><h2 id="decision-title" tabindex="-1">${profile.name}</h2><p>${profile.description}</p></div><button class="primary" id="read-story" type="button" ${economy.phase!=='finished'?'disabled':''}>Read your economic history</button></div>`;}
function economicExplanations(){const f=economy.flags,items=[];if(f.demandShock||f.investmentBoom)items.push(['Demand shocks','Optimism or investment plans increased aggregate demand. More spending initially raised output and employment, with more pressure on prices when capacity was stretched.']);if(f.supplyShock)items.push(['Short-run aggregate supply','Higher energy or commodity costs shifted SRAS left. The city could produce less at each price level, combining weaker output with higher prices.']);if(f.fiscalExpansion){const start=economy.history[1].state;items.push(['Fiscal expansion and crowding out',`Public purchases added demand to an economy with ${percent(start.unemployment)} unemployment and ${percent(start.inflation)} inflation. Jobs received support, while budget pressure rose. Later financing pressure restrained some private investment.`]);}if(f.fiscalContraction)items.push(['Fiscal contraction','Reduced government purchases shifted aggregate demand left. That eased price pressure but also removed orders and employment from businesses.']);if(f.monetaryEasing||f.monetaryTightening)items.push(['Monetary policy and lags',f.monetaryTightening?'The Year 3 rate increase made finance more expensive. Private construction weakened in Year 4, and demand continued cooling in Year 5.':'The Year 3 rate cut reduced borrowing costs. Investment and demand increased over Years 4–5, rather than appearing all at once.']);if(f.productivityDevelopment)items.push(['Productivity and long-run supply','Improved technology or infrastructure moved SRAS right, then increased long-run capacity. The upgraded factory was the visible counterpart of a rightward LRAS shift.']);if(f.support||f.control)items.push(['Stabilization tradeoffs',f.support?'The final demand support favored output and employment. Extra spending also added inflation and budget pressure relative to allowing adjustment.':'The final policy restrained demand to slow inflation. Lower orders also reduced output and employment relative to allowing adjustment.']);items.push(['Long-run adjustment','Earlier investment gradually became productive capacity. Costs and wages adjusted to the gap between actual and potential output, so earlier shocks continued changing the city even without a new policy.']);return items;}
function transferQuestion(){if(economy.flags.supplyShock)return {prompt:'Another economy sees unemployment and inflation rise after an energy shortage. Which change best explains both outcomes?',answers:['Aggregate demand increased','Short-run aggregate supply decreased','Long-run aggregate supply increased'],target:1,explanation:'The energy shortage raises production costs. SRAS shifts left: less output and employment, alongside a higher price level. A demand boom would usually lift output rather than reduce it.'};if(economy.flags.monetaryTightening||economy.flags.monetaryEasing)return {prompt:'A central bank raises interest rates today. Construction plans weaken next year. Which connection explains the delay?',answers:['Borrowing costs change spending plans over time','Higher rates instantly create new factories','Investment is independent of borrowing costs'],target:0,explanation:'Firms reassess financing, orders and project plans over time. Higher rates tend to weaken interest-sensitive investment and aggregate demand with a lag.'};if(economy.flags.productivityDevelopment)return {prompt:'New equipment lets firms produce more with the same resources. Which change can support higher sustainable output?',answers:['A permanent reduction in productive capacity','A rise in long-run aggregate supply','A fall in productivity'],target:1,explanation:'Higher productivity expands productive capacity. LRAS moves right, allowing more sustainable output; short-run supply can improve as production costs fall.'};return {prompt:'Households become more optimistic and spend more while factories are already busy. What pressure is likely to accompany higher output?',answers:['Price pressure from stronger aggregate demand','An automatic fall in every price','A permanent loss of productive capacity'],target:0,explanation:'Stronger aggregate demand tends to raise output in the short run. Near capacity, additional spending also creates more upward pressure on prices.'};}
function renderFinalReport(){const report=$('#report'),profile=endingProfile(),transfer=transferQuestion();report.hidden=false;report.innerHTML=`<h2 id="report-title" tabindex="-1">The economy remembers</h2><p class="report-intro">You shaped five developments and responses across six years. The city is now frozen at its Year 6 outcome: <strong>${profile.name}</strong>. These are descriptive conditions, not a ranking.</p><h3>What happened?</h3><ol class="story">${economy.history.map(entry=>`<li><span class="story-year">YEAR ${entry.year}</span><strong>${esc(entry.choice?.title||profile.name)}</strong><p>${entry.year===1?'The city began near potential output.':esc(entry.events.find(event=>event.delayed)?.text||entry.events[0]?.text||'Costs, spending and capacity continued adjusting.')} GDP ${entry.state.realGDP.toFixed(1)} · inflation ${percent(entry.state.inflation)} · unemployment ${percent(entry.state.unemployment)}.</p></li>`).join('')}</ol><h3>Why did it happen economically?</h3><div class="concepts">${economicExplanations().map(([title,text])=>`<article><h4>${title}</h4><p>${esc(text)}</p></article>`).join('')}</div><section class="transfer"><h3>Can you use it somewhere else?</h3><p>${transfer.prompt}</p><div class="transfer-options">${transfer.answers.map((text,i)=>`<button class="secondary" type="button" data-transfer="${i}">${text}</button>`).join('')}</div><p id="transfer-feedback" class="transfer-feedback" tabindex="-1" hidden></p></section><div class="end-actions"><button class="primary" id="model-toggle" type="button" aria-expanded="false" aria-controls="model">See the model behind your economy</button><button class="secondary" id="restart" type="button">Restart Simulation</button></div><section id="model" class="model" hidden aria-labelledby="model-title"><h3 id="model-title">Your city, through AD–AS</h3><p>You first saw these changes through jobs, prices, production, investment, and household conditions. The AD–AS model represents those same changes at the aggregate level.</p><div class="model-controls" aria-label="Select a year in the model">${economy.history.map(entry=>`<button type="button" class="secondary" data-graph-year="${entry.year}" aria-pressed="${entry.year===1}">Year ${entry.year}</button>`).join('')}</div><div class="model-grid"><div><svg id="graph" class="graph" viewBox="0 0 640 405" role="img" aria-labelledby="graph-title graph-description"></svg><div class="legend"><span>AD · solid</span><span>SRAS · solid</span><span>LRAS · dashed</span></div></div><div id="graph-explanation"></div></div></section><p class="model-note">This deterministic teaching model illustrates introductory relationships. Its indices and rates are not forecasts. Inflation is the yearly change in the price level; the graph shows the cumulative price level.</p>`;}

/* 8. AD-AS REVEAL — actual stored intercepts, capacity and equilibrium for every year. */
function renderGraph(year){graphYear=year;const entry=economy.history[year-1],s=entry.state,previous=economy.history[year-2]?.state;const all=economy.history.map(item=>item.state);const minX=Math.floor((Math.min(...all.map(item=>Math.min(item.realGDP,item.potentialGDP)))-13)/5)*5,maxX=Math.ceil((Math.max(...all.map(item=>Math.max(item.realGDP,item.potentialGDP)))+13)/5)*5;const minP=Math.floor((Math.min(...all.map(item=>item.priceLevel))-19)/5)*5,maxP=Math.ceil((Math.max(...all.map(item=>item.priceLevel))+19)/5)*5;const x=value=>78+(value-minX)/(maxX-minX)*486,y=value=>328-(value-minP)/(maxP-minP)*270;let ticks='';for(let i=0;i<=4;i++){const q=minX+(maxX-minX)*i/4,p=minP+(maxP-minP)*i/4;ticks+=`<path d="M${x(q)} 58V328M78 ${y(p)}H564" stroke="#d4e0e7" stroke-width="1"/><text x="${x(q)}" y="350" text-anchor="middle">${q.toFixed(0)}</text><text x="65" y="${y(p)+4}" text-anchor="end">${p.toFixed(0)}</text>`;}
  const graphDescription=`Year ${year}. Equilibrium output ${s.realGDP.toFixed(1)}, price level ${s.priceLevel.toFixed(1)}, long-run capacity ${s.potentialGDP.toFixed(1)}. Curves come from the same calculation that produced the city.`;
  $('#graph').innerHTML=`<title id="graph-title">Year ${year} AD–AS model</title><desc id="graph-description">${graphDescription}</desc><defs><clipPath id="plot-clip"><rect x="78" y="58" width="486" height="270"/></clipPath></defs><g fill="#26485e" font-family="system-ui,sans-serif" font-size="13">${ticks}<text x="25" y="36" font-size="15" font-weight="700">Price level</text><text x="477" y="389" font-size="15" font-weight="700">Real output</text><g clip-path="url(#plot-clip)"><path d="M${x(minX)} ${y(s.adIntercept-minX)}L${x(maxX)} ${y(s.adIntercept-maxX)}" stroke="#176e83" stroke-width="4"/><path d="M${x(minX)} ${y(s.srasIntercept+minX)}L${x(maxX)} ${y(s.srasIntercept+maxX)}" stroke="#b55838" stroke-width="4"/><path d="M${x(s.potentialGDP)} 58V328" stroke="#74519b" stroke-width="3" stroke-dasharray="9 6"/><path d="M78 ${y(s.priceLevel)}H${x(s.realGDP)}V328" stroke="#415d70" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/></g><path d="M78 48V328H580" stroke="#28495e" stroke-width="2" fill="none"/><circle cx="${x(s.realGDP)}" cy="${y(s.priceLevel)}" r="6" fill="#173e56" stroke="white" stroke-width="2"/><text x="${x(s.potentialGDP)}" y="46" text-anchor="middle" fill="#654685" font-weight="800">LRAS</text><text x="481" y="${clamp(y(s.adIntercept-(minX+(maxX-minX)*.82))+20,78,316)}" fill="#176e83" font-weight="800">AD</text><text x="481" y="${clamp(y(s.srasIntercept+minX+(maxX-minX)*.82)-12,78,300)}" fill="#a64f32" font-weight="800">SRAS</text></g>`;
  const direction=(delta,right,left)=>Math.abs(delta)<.08?'stayed near its previous position':`${delta>0?right:left}`;const shifts=previous?`AD ${direction(s.adIntercept-previous.adIntercept,'moved right','moved left')}. SRAS ${direction(s.srasIntercept-previous.srasIntercept,'moved left','moved right')}. LRAS ${direction(s.potentialGDP-previous.potentialGDP,'moved right','moved left')}.`:'The economy begins where output equals potential output.';
  $('#graph-explanation').innerHTML=`<span class="eyebrow">Year ${year}</span><h3>${year===1?'The starting economy':'What reached the city this year'}</h3><p>${esc(shifts)}</p><p class="graph-caption">${esc(entry.events.map(event=>event.text).join(' ')||'No shock has occurred yet. The initial price and output indices are both 100.')}</p><p class="graph-stat">Equilibrium output: <strong>${s.realGDP.toFixed(1)}</strong><br>Potential output: <strong>${s.potentialGDP.toFixed(1)}</strong><br>Price level: <strong>${s.priceLevel.toFixed(1)}</strong><br>Annual inflation: <strong>${percent(s.inflation)}</strong></p><p class="graph-caption">Each snapshot includes policy lags, normal price adjustment and changes in capacity. The dot is the intersection that generated that year’s output and prices.</p>`;
  document.querySelectorAll('[data-graph-year]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.graphYear)===year)));
}

/* 19. ACCESSIBILITY — native controls, focus after transitions, a quiet live region. */
function reset(){transitionToken++;economy=initialEconomy();recordYear();$('#report').hidden=true;$('#report').innerHTML='';$('#world-shell').classList.remove('finished','changing');$('#motion').hidden=false;$('#time-passage').hidden=true;$('#callouts').innerHTML='';render();window.scrollTo({top:0,behavior:'auto'});$('#decision-title').focus({preventScroll:true});$('#announcement').textContent='A new economy begins in Year 1, near potential output.';}
document.addEventListener('click',event=>{const choice=event.target.closest('[data-choice]');if(choice&&!choice.disabled){advanceTime(choice.dataset.choice);return;}const graph=event.target.closest('[data-graph-year]');if(graph){renderGraph(Number(graph.dataset.graphYear));$('#announcement').textContent=`Model reveal: Year ${graph.dataset.graphYear}. ${$('#graph-explanation').innerText}`;return;}const transfer=event.target.closest('[data-transfer]');if(transfer){const q=transferQuestion();const answer=Number(transfer.dataset.transfer),feedback=$('#transfer-feedback');feedback.hidden=false;feedback.textContent=(answer===q.target?'That mechanism fits this scenario. ':'Compare the direction of output and prices. ')+q.explanation;document.querySelectorAll('[data-transfer]').forEach(button=>{button.disabled=true;button.setAttribute('aria-pressed',String(button===transfer));});feedback.focus();$('#announcement').textContent=feedback.textContent;return;}if(event.target.id==='motion'){motionPaused=!motionPaused;$('#world-shell').classList.toggle('paused',motionPaused);event.target.setAttribute('aria-pressed',String(motionPaused));event.target.textContent=motionPaused?'Resume city motion':'Pause city motion';return;}if(event.target.id==='restart'){reset();return;}if(event.target.id==='read-story'){$('#report-title').scrollIntoView({block:'start',behavior:reducedMotion.matches?'auto':'smooth'});$('#report-title').focus();return;}if(event.target.id==='model-toggle'){const panel=$('#model'),open=panel.hidden;panel.hidden=!open;event.target.setAttribute('aria-expanded',String(open));if(open)renderGraph(graphYear);}});
render();
</script>
</body>
</html>
