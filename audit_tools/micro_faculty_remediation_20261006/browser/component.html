<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><style>
/* =========================================
   1. VISUAL DESIGN — SAFE TO EDIT

You can change:
- Colors
- Background images
- Fonts
- Glow effects

Do NOT rename IDs (#gameBox, #mazeTrack, etc.)
or you will break JavaScript connections.
========================================= */
/* =========================================
   1. VISUAL DESIGN — BLANK MASTERY QUEST
========================================= */
body {
    font-family: 'Rajdhani', Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #eef6ff;
    background: linear-gradient(135deg,#020617 0%,#0b2238 52%,#17324d 100%);
    background-size: cover;
    background-position: center;
}

/* Generic learning-game overlay */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(56,189,248,0.10),
            rgba(15,23,42,0.36) 48%,
            rgba(2,6,23,0.78) 100%);
    pointer-events:none;
    z-index:-1;
}

.dungeon-container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    margin-top: 20px;
}

/* CENTER BLOCK */
.start-content{
    width: 100%;
    max-width: 460px;
    display:flex;
    flex-direction:column;
    align-items:center;   
    text-align:center;
    padding: 28px 30px;
    border-radius: 18px;
}

/* TITLE — civic gold */
.title{
    font-size:64px;
    letter-spacing:4px;
    margin-bottom:10px;
    color:#f7d982;
    text-align:center;
    text-shadow:
        0 0 10px rgba(240,200,106,0.72),
        0 0 24px rgba(56,189,248,0.26),
        0 3px 8px rgba(0,0,0,0.92);
}

/* SUBTITLE — holographic blue */
.subtitle{
    font-size:34px;
    margin-bottom:35px;
    letter-spacing:2px;
    text-align:center;
    color:#c7ecff;
    text-shadow:
        0 0 12px rgba(56,189,248,0.42),
        0 0 26px rgba(14,165,233,0.22),
        0 2px 6px rgba(0,0,0,0.88);
}

/* TAGLINE */
.tagline{
    margin-bottom:30px;
    font-style:italic;
    opacity:0.92;
    text-align:center;
    color:#e0f2fe;
    text-shadow:
        0 0 10px rgba(56,189,248,0.22),
        0 2px 6px rgba(0,0,0,0.88);
}

/* INPUT — civic access panel */
.name-input{
    width:100%;
    max-width:320px;
    text-align:center;
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(56,189,248,0.42);   
    background: rgba(3,10,24,0.82);          
    color:#eef6ff;                             
    font-size:20px;
    margin-bottom:20px;
    outline:none;
    box-shadow:
        0 0 12px rgba(56,189,248,0.24),
        inset 0 0 12px rgba(0,0,0,0.72);
}

.name-input:focus{
    border-color: rgba(247,217,130,0.88);
    box-shadow:
        0 0 16px rgba(247,217,130,0.42),
        0 0 34px rgba(56,189,248,0.30),
        inset 0 0 12px rgba(0,0,0,0.78);
}

.start-btn{
    width:100%;
    max-width:320px;
}

.secondary-start-btn{
    margin-top: 10px;
    background: linear-gradient(180deg, #1d4d73, #04101f);
    border-color: rgba(247,217,130,0.56);
    color: #f7d982;
}

/* PLACEHOLDER */
#playerNameInput::placeholder,
#username::placeholder{
    color: rgba(224,242,254,0.55);
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
}

/* =========================================
   2. CORE GAME CONTAINER (#gameBox)
========================================= */

#gameBox {
    max-width: 750px;
    flex:1;
    min-width:0;
    width:100%;
    margin: 0;
    padding: 18px 20px;
    text-align: center;

    background:
        radial-gradient(circle at center,
            rgba(56,189,248,0.13) 0%,
            rgba(15,23,42,0.58) 46%,
            rgba(3,10,24,0.94) 74%,
            rgba(2,6,23,0.99) 100%);

    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-sizing: border-box;

    box-shadow:
        0 0 22px rgba(56,189,248,0.18),
        0 0 58px rgba(240,200,106,0.10),
        0 0 72px rgba(15,23,42,0.72),
        inset 0 0 42px rgba(0,0,0,0.78);

    border: 1px solid rgba(247,217,130,0.34);
    animation: torchFlicker 6s infinite;
    transition: box-shadow .3s ease, border-color .3s ease;
    position: relative;
}

/* Boss state styling — triggered during boss fights (DO NOT REMOVE) */
#gameBox.boss-mode {
    border: 2px solid rgba(247,217,130,0.88);
    box-shadow:
        0 0 30px rgba(247,217,130,0.42),
        0 0 62px rgba(56,189,248,0.34),
        inset 0 0 46px rgba(0,0,0,0.86);
}

.boss-icon{
    width: 28px;
    height: 28px;
    object-fit: contain;
    pointer-events: none;
}

/* Tier 1 — Checkpoint One */
.boss10 .boss-icon{
    filter:
        drop-shadow(0 0 6px rgba(56,189,248,0.88))
        drop-shadow(0 0 14px rgba(247,217,130,0.48));
}

/* Tier 2 — Checkpoint Two */
.boss20 .boss-icon{
    filter:
        drop-shadow(0 0 8px rgba(14,165,233,0.94))
        drop-shadow(0 0 18px rgba(56,189,248,0.56));
}

/* Tier 3 — Final Checkpoint */
.boss30 .boss-icon{
    filter:
        drop-shadow(0 0 10px rgba(247,217,130,0.96))
        drop-shadow(0 0 25px rgba(56,189,248,0.62));
}

/* Damage effect when boss/player is hit (visual feedback) */	
.hit {
    box-shadow:
        0 0 52px rgba(185,28,28,0.64),
        0 0 30px rgba(247,217,130,0.30),
        inset 0 0 44px rgba(2,6,23,0.90) !important;
    animation: hitshake 0.4s ease;
}

/* Autosave indicator — positioned relative to gameBox */	
#autosave {
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 11px;
    opacity: 0.58;
    font-style: italic;
    color: #c7ecff;
    text-shadow: 0 0 6px rgba(56,189,248,0.42);
}

/* Adds a graph box for questions with graphs */	
#questionImageBox{
    margin: 0 auto 12px auto;
    text-align: center;
    display: none;
}

#questionImageBox img{
    max-width: 100%;
    width: min(100%, 640px);
    max-height: 42vh;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    border: 1px solid rgba(247,217,130,0.26);
    box-shadow:
        0 0 14px rgba(56,189,248,0.22),
        0 0 30px rgba(15,23,42,0.72),
        0 0 28px rgba(0,0,0,0.74);
    cursor: zoom-in;
}

#questionImageBox .graph-zoom-note{
    margin-top: 6px;
    font-size: 12px;
    color: rgba(224,242,254,0.72);
    font-style: italic;
}

#graphLightbox{
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 26px;
    box-sizing: border-box;
    background: rgba(2,6,23,0.88);
    backdrop-filter: blur(5px);
}

#graphLightbox.active{
    display: flex;
}

#graphLightbox img{
    width: min(96vw, 1180px);
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    background: #fff;
    border: 1px solid rgba(247,217,130,0.54);
    box-shadow:
        0 0 28px rgba(56,189,248,0.34),
        0 0 70px rgba(0,0,0,0.86);
}

#graphLightboxClose{
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    z-index: 5001;
    width: 42px;
    height: 42px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    font-size: 28px;
    line-height: 38px;
    color: #fff7d6;
    background: rgba(3,10,24,0.94);
    border: 1px solid rgba(247,217,130,0.62);
    box-shadow:
        0 0 20px rgba(56,189,248,0.36),
        inset 0 0 12px rgba(0,0,0,0.78);
}

@media(max-width:768px){
    #questionImageBox img{
        width: min(100%, 520px);
        max-height: 36vh;
        object-fit: contain;
    }

    #graphLightbox{
        padding: 12px;
    }

    #graphLightbox img{
        width: 98vw;
        max-height: 86vh;
    }
}

/* =========================================
   3. TEXT & TYPOGRAPHY SYSTEM
========================================= */

h2 {
    text-shadow:
        0 0 10px rgba(229,231,235,0.22),
        0 0 22px rgba(56,189,248,0.20),
        0 2px 6px rgba(0,0,0,0.88);
    margin-bottom: 5px;
}

/* Main question text — keep readable and centered */	
#question {
    font-size: clamp(20px, 4vw, 22px);
    line-height: 1.4;
    font-weight: 600;
    margin: 14px 0;
    color: #eef6ff;
    text-shadow:
        0 2px 5px rgba(0,0,0,0.90),
        0 0 8px rgba(56,189,248,0.14);
}

/* Boss/summary title — high emphasis text */	
.boss-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
    display: block;
    color: #f7d982;
    text-shadow:
        0 0 10px rgba(247,217,130,0.68),
        0 0 28px rgba(56,189,248,0.30),
        0 3px 8px rgba(0,0,0,0.92);
}

/* Area/zone label — subtle contextual info */	
.area-title {
    color: #c7ecff;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.34),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Boss summary text — left-aligned for readability */	
.boss-q {
    font-style: normal;
    line-height: 1.5;
    font-size: 24px;
    border-left: 3px solid #f7d982;
    padding-left: 15px;
    margin: 20px 0;
    text-align: left;
    color: #eef6ff;
    box-shadow: -4px 0 12px rgba(56,189,248,0.24);
    text-shadow: 0 2px 5px rgba(0,0,0,0.88);
}

/* Optional hint display (calculation or guidance) */	
.hint-box {
    font-size: 13px;
    color: #f7d982;
    margin-top: 15px;
    opacity: 0.86;
    height: 18px;
    text-shadow:
        0 0 6px rgba(247,217,130,0.30),
        0 0 12px rgba(56,189,248,0.16);
}

/* Temporary feedback text (auto fades out) */	
.fade-out-text {
    animation: fadeOut 5s forwards;
    font-weight: bold;
    color: #f9e7ad;
    text-shadow:
        0 0 8px rgba(247,217,130,0.52),
        0 0 18px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Guide feedback text */	
#message {
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
    color: #e0f2fe;
    opacity: 0.9;
    text-shadow:
        0 0 7px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Faculty Template feedback override */
.blank-builder-template #message {
    color: #c7ecff;
    font-size: 17px;
    font-style: italic;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.48),
        0 0 18px rgba(247,217,130,0.18),
        0 2px 6px rgba(0,0,0,0.88);
}

/* =========================================
   4. BUTTONS & INTERACTION
========================================= */

/* Base button styling — applies to all buttons */
button {
    padding: 12px 22px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(180deg, #12304f, #04101f);
    color: #eef6ff;
    border: 1px solid rgba(56,189,248,0.36);
    border-radius: 8px;
    box-shadow:
       0 0 12px rgba(56,189,248,0.20),
       0 0 24px rgba(15,23,42,0.54),
       inset 0 0 10px rgba(0,0,0,0.74);
    transition: all 0.15s ease;
}
	
/* Hover feedback — improves interactivity */
button:hover {
    background: linear-gradient(180deg, #1d4d73, #0b2238);
    border-color: rgba(247,217,130,0.72);
    box-shadow:
        0 0 18px rgba(56,189,248,0.36),
        0 0 34px rgba(247,217,130,0.24),
        inset 0 0 12px rgba(0,0,0,0.72);
    transform: translateY(-2px) scale(1.02);
}

/* Click feedback — simulates button press */	
button:active {
    transform: scale(0.96);
}

/* Answer container — controls layout of choices */	
.answers {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

/* Individual answer buttons — flexible sizing */	
.answers button {
    flex: 1 1 100%;
    min-height: 60px;
    max-width: 100%;
    padding: 15px;
    font-size: 18px;
    margin: 0;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.96),
        rgba(2,8,18,0.98));
    color: #eef6ff;
    border: 1px solid rgba(56,189,248,0.30);
    box-shadow:
        0 0 10px rgba(56,189,248,0.18),
        0 0 18px rgba(247,217,130,0.10),
        inset 0 0 14px rgba(0,0,0,0.78);
}

/* Answer hover — a little brighter than base */	
.answers button:hover {
    background: linear-gradient(180deg,
        rgba(19,57,86,0.98),
        rgba(8,24,42,0.98));
    border-color: rgba(247,217,130,0.66);
    box-shadow:
        0 0 18px rgba(56,189,248,0.34),
        0 0 34px rgba(247,217,130,0.22),
        inset 0 0 14px rgba(0,0,0,0.74);
}


.return-menu-btn{
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e0f2fe;
    background: linear-gradient(180deg, #12304f, #04101f);
    border: 1px solid rgba(56,189,248,0.32);
    border-radius: 6px;
    cursor: pointer;
    box-shadow:
        0 0 10px rgba(56,189,248,0.22),
        inset 0 0 7px rgba(0,0,0,0.80);
    transition: all 0.15s ease;
}

.return-menu-btn:hover {
    color: #f7d982;
    background: linear-gradient(180deg, #1d4d73, #0b2238);
    border-color: rgba(247,217,130,0.62);
    box-shadow:
        0 0 16px rgba(56,189,248,0.34),
        inset 0 0 8px rgba(0,0,0,0.76);
}

.return-menu-btn:active {
    transform: scale(0.95);
}

.continue-btn {
    background: linear-gradient(180deg, #1d4d73, #04101f);
    color: #f7d982;
    font-weight: bold;
    padding: 14px 40px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid rgba(247,217,130,0.56);
    cursor: pointer;
    box-shadow:
        0 0 16px rgba(56,189,248,0.32),
        0 0 34px rgba(247,217,130,0.22),
        inset 0 0 12px rgba(0,0,0,0.76);
    transition: all 0.15s ease;
}

.continue-btn:hover {
    background: linear-gradient(180deg, #24628f, #0b2238);
    box-shadow:
        0 0 24px rgba(56,189,248,0.46),
        0 0 42px rgba(247,217,130,0.28),
        inset 0 0 12px rgba(0,0,0,0.74);
    transform: scale(1.03);
}

#continueBtn:active {
    transform: scale(0.97);
    box-shadow:
        0 0 10px rgba(56,189,248,0.30),
        inset 0 0 10px rgba(0,0,0,0.82);
}

/* =========================================
   5. PROGRESS & MAZE TRACK
========================================= */
    
/* Progress bar container — background track */
	#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(3,10,24,0.96),
        rgba(2,6,23,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(56,189,248,0.26);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.86),
        0 0 10px rgba(56,189,248,0.18);
}

/* Progress fill — width controlled by JS */	
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #0b2238,
        #38bdf8,
        #f7d982);
    box-shadow:
        0 0 12px rgba(56,189,248,0.44),
        0 0 22px rgba(247,217,130,0.28);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */	
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}

/* Individual room cell — default state */	
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.72),
        rgba(2,6,23,0.94));
    border: 1px solid rgba(56,189,248,0.20);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.80),
        0 0 5px rgba(56,189,248,0.12);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */	
.maze-box.active {
    background: radial-gradient(circle,
        rgba(56,189,248,0.46),
        rgba(11,34,56,0.58),
        rgba(2,6,23,0.98));
    border: 2px solid #f7d982;
    box-shadow:
        0 0 12px rgba(56,189,248,0.72),
        0 0 24px rgba(247,217,130,0.36),
        inset 0 0 12px rgba(0,0,0,0.72);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */	
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(19,57,86,0.72),
        rgba(3,10,24,0.96));
    border-color: rgba(247,217,130,0.36);
    box-shadow:
        0 0 8px rgba(56,189,248,0.26),
        inset 0 0 10px rgba(0,0,0,0.76);
}

button.maze-box.exam-nav-room{
    appearance:none;
    padding:0;
    color:#eef6ff;
    font:800 14px/1 'Rajdhani',Arial,sans-serif;
    cursor:pointer;
}
button.maze-box.exam-nav-room:hover,
button.maze-box.exam-nav-room:focus-visible{
    border-color:#8bdcff;
    box-shadow:0 0 0 3px rgba(56,189,248,.18),0 0 14px rgba(56,189,248,.42);
    outline:none;
}
button.maze-box.exam-nav-room.exam-answered{background:linear-gradient(180deg,rgba(52,56,112,.9),rgba(14,18,52,.98));border-color:rgba(165,180,252,.68)}
button.maze-box.exam-nav-room.exam-unanswered{background:linear-gradient(180deg,rgba(30,58,88,.78),rgba(2,10,24,.98))}
button.maze-box.exam-nav-room.exam-boss-ready{background:linear-gradient(180deg,rgba(154,104,26,.92),rgba(55,31,4,.98));border-color:#f7d982;box-shadow:0 0 16px rgba(247,217,130,.42)}
button.maze-box.exam-nav-room:disabled{cursor:not-allowed;opacity:.34;filter:saturate(.35)}
.maze-box.exam-committed{opacity:.58;background:linear-gradient(180deg,rgba(19,57,86,.72),rgba(3,10,24,.96));border-color:rgba(247,217,130,.28)}
#answers button.selected,#answers button[aria-pressed="true"]{border-color:#f7d982!important;background:linear-gradient(180deg,rgba(30,78,110,.96),rgba(8,33,56,.98))!important;box-shadow:0 0 0 3px rgba(247,217,130,.16),0 0 18px rgba(56,189,248,.34)!important}

/* Boss room highlights (10, 20, 30) — visual only */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(247,217,130,0.58);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #0ea5e9,
        0 0 18px rgba(56,189,248,0.62);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f7d982,
        0 0 24px rgba(56,189,248,0.64),
        0 0 34px rgba(0,0,0,0.68);
}

/* Streak styling — Blank Mastery Quest */
.streak {
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:0.5px;
    color: rgba(238,246,255,0.96);
    text-shadow:
        0 0 7px rgba(56,189,248,0.32),
        0 2px 5px rgba(0,0,0,0.88);
}

.streak-icon {
    width:22px;
    height:22px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 8px rgba(247,217,130,0.72))
        drop-shadow(0 0 15px rgba(56,189,248,0.36));
    background: radial-gradient(circle,
        rgba(247,217,130,0.36) 0%,
        rgba(56,189,248,0.24) 42%,
        transparent 72%);
    animation: pulseControl 2.2s ease-in-out infinite;
}
	
/* =========================================
   6. ARTIFACT SYSTEM (REWARDS) — BLANK MASTERY QUEST
========================================= */

/* Reward popup — appears after boss victory */
#artifactDrop {
    margin-top: 20px;
    padding: 14px;
    background: radial-gradient(circle at center,
        rgba(56,189,248,0.18),
        rgba(15,42,64,0.70) 42%,
        rgba(4,14,28,0.94) 68%,
        rgba(2,6,23,0.99));
    border-radius: 12px;
    border: 1px solid rgba(247,217,130,0.38);
    box-shadow:
        0 0 22px rgba(56,189,248,0.24),

/* Layout container for artifact slots */	
.vaultRow {

}

/* Individual artifact slot (default = locked state) */

.artifactSlot img {

    margin-bottom:4px;
    filter:
        brightness(0.30)
        contrast(0.92)
        saturate(0.78);

.artifactSlot span {

.artifact-mechanic{max-width:150px;color:rgba(224,242,254,.78)!important;font-size:11px!important}
.artifact-status{color:#f7d982!important;font-weight:800!important;font-size:11px!important;text-transform:uppercase}
.artifact-eliminated{display:none!important}

.artifactSlot.unlocked img {

    transform: translateZ(0);
}

   7. BOSS EFFECTS & ATMOSPHERE — BLANK MASTERY QUEST
========================================= */

/* Hit animation — triggered when boss takes damage */	
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

/* Boss image display — includes floating animation */
.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

/* Checkpoint one glow */
.gatekeeperGlow {
    filter:
        drop-shadow(0 0 12px rgba(56,189,248,0.72))

}

/* Checkpoint two glow */
.wardenGlow {
    filter:
        drop-shadow(0 0 14px rgba(14,165,233,0.88))

/* Final checkpoint glow */
.arbiterGlow {
    filter:
        drop-shadow(0 0 16px rgba(247,217,130,0.92))
        drop-shadow(0 0 34px rgba(56,189,248,0.48))
        drop-shadow(0 0 46px rgba(15,42,64,0.66))
        drop-shadow(0 0 52px rgba(0,0,0,0.88));
}

/* Ambient torch effect — decorative, shown during gameplay */	
.torch {
    position: absolute;
    width: 70px;
    top: 30px;
    z-index: 10;
    animation: torchFlicker 3s infinite alternate;
    pointer-events: none;
    opacity: .9;

/* =========================================
   9. ANIMATION SYSTEM — BLANK MASTERY QUEST
========================================= */

/* Ambient civic-light flicker */
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.04) saturate(1.04);
  }
  50% {
    filter: brightness(0.97) saturate(0.99);
  }
  75% {
    filter: brightness(1.03) saturate(1.03);
  }
}

/* Damage feedback */
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss hit feedback */
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room pulse — Blank Mastery Quest */
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(56,189,248,0.56),
      0 0 16px rgba(247,217,130,0.22),
      inset 0 0 10px rgba(0,0,0,0.66);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(56,189,248,0.78),
      0 0 32px rgba(247,217,130,0.34),
      0 0 42px rgba(15,42,64,0.68),
      inset 0 0 12px rgba(0,0,0,0.70);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(56,189,248,0.62),
      0 0 24px rgba(247,217,130,0.24),
      0 0 30px rgba(15,42,64,0.60),
      inset 0 0 11px rgba(0,0,0,0.70);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(56,189,248,0.68),
      0 0 30px rgba(247,217,130,0.30),
      0 0 38px rgba(2,6,23,0.70),
      inset 0 0 12px rgba(0,0,0,0.72);
  }
}

/* Victory title glow */
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(247,217,130,0.72),
      0 0 18px rgba(56,189,248,0.24),
      0 2px 6px rgba(0,0,0,0.92);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(247,217,130,0.92),
      0 0 42px rgba(56,189,248,0.42),
      0 0 52px rgba(15,42,64,0.68),
      0 3px 8px rgba(0,0,0,0.92);
  }
}

/* Idle boss movement */
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Guide idle movement */
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Artifact pulse — Blank Mastery Quest */
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(247,217,130,0.68))
      drop-shadow(0 0 18px rgba(56,189,248,0.30))
      drop-shadow(0 0 24px rgba(0,0,0,0.62));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(247,217,130,0.90))
      drop-shadow(0 0 30px rgba(56,189,248,0.42))
      drop-shadow(0 0 38px rgba(15,42,64,0.68));
  }
}

/* Streak icon pulse */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

.mode-select-screen{
  position:fixed;

  padding:28px;

    0 0 36px rgba(0,0,0,0.82),

.mode-title{

}

.mode-subtitle{

}

.mode-grid{
  display:grid;

     Auto-fit keeps the mode menu from getting ugly now that Score Attack is a fifth card.
     If you remove Score Attack later, this still works for four cards. */
  grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));

}

.mode-card{

  padding:0;

    0 0 10px rgba(56,189,248,0.46);

#scoreFloatLayer{
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}

.score-float{
  position: absolute;
  left: 50%;
  top: var(--score-float-top, 42%);
  transform: translateX(-50%);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
  animation: scoreFloatUp 1.2s ease-out forwards;
  text-shadow:
    0 0 10px rgba(0,0,0,0.96),

}

.score-float.positive{ color: #f7d982; }
.score-float.negative{ color: #f87171; }
.score-float.neutral{ color: #c7ecff; }

@keyframes scoreFloatUp{
  0%{ opacity: 0; transform: translate(-50%, 12px) scale(.85); }
  15%{ opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  100%{ opacity: 0; transform: translate(-50%, -58px) scale(1); }
}

/* =========================================
   TOUCH DEVICE FIX — ANSWER BUTTONS ONLY
========================================= */

button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

@media (hover: none), (pointer: coarse) {

    /* Touch browsers can leave :hover latched after a tap. Keep that
       latched state identical to the normal answer-button palette. */
    .answers button:hover {
        background: linear-gradient(180deg,
            rgba(11,34,56,0.96),
            rgba(2,8,18,0.98));

        border-color: rgba(56,189,248,0.30);

        box-shadow:
            0 0 10px rgba(56,189,248,0.18),
            0 0 18px rgba(247,217,130,0.10),
            inset 0 0 14px rgba(0,0,0,0.78);

        transform: none;
    }

    /* Active tap feedback stays in the established blue/gold theme. */
    .answers button:active {
        background: linear-gradient(180deg,
            rgba(19,57,86,0.98),
            rgba(8,24,42,0.98));

        border-color: rgba(247,217,130,0.66);

        box-shadow:
            0 0 18px rgba(56,189,248,0.34),
            0 0 34px rgba(247,217,130,0.22),
            inset 0 0 14px rgba(0,0,0,0.74);

        transform: scale(0.98);
    }

    .answers button:focus,
    .answers button:focus-visible {
        outline: none;
    }
}

/* =========================================
   DAILY CHALLENGES V1 — COMPACT STATUS UI
========================================= */
.daily-task-dock{
    position:fixed;
    top:14px;
    left:50%;
    z-index:145;
    width:min(360px, calc(100vw - 28px));
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
}

.daily-task-pill{
    pointer-events:auto;
    min-height:38px;
    padding:8px 16px;
    border:1px solid rgba(247,217,130,.66);
    border-radius:999px;
    color:#f7d982;
    background:linear-gradient(180deg,rgba(20,56,83,.98),rgba(3,12,25,.98));
    box-shadow:0 0 18px rgba(56,189,248,.25),0 0 24px rgba(247,217,130,.12),inset 0 0 12px rgba(0,0,0,.62);
    font:700 12px/1.2 inherit;
    letter-spacing:1.4px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}

.daily-task-pill:hover,
.daily-task-pill:focus-visible{
    transform:translateY(1px) scale(1.02);
    border-color:#f7d982;
    box-shadow:0 0 22px rgba(56,189,248,.38),0 0 30px rgba(247,217,130,.2),inset 0 0 12px rgba(0,0,0,.62);
    outline:none;
}

.daily-task-pill.is-complete{
    color:#d1fae5;
    border-color:rgba(52,211,153,.72);
    box-shadow:0 0 18px rgba(52,211,153,.24),inset 0 0 12px rgba(0,0,0,.62);
}

.daily-details-panel{
    pointer-events:auto;
    width:100%;
    margin-top:8px;
    padding:16px;
    box-sizing:border-box;
    border:1px solid rgba(247,217,130,.42);
    border-radius:14px;
    color:#e0f2fe;
    background:linear-gradient(155deg,rgba(5,17,34,.98),rgba(2,7,18,.98));
    box-shadow:0 14px 38px rgba(0,0,0,.72),0 0 22px rgba(56,189,248,.18),inset 0 0 18px rgba(56,189,248,.05);
    text-align:left;
}

.daily-details-panel[hidden]{display:none;}
body:not(.mode-selection-active) .daily-task-dock:not(.daily-panel-open){display:none;}
body.game-active .daily-task-pill{display:none;}
.daily-details-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.daily-details-close{flex:0 0 auto;width:30px;height:30px;padding:0;border:1px solid rgba(56,189,248,.32);border-radius:999px;color:#e0f2fe;background:rgba(4,16,31,.84);font:700 18px/1 inherit;cursor:pointer;}
.daily-details-close:hover,.daily-details-close:focus-visible{color:#f7d982;border-color:rgba(247,217,130,.62);outline:none;}
.daily-details-kicker{color:#f7d982;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.daily-details-title{margin:7px 0 5px;color:#f8fbff;font-size:18px;line-height:1.3;}
.daily-details-meta{margin:0;color:rgba(224,242,254,.76);font-size:12px;line-height:1.45;}
.daily-progress-track{height:7px;margin:12px 0 10px;overflow:hidden;border-radius:999px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.2);}
.daily-progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#f7d982);box-shadow:0 0 12px rgba(247,217,130,.5);transition:width .25s ease;}
.daily-details-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.daily-stat{padding:9px;border-radius:9px;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.13);}
.daily-stat-label{display:block;color:rgba(199,236,255,.68);font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.daily-stat-value{display:block;margin-top:3px;color:#f7d982;font-size:15px;font-weight:700;}

.daily-toast-region{
    position:fixed;
    top:68px;
    left:50%;
    z-index:160;
    width:min(420px, calc(100vw - 28px));
    transform:translateX(-50%);
    pointer-events:none;
}

.daily-toast{
    pointer-events:auto;
    padding:18px 20px;
    border:1px solid rgba(247,217,130,.62);
    border-radius:16px;
    color:#eaf7ff;
    background:linear-gradient(145deg,rgba(9,31,51,.98),rgba(2,8,20,.98));
    box-shadow:0 16px 44px rgba(0,0,0,.78),0 0 30px rgba(56,189,248,.28),0 0 20px rgba(247,217,130,.14);
    cursor:pointer;
    animation:dailyToastIn .32s ease-out both;
}
.daily-toast.is-leaving{animation:dailyToastOut .24s ease-in both;}
.daily-toast.is-complete{border-color:rgba(52,211,153,.72);box-shadow:0 16px 44px rgba(0,0,0,.78),0 0 30px rgba(52,211,153,.23),0 0 20px rgba(247,217,130,.12);}
.daily-toast-kicker{color:#f7d982;font-size:11px;font-weight:700;letter-spacing:2.3px;text-transform:uppercase;}
.daily-toast-title{margin:7px 0 5px;color:#fff;font-size:20px;font-weight:700;line-height:1.25;}
.daily-toast-progress{color:#c7ecff;font-size:16px;font-weight:700;}
.daily-toast-copy{margin-top:7px;color:rgba(224,242,254,.72);font-size:12px;line-height:1.4;}

@keyframes dailyToastIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dailyToastOut{to{opacity:0;transform:translateY(-8px) scale(.98)}}

@media(max-width:560px){
    .daily-task-dock{top:8px;width:calc(100vw - 20px);}
    .daily-task-pill{min-height:34px;padding:7px 13px;font-size:11px;}
    .daily-details-panel{padding:13px;}
    .daily-toast-region{top:52px;width:calc(100vw - 20px);}
    .daily-toast{padding:15px 16px;}
    .daily-toast-title{font-size:18px;}
}

@media(prefers-reduced-motion:reduce){
    .daily-toast,.daily-toast.is-leaving{animation:none;}
    .daily-progress-fill,.daily-task-pill{transition:none;}
}

</style><div id="gameShell"><div id="gameBox" style="display:block"><div id="questionContainer"><div id="questionImageBox"></div><div id="question"></div></div></div></div><div id="graphLightbox" aria-hidden="true" role="dialog"><button id="graphLightboxClose">×</button><img id="graphLightboxImg"><p id="graphLightboxDescription" class="sr-only"></p></div><script>let questionAssetMetadata={};function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');}function resolveQuestionImage(s){return window.graphSource;}function pauseFadingFortune(){}function resumeFadingFortune(){}function setAnswerButtonsDisabled(){}function getQuestionGraphAccessibility(question){
    const rawPath = String(question?.image || "").replace(/^data\//, "");
    const filename = rawPath.split("/").pop();
    const metadata = questionAssetMetadata[rawPath]
        || questionAssetMetadata[filename]
        || Object.entries(questionAssetMetadata).find(([key]) => key.split("/").pop() === filename)?.[1]
        || {};
    return {
        imageAlt: String(metadata.imageAlt || "Economics graph with labeled axes, curves, points, and visible values."),
        graphDescription: String(metadata.graphDescription || "The graph description metadata is unavailable.")
    };
}

let questionGraphLoadFailed = false;

function renderQuestionGraph(question){
    const imageBox = document.getElementById("questionImageBox");
    if(!imageBox) return;
    questionGraphLoadFailed = false;
    if(!question?.image){
        imageBox.innerHTML = "";
        imageBox.style.display = "none";
        return;
    }
    const accessibility = getQuestionGraphAccessibility(question);
    const alt = escapeHTML(accessibility.imageAlt);
    const description = escapeHTML(accessibility.graphDescription);
    imageBox.innerHTML = `<img src="${resolveQuestionImage(question.image)}" alt="${alt}" aria-describedby="questionGraphDescription" data-graph-description="${description}" title="Click to enlarge" role="button" tabindex="0" aria-label="Open expanded graph: ${alt}"><p id="questionGraphDescription" class="sr-only">${description}</p><div class="graph-zoom-note">Click graph to enlarge</div>`;
    imageBox.style.display = "block";
    const graphImage = imageBox.querySelector("img");
    graphImage?.addEventListener("error", () => {
        questionGraphLoadFailed = true;
        imageBox.innerHTML = `<div role="alert"><strong>Required graph failed to load.</strong><br>This question cannot be answered safely. Return to the mode menu and regenerate the Quest.</div>`;
        setAnswerButtonsDisabled(true);
        const announcements = document.getElementById("srAnnouncements");
        if(announcements) announcements.innerText = "Required graph failed to load. This question cannot be answered safely.";
    }, {once:true});
}

function openGraphLightbox(src, altText, graphDescription){
    const lightbox = document.getElementById("graphLightbox");
    const lightboxImg = document.getElementById("graphLightboxImg");
    const lightboxDescription = document.getElementById("graphLightboxDescription");
    if(!lightbox || !lightboxImg || !lightboxDescription || !src) return;

    lightboxImg.src = src;
    lightboxImg.alt = altText || "Economics graph with labeled axes, curves, points, and visible values.";
    lightboxImg.setAttribute("aria-describedby", "graphLightboxDescription");
    lightboxDescription.textContent = graphDescription || "The graph description metadata is unavailable.";
    lightbox.classList.add("active");
    lightbox.setAttribute("aria-hidden", "false");
    pauseFadingFortune("graph-lightbox");
}

function closeGraphLightbox(){
    const lightbox = document.getElementById("graphLightbox");
    const lightboxImg = document.getElementById("graphLightboxImg");
    if(!lightbox) return;

    lightbox.classList.remove("active");
    lightbox.setAttribute("aria-hidden", "true");
    if(lightboxImg) lightboxImg.removeAttribute("src");
    const lightboxDescription = document.getElementById("graphLightboxDescription");
    if(lightboxDescription) lightboxDescription.textContent = "";
    resumeFadingFortune("graph-lightbox");
}

</script>
